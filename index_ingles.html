gún la estequiometría de Karl Fischer, cuál es la relación principal entre agua e yodo consumido?", "options": ["1 mol de H₂O genera 1 mol de I₂.", "2 moles de H₂O consumen 1 mol de I₂.", "1 mol de H₂O consume 1 mol de I₂.", "El consumo de I₂ no guarda relación estequiométrica con el agua."], "correct": 2, "rationale": "En la reacción global KF, el agua participa estequiométricamente con yodo y SO2 en presencia de base y alcohol. La cuantificación se basa en esa relación 1:1 entre H₂O e I₂."}, {"id": "A05Q03", "text": "¿Se estandariza el reactivo KF con 5.0 microlitros de agua pura, y se consumen 2.50 mL de reactivo. Cuál es el titulo en mg H₂O por mL de reactivo?", "options": ["12.5 mg mL ¹⁻", "5.0 mg mL ¹⁻", "0.50 mg mL ¹⁻", "2.0 mg mL ¹⁻"], "correct": 3, "rationale": "5.0 microlitros de agua equivalen a 5.0 mg si d = 1.0 g mL ¹. Dividiendo 5.0 mg entre 2.50 mL se obtiene ⁻ 2.0 mg H₂O mL ¹.⁻"}, {"id": "A05Q04", "text": "¿Por qué se recomienda la pesada por diferencia con pesasustancias de vidrio en la muestra para KF?", "options": ["Porque el vidrio aporta agua conocida al sistema.", "Porque solo la masa inicial del pesasustancias importa.", "Porque permite conocer la masa realmente transferida aunque no pase toda la muestra a la celda.", "Porque elimina la necesidad de calibrar la bureta."], "correct": 2, "rationale": "La pesada por diferencia registra masa antes y despues de la transferencia. Así se calcula la masa real introducida, algo clave cuando la transferencia no es cuantitativa."}, {"id": "A05Q05", "text": "¿Por qué se realiza una valoración en blanco antes de valorar agua o muestra en KF?", "options": ["Para secar permanentemente el laboratorio.", "Para generar yodo adicional sin gasto de reactivo.", "Para consumir/corregir el agua residual del disolvente y de la celda antes de atribuir consumo a la muestra.", "Para medir la grasa del cacao por titulación."], "correct": 2, "rationale": "El medio y la celda pueden contener agua residual. El blanco acondiciona/corrige el sistema para que el consumo posterior corresponda a la adición conocida o a la muestra."}, {"id": "A05Q06", "text": "¿Por qué un Soxhlet suele extraer grasa más eficazmente que dejar la muestra una hora en el mismo volumen total de disolvente en reposo?", "options": ["Porque el Soxhlet crea grasa por calentamiento.", "Porque el disolvente deja de obedecer la ley de distribucion.", "Porque no hay equilibrio en ningun momento del proceso.", "Porque la muestra contacta repetidamente con disolvente condensado relativamente limpio, manteniendo un gradiente de partición favorable."], "correct": 3, "rationale": "La eficiencia deriva de renovaciones sucesivas de disolvente. Cada ciclo reduce la concentración de grasa en el sólido y evita que el extractante se sature localmente."}, {"id": "A05Q07", "text": "¿Cuál es la función de la digestión ácida con HCl antes de la extracción de grasa en cacao?", "options": ["Romper estructuras de carbohidratos/proteínas y liberar grasa retenida en la matriz alimentaria.", "Transformar todos los lipidos en agua.", "Convertir el éter de petróleo en metanol.", "Oxidar la grasa para que pese más."], "correct": 0, "rationale": "La grasa puede estar atrapada en una matriz compleja. La hidrólisis/digestión ácida facilita su liberacion y mejora la recuperación en la extracción posterior."}, {"id": "A05Q08", "text": "¿Si se omite la digestión con HCl y se extrae directamente cacao triturado, qué sesgo es más probable en el porcentaje de grasa?", "options": ["Subestimación, porque parte de la grasa queda inaccesible al disolvente.", "Sobrestimación, porque el HCl es la grasa medida.", "No cambia nada, porque el tamaño de particula no importa.", "Se obtiene exactamente el mismo resultado si se extrae 30 min."], "correct": 0, "rationale": "Sin liberar completamente los lipidos de la matriz, la extracción no agota la muestra. El residuo retiene grasa y el extracto recuperado pesa menos."}, {"id": "A05Q09", "text": "¿El éter de petróleo se usa como disolvente de extracción. Cuál es una afirmacion correcta?", "options": ["Contiene grupos éster que saponifican la grasa.", "Es un disolvente acuoso no inflamable.", "No es un éter químico puro, sino una mezcla volátil de hidrocarburos alifaticos, muy inflamable.", "Es dietil éter anhidro al 100%."], "correct": 2, "rationale": "El nombre comun puede confundir. El éter de petróleo es una fracción de hidrocarburos ligeros; su volatilidad e inflamabilidad obligan a evitar llamas abiertas."}, {"id": "A05Q10", "text": "¿Por qué el recipiente de extracción se seca hasta peso constante tras evaporar el disolvente?", "options": ["Para asegurar que la masa registrada corresponde a grasa residual y no a disolvente o humedad remanente.", "Para convertir la grasa en proteína.", "Para quemar toda la grasa y pesar las cenizas.", "Para eliminar la necesidad de duplicados."], "correct": 0, "rationale": "El criterio de peso constante verifica que no queda disolvente volátil ni agua que inflen la masa de extracto. Es una condicion gravimétrica de exactitud."}, {"id": "A05Q11", "text": "¿Tras la digestión ácida, el residuo se lava hasta filtrado neutro o ensayo negativo de cloruros. Cuál es el motivo principal?", "options": ["Eliminar ácido y sales que podrían contaminar el cartucho, afectar al secado y deteriorar la extracción o el equipo.", "Eliminar selectivamente la grasa ya extraida.", "Convertir HCl en tocoferoles.", "Aumentar el contenido de cloruros para mejorar el Soxhlet."], "correct": 0, "rationale": "El HCl residual y sales solubles no forman parte de la grasa y pueden generar problemas de corrosion, humedad residual o masa no atribuible al analito."}, {"id": "A05Q12", "text": "¿Por qué se enfria el recipiente en desecador antes de pesarlo en la determinación de grasa?", "options": ["Para cristalizar el éter de petróleo.", "Para evitar convección por recipiente caliente y readsorción de humedad ambiental durante el enfriamiento.", "Porque la balanza solo pesa objetos frios.", "Para aumentar la masa de grasa por condensacion de agua."], "correct": 1, "rationale": "Pesar en caliente genera errores por corrientes de aire y flotabilidad. El desecador permite enfriar en atmosfera seca, manteniendo la masa estable."}, {"id": "A05Q13", "text": "¿En KF, la muestra de cacao forma una suspensión en metanol. Qué condicion es importante para la validez del resultado?", "options": ["Que la grasa precipite como sulfato de amonio.", "Que el metanol contenga una cantidad alta de agua.", "Que el agua de la muestra se transfiera cuantitativamente al medio reactivo durante la valoración.", "Que todos los sólidos se disuelvan como iones coloreados."], "correct": 2, "rationale": "La muestra no necesita disolverse por completo si el agua accesible se extrae y reacciona cuantitativamente. La transferencia de agua, no la disolución total de la matriz, es la clave."}, {"id": "A05Q14", "text": "¿Por qué la determinación KF es más sensible a la contaminación ambiental que una humedad por estufa con varios gramos de muestra?", "options": ["Porque el cacao no adsorbe agua.", "Porque el yodo no reacciona con agua ambiental.", "Porque la estufa no mide agua.", "Porque usa masas pequeñas y mide directamente trazas de agua en un sistema anhidro."], "correct": 3, "rationale": "Unos pocos miligramos de agua accidental son relevantes frente a 50 mg de muestra y un titulante sensible. En gravimetría con masas mayores, el efecto relativo suele ser menor."}, {"id": "A05Q15", "text": "¿Si el cartucho con residuo acuoso no se seca bien antes de Soxhlet, qué problema puede aparecer?", "options": ["El Soxhlet se convierte automaticamente en KF.", "La grasa desaparece por sublimacion.", "El agua residual puede dificultar el contacto con el disolvente apolar y contribuir a masas o extracciones no reproducibles.", "El agua mejora siempre la solubilidad de la grasa en éter de petróleo."], "correct": 2, "rationale": "La extracción con disolventes apolares requiere una matriz seca. El agua puede bloquear poros, formar emulsiones o alterar la transferencia de lipidos."}], "6": [{"id": "A06Q01", "text": "¿Al desarrollar desde cero un método FAAS para Fe y Mn en hojas de té, cuál es el primer problema qué debe resolverse antes de calibrar?", "options": ["Evitar cualquier blanco, porque los blancos solo se usan en volumetria.", "Elegir el color de la llama por motivos esteticos.", "Medir hojas enteras directamente con la llama sin preparación.", "Convertir cuantitativamente una muestra solida heterogenea en una disolución representativa compatible con nebulizacion."], "correct": 3, "rationale": "La FAAS requiere una disolución homogenea. La digestión, dilución y control de blancos determinan recuperación, contaminación y compatibilidad de matriz."}, {"id": "A06Q02", "text": "¿Qué comparación permite evaluar si la matriz digerida del te modifica la sensibilidad para Fe o Mn?", "options": ["Comparar calibración externa acuosa con adiciones estándar en la muestra digerida.", "Comparar dos lámparas de distinto color sin patrones.", "Medir solo el patrón más concentrado.", "Eliminar la digestión ácida."], "correct": 0, "rationale": "La adición estándar incorpora la matriz real en todos los puntos. Si la pendiente difiere de la calibración externa, hay efecto de matriz en nebulizacion/atomizacion o fondo."}, {"id": "A06Q03", "text": "¿Por qué debe incluirse un blanco de procedimiento en el análisis de metales traza en te?", "options": ["Para corregir contaminaciones procedentes de ácidos, agua, material de vidrio y digestión.", "Para sustituir todos los patrones de calibrado.", "Para medir la proteína del te.", "Para aumentar la concentración de Fe de las muestras."], "correct": 0, "rationale": "En trazas, pequeñas contaminaciones pueden ser comparables al analito. El blanco de procedimiento acompana todas las etapas excepto la muestra y permite detectar o corregir aporte externo."}, {"id": "A06Q04", "text": "¿Si el digerido de té contiene particulas finas y se introduce directamente en el nebulizador de FAAS, qué riesgo es más importante?", "options": ["Obstruccion o nebulizacion inestable, con señales erraticas y posible dano instrumental.", "Aumento inevitable de la exactitud por transporte de sólidos.", "Formación de micelas de SDS.", "Desaparición del ruido de fondo."], "correct": 0, "rationale": "La FAAS con nebulizacion necesita soluciones limpias. Particulas alteran el aerosol, bloquean capilares y deterioran precisión."}, {"id": "A06Q05", "text": "¿Por qué las disoluciones patrón para calibración externa deberían tener una acidez similar a la de los digeridos?", "options": ["Porque el agua no permite absorbancia atomica.", "Porque la acidez influye en viscosidad, tension superficial, nebulizacion y estabilidad de los metales en disolución.", "Porque así se evita usar lámparas de cátodo hueco.", "Porque el ácido es el analito que se mide a la longitud de onda de Fe."], "correct": 1, "rationale": "La matriz ácida condiciona el transporte al quemador y la química en disolución. Igualar acidez reduce diferencias entre patrones y muestras."}, {"id": "A06Q06", "text": "¿Qué función tiene seleccionar una línea de resonancia adecuada y una lámpara específica para Fe o Mn en AAS?", "options": ["Eliminar la necesidad de optimizar la llama.", "Convertir la FAAS en cromatografía.", "Hacer que todos los metales absorban a la misma longitud de onda.", "Aumentar selectividad y sensibilidad al medir absorción atomica en una transicion caracteristica del elemento."], "correct": 3, "rationale": "AAS se basa en absorción de atomos libres a líneas estrechas. La fuente elemental y la longitud de onda seleccionada son claves para selectividad."}, {"id": "A06Q07", "text": "¿Si la absorbancia de una muestra de té cae por encima del rango lineal de la curva de Fe, qué debe hacerse?", "options": ["Cambiar el resultado a porcentaje de humedad.", "Restar el blanco dos veces para que baje la absorbancia.", "Diluir el digerido en una matriz ácida compatible y repetir la medida dentro del rango.", "Extrapolar sin límites porque la ley de Beer siempre se cumple en llama."], "correct": 2, "rationale": "La linealidad en FAAS tiene un intervalo limitado. La dilución conserva el analito y permite interpolar con menor sesgo."}, {"id": "A06Q08", "text": "¿Una recuperación de Fe del 70% en una muestra fortificada antes de la digestión indica principalmente:?", "options": ["Que la lámpara de Mn mide Fe automaticamente.", "Perdidas, digestión incompleta, precipitacion o efecto de matriz que impide recuperar cuantitativamente el analito.", "Que el té no contiene Fe en absoluto.", "Que el blanco de reactivos está perfectamente corregido."], "correct": 1, "rationale": "Los ensayos de recuperación evaluan el procedimiento completo. Una recuperación baja apunta a sesgo de preparación o medida y requiere optimizacion."}, {"id": "A06Q09", "text": "¿Por qué puede ser necesario usar corrección de fondo en FAAS de digeridos vegetales?", "options": ["Porque la corrección de fondo sustituye a la calibración.", "Porque Fe y Mn no tienen líneas atomicas.", "Porque la matriz residual puede producir absorción o dispersión no atomica que se suma a la señal analítica.", "Porque el fondo elimina los atomos libres."], "correct": 2, "rationale": "Digeridos de matrices complejas pueden aportar absorción molecular o dispersión. La corrección de fondo ayuda a separar señal atomica de contribuciones no específicas."}, {"id": "A06Q10", "text": "¿Si se cambia la relación combustible/oxidante de la llama, que parametro analítico puede verse afectado?", "options": ["La concentración nominal de los patrones guardados.", "La eficiencia de atomizacion y la formación de oxidos o especies refractarias, especialmente para algunos metales.", "La masa pesada del te ya digerido.", "La longitud del tubo capilar de CE."], "correct": 1, "rationale": "La temperatura y estequiometría de llama determinan la poblacion de atomos libres. Una llama no optimizada puede reducir sensibilidad o aumentar interferencias."}, {"id": "A06Q11", "text": "¿Un estudiante prepara patrones de Fe y Mn juntos. Qué ventaja práctica tiene una calibración multielemental si las líneas se miden separadamente?", "options": ["Hace innecesario verificar linealidad individual.", "Reduce preparación y mantiene matrices de calibrado equivalentes, siempre que no haya incompatibilidades químicas o concentraciones fuera de rango.", "Evita que se necesite blanco.", "Permite medir Fe y Mn exactamente a la misma longitud de onda."], "correct": 1, "rationale": "Las mezclas multielementales son prácticas, pero cada elemento mantiene su propia respuesta, rango lineal y condiciones de medida. Deben verificarse estabilidad y ausencia de interferencias."}, {"id": "A06Q12", "text": "¿Si la muestra se mineraliza en recipientes contaminados con Fe, que patrón de resultados esperarias?", "options": ["Solo aumento de Mn, nunca de Fe.", "Blancos elevados y posible sobrestimación sistemática de Fe en las muestras.", "Disminución exacta del Fe por adsorción de luz.", "Mayor precisión sin sesgo."], "correct": 1, "rationale": "La contaminación externa se suma al analito. Si no se detecta con blancos adecuados, genera un sesgo positivo, especialmente grave en metales traza."}, {"id": "A06Q13", "text": "¿Cuál es la mejor forma de estimar experimentalmente LOD para Fe en este método?", "options": ["Dividir la masa de té por la temperatura de llama.", "Usar la absorbancia del patrón más concentrado como ruido.", "Medir repetidamente blancos de procedimiento y relacionar la desviación estándar del blanco con la pendiente de calibrado.", "Tomar el límite legal de Fe como LOD."], "correct": 2, "rationale": "Un enfoque comun es LOD = k*s_blanco/m, donde s_blanco refleja ruido/contaminación del procedimiento y m es la sensibilidad de la calibración."}, {"id": "A06Q14", "text": "¿Si la digestión deja una alta concentración de sales disueltas, qué efecto físico puede afectar a la FAAS?", "options": ["Cambios en viscosidad y formación de aerosol, ademas de posibles depositos en el quemador.", "Transformacion de Fe en creatinina.", "El detector FID sustituye al fotomultiplicador.", "Desaparición de la llama por ausencia de combustible."], "correct": 0, "rationale": "La nebulizacion y transporte dependen de propiedades físicas de la disolución. Matrices salinas pueden reducir sensibilidad, incrementar ruido y ensuciar el sistema."}, {"id": "A06Q15", "text": "¿En una práctica de desarrollo metodológico, por qué no basta con obtener un R² alto en la curva de calibrado acuosa?", "options": ["Porque R² alto significa que no hay analito.", "Porque la linealidad de patrones no demuestra recuperación, ausencia de matriz, exactitud ni robustez en muestras reales.", "Porque los patrones acuosos tienen siempre la misma composición que el té.", "Porque R² solo se usa en refractometría."], "correct": 1, "rationale": "La validación requiere evaluar el método completo. Una recta bonita no garantiza que el digestado de té se comporte como los patrones ni que la preparación sea cuantitativa."}], "7": [{"id": "A07Q01", "text": "¿Por qué no se inyecta directamente el aceite en GC para obtener el perfil de ácidos grasos?", "options": ["Porque el FID solo responde a agua.", "Porque los ácidos grasos no contienen carbono.", "Porque la transesterificación elimina todos los ácidos grasos.", "Porque los triglicéridos tienen baja volatilidad y pueden degradarse; se convierten en ésteres metílicos más volátiles y aptos para GC."], "correct": 3, "rationale": "GC requiere analitos suficientemente volátiles y térmicamente estables. Los FAMEs cumplen mejor esas condiciones que los triglicéridos originales."}, {"id": "A07Q02", "text": "¿En la transesterificación en frio se añade KOH metanolico. Cuál es su función principal?", "options": ["Convertir hexano en agua.", "Catalizar la conversión de acilgliceroles en ésteres metílicos de ácidos grasos.", "Actuar como detector fluorescente de tocoferoles.", "Precipitar todos los FAMEs como sales insolubles."], "correct": 1, "rationale": "La base en metanol favorece el intercambio acilo-alcohol para formar metil ésteres. Es una preparación de muestra, no una etapa cromatográfica."}, {"id": "A07Q03", "text": "¿Despues de la transesterificación se separan dos fases y se toma la superior en hexano. Por qué?", "options": ["La fase superior es siempre el patrón interno acuoso.", "Los FAMEs son sales inorganicas solubles solo en metanol.", "El hexano contiene exclusivamente KOH y agua.", "Los FAMEs son apolares y se extraen preferentemente en la fase orgánica de hexano."], "correct": 3, "rationale": "Los ésteres metílicos son hidrofobicos y solubles en hexano. Tomar la fase orgánica permite inyectar una matriz compatible con GC."}, {"id": "A07Q04", "text": "¿El método indica que la transesterificación directa es adecuada si la acidez libre no supera cierto valor. Qué problema pueden causar muchos ácidos grasos libres en medio basico?", "options": ["Desaparición de todos los triglicéridos antes de reaccionar.", "Conversión cuantitativa de KOH en Fe(SCN)2+.", "Aumento inevitable de fluorescencia de tocoferoles.", "Formación de jabones/emulsiones y recuperación menos reproducible de FAMEs."], "correct": 3, "rationale": "Los ácidos grasos libres reaccionan con base formando sales. Esto puede crear emulsiones, dificultar separación de fases y sesgar el perfil."}, {"id": "A07Q05", "text": "¿Por qué se usa inyección con division de flujo 1:50 en el GC-FID?", "options": ["Para evitar sobrecargar la columna y mejorar forma/resolución de picos en muestras concentradas.", "Para eliminar la necesidad de gas portador.", "Para aumentar 50 veces la masa que entra en la columna.", "Para convertir FID en detector de fluorescencia."], "correct": 0, "rationale": "Las disoluciones de aceites derivatizados pueden ser concentradas. El split reduce la cantidad que entra en columna, evitando saturación y ensanchamiento de picos."}, {"id": "A07Q06", "text": "¿El perfil de ácidos grasos se calcula por normalizacion de áreas. Cuál es la hipótesis principal de está aproximación?", "options": ["Que cada ácido graso tiene exactamente la misma masa molecular.", "Que el área de un pico no depende de la cantidad.", "Que no es necesario identificar ningun pico.", "Que los picos integrados representan prácticamente la totalidad de FAMEs relevantes y que las respuestas relativas son comparables."], "correct": 3, "rationale": "La normalizacion interna expresa cada área frente a la suma. Funciona como perfil relativo si los picos relevantes están incluidos y la respuesta FID es suficientemente uniforme para FAMEs similares."}, {"id": "A07Q07", "text": "¿En una columna polar de poli(etilenglicol), por qué pueden separarse FAMEs con igual número de carbonos pero distinto número de dobles enlaces?", "options": ["Los dobles enlaces eliminan la volatilidad de los FAMEs por completo.", "Los dobles enlaces modifican polarizabilidad, geometría e interacciones con la fase estacionaria, cambiando retencion.", "La fase polar solo separa compuestos iónicos.", "Todos los C18 deben coeluir necesariamente."], "correct": 1, "rationale": "La retencion en GC no depende solo del punto de ebullicion. La insaturacion y la interaccion con la fase polar afectan selectividad entre FAMEs relacionados."}, {"id": "A07Q08", "text": "¿Por qué la detección fluorimétrica es ventajosa para tocoferoles frente a UV convencional en aceite?", "options": ["Porque la fluorescencia mide directamente todos los ácidos grasos.", "Porque los tocoferoles son fluorescentes y la FLD ofrece mayor selectividad y sensibilidad frente a la matriz mayoritaria de triglicéridos.", "Porque los triglicéridos emiten exactamente igual que los tocoferoles.", "Porque la FLD no requiere separación cromatográfica."], "correct": 1, "rationale": "Los tocoferoles están en la fracción minoritaria y tienen cromanol fluorescente. La detección por excitacion/emisión reduce interferencias de componentes no fluorescentes."}, {"id": "A07Q09", "text": "¿Por qué se añade BHT al isopropanol usado para patrones y muestras de tocoferoles?", "options": ["Para aumentar la acidez libre del aceite.", "Para convertir los tocoferoles en FAMEs.", "Para oxidar cuantitativamente los tocoferoles antes de medirlos.", "Para proteger los tocoferoles de oxidación durante preparación y almacenamiento."], "correct": 3, "rationale": "Los tocoferoles son antioxidantes y pueden degradarse por oxidación. BHT actua como antioxidante protector, estabilizando patrones y muestras."}, {"id": "A07Q10", "text": "¿Si los patrones de tocoferoles se dejan varios días a temperatura ambiente y luz, qué efecto es esperable en la curva de calibrado?", "options": ["Disminución de concentración real de patrones por degradación, con pendiente sesgada y cuantificación incorrecta.", "Ningun efecto, porque los tocoferoles son inertes a luz y oxigeno.", "Aumento exacto de concentración por evaporación de tocoferol.", "Desaparición de la fase móvil."], "correct": 0, "rationale": "La degradación de patrones rompe la relación entre concentración nominal y real. Según el modo en que se usen, puede sesgar pendiente y resultados de muestra."}, {"id": "A07Q11", "text": "¿En HPLC de fase reversa C18 para tocoferoles, qué factor domina la retencion general?", "options": ["La volatilidad a 250 °C.", "La conductividad eléctrica del aceite.", "La formación de complejos Fe-SCN.", "La hidrofobicidad y las interacciones con la fase estacionaria apolar."], "correct": 3, "rationale": "En fase reversa, analitos más hidrofobicos interaccionan más con C18 y tienden a retenerse más, aunque isomeria y composición de fase móvil también influyen."}, {"id": "A07Q12", "text": "¿Por qué filtrar y desgasificar la fase móvil antes del HPLC?", "options": ["Para evitar particulas, sobrepresion, ruido de línea base y burbujas en el detector.", "Para eliminar la necesidad de columna.", "Para aumentar el contenido de tocoferoles de la fase móvil.", "Para convertir metanol en hexano."], "correct": 0, "rationale": "Particulas pueden obstruir el sistema y gases disueltos generan burbujas, ruido y deriva. Es un control instrumental basico en LC."}, {"id": "A07Q13", "text": "¿Un aceite de oliva adulterado con girasol alto oleico puede pasar desapercibido si solo se observan relaciones oleico/linoleico. Por qué ayuda analizar tocoferoles?", "options": ["Porque la fracción minoritaria de tocoferoles conserva patrones botánicos diferentes que complementan el perfil mayoritario de ácidos grasos.", "Porque el HPLC transforma girasol en oliva.", "Porque los tocoferoles son el 99% del aceite.", "Porque todos los aceites de semillas carecen completamente de tocoferoles."], "correct": 0, "rationale": "Un adulterante puede imitar el perfil de ácidos grasos, pero no necesariamente la huella de compuestos minoritarios. La combinacion de perfiles aumenta poder discriminante."}, {"id": "A07Q14", "text": "¿Si el cromatograma GC contiene un pico no integrado que corresponde a un FAME minoritario relevante, cómo afectará a las áreas relativas normalizadas?", "options": ["Los porcentajes de los picos integrados quedaran artificialmente sobrestimados al faltar parte de la suma real.", "Todos los picos integrados se harán cero.", "No cambiara ningun porcentaje, porque la normalizacion corrige picos ausentes.", "Solo se afectará el tiempo de retencion, no el área."], "correct": 0, "rationale": "La normalizacion se basa en la suma de áreas incluidas. Si se omite un componente real, el denominador es demasiado pequeño y las fracciones restantes se inflan."}, {"id": "A07Q15", "text": "¿Una muestra de tocoferoles da señales superiores al intervalo lineal 0.2-2 mg L ¹. Cuál es la decisión ⁻ correcta?", "options": ["Aumentar el volumen de inyección para saturar mejor el detector.", "Extrapolar porque la fluorescencia siempre es lineal hasta cualquier concentración.", "Cambiar los resultados a porcentaje de grasa.", "Diluir con isopropanol/BHT y repetir la inyección dentro del intervalo validado."], "correct": 3, "rationale": "La fluorescencia puede sufrir no linealidad o efecto filtro a concentraciones altas. La dilución conserva la matriz y permite interpolar."}], "8": [{"id": "A08Q01", "text": "¿Qué mide directamente el método Kjeldahl en una muestra de pasta?", "options": ["Gluten exclusivamente, sin otros compuestos nitrogenados.", "Carbono orgánico oxidable.", "Enlaces peptidicos por absorción infrarroja directa.", "Nitrógeno total convertido en amonio bajo las condiciones del método, no proteína molecular intacta."], "correct": 3, "rationale": "Kjeldahl transforma nitrógeno orgánico en amonio, libera NH3 y lo valora. La proteína se estima despues mediante un factor de conversión."}, {"id": "A08Q02", "text": "¿Por qué para pasta de trigo se prefiere un factor de conversión específico como 5.70 en lugar del factor generico 6.25?", "options": ["Porque el factor 6.25 solo se aplica a metales.", "Porque el factor depende de la temperatura de destilación, no de la matriz.", "Porque el trigo contiene exactamente 62.5% de nitrógeno.", "Porque la fracción de nitrógeno en las proteínas depende de la composición aminoacidica de la matriz."], "correct": 3, "rationale": "El factor convierte N a proteína suponiendo un porcentaje medio de N. Proteínas de distintas materias primas tienen composiciones aminoacídicas distintas, por tanto distinto porcentaje de N."}, {"id": "A08Q03", "text": "¿Una pasta adulterada con melamina daría un resultado Kjeldahl artificialmente alto. Por qué?", "options": ["Porque la melamina reduce el indicador a 880 nm.", "Porque la melamina contiene ácidos grasos que se destilan como NH3.", "Porque Kjeldahl responde a nitrógeno total y no distingue si procede de proteína o de un compuesto nitrogenado no proteico.", "Porque el factor de trigo elimina automaticamente toda melamina."], "correct": 2, "rationale": "El método no verifica enlaces peptidicos. Cualquier fuente de nitrógeno susceptible de contabilizarse puede inflar el resultado de proteína aparente."}, {"id": "A08Q04", "text": "¿En la digestión Kjeldahl, qué función desempena K2SO4 en la pastilla catalizadora?", "options": ["Absorber el NH3 destilado en el Erlenmeyer.", "Elevar el punto de ebullicion efectivo del medio sulfúrico y permitir temperaturas de digestión más altas.", "Actuar como patrón primario de nitrógeno.", "Neutralizar el NaOH antes de añadirlo."], "correct": 1, "rationale": "K2SO4 aumenta la temperatura de ebullicion de la mezcla ácida, acelerando y haciendo más eficaz la destruccion de materia orgánica."}, {"id": "A08Q05", "text": "¿Cuál es el papel principal de CuSO4 en la digestión?", "options": ["Formar el complejo coloreado final con NH3 que se titula.", "Convertir HCl en NaOH.", "Sustituir al ácido borico como receptor.", "Actuar como catalizador de la oxidación/digestión de la materia orgánica."], "correct": 3, "rationale": "El cobre cataliza la digestión, acelerando la conversión del nitrógeno orgánico a formas amoniacales en el medio sulfúrico."}, {"id": "A08Q06", "text": "¿Si la digestión no se completa, cuál es el sesgo esperado en el porcentaje de proteína?", "options": ["Subestimación, porque parte del nitrógeno no se convierte en amonio recuperable.", "Sobrestimación, porque el carbono se valora como NH3.", "Aumento de proteína por evaporación de agua.", "Ningun sesgo si se destilan 150 mL."], "correct": 0, "rationale": "La etapa de digestión define la recuperación de N. Si no se transforma cuantitativamente, no se liberara todo el NH3 en la destilación."}, {"id": "A08Q07", "text": "¿Por qué se añade NaOH concentrado al digerido antes de destilar?", "options": ["Para precipitar todo el nitrógeno como proteína.", "Para convertir NH4+ en NH3 volátil, que puede arrastrarse por destilación.", "Para destruir el ácido borico receptor.", "Para disminuir el pH hasta valores fuertemente ácidos."], "correct": 1, "rationale": "La alcalinizacion desplaza NH4+/NH3 hacia NH3, especie volátil. Sin base suficiente, el amonio permaneceria en disolución."}, {"id": "A08Q08", "text": "¿Por qué la alargadera del refrigerante debe quedar sumergida en la disolución de ácido borico?", "options": ["Para capturar cuantitativamente el NH3 destilado y evitar perdidas a la atmosfera.", "Para que la muestra solida caiga en el Erlenmeyer.", "Para medir la temperatura del bloque digestor.", "Para evitar que el HCl entre en la bureta."], "correct": 0, "rationale": "El NH3 debe burbujear en el receptor y protonarse. Si la punta no está sumergida, parte del gas puede escaparse y subestimar N."}, {"id": "A08Q09", "text": "¿Por qué no es necesario conocer con exactitud extrema el volumen de ácido borico receptor?", "options": ["Porque la concentración de HCl no importa.", "Porque el ácido borico no participa en ninguna reacción.", "Porque siempre se evapora completamente.", "Porque el ácido borico actua como receptor y se valora el borato generado por el NH3 captado, no un exceso de ácido fuerte añadido con volumen exacto."], "correct": 3, "rationale": "En este esquema se valora la cantidad de NH3 captada a traves del borato formado. El volumen de receptor debe estar en exceso suficiente, pero no funciona como una alícuota exacta de titulante fuerte."}, {"id": "A08Q10", "text": "¿Qué implicación tiene usar HCl no estandarizado para valorar el destilado?", "options": ["Solo afectaria al color inicial, no al resultado.", "La concentración real del titulante sería incierta y el contenido de nitrógeno tendría sesgo proporcional.", "El indicador dejaría de virar.", "El NH3 se convertiria en K2SO4."], "correct": 1, "rationale": "La cantidad de nitrógeno se calcula a partir de moles de H consumidos. Si la molaridad del HCl no es ⁺ conocida, la exactitud del resultado se compromete."}, {"id": "A08Q11", "text": "¿Si parte de la muestra molida queda pegada a las paredes superiores del tubo y no contacta con H₂SO₄ durante la digestión, que ocurre?", "options": ["La muestra se corrige automaticamente en la destilación.", "Puede quedar nitrógeno sin digerir y subestimarse la proteína.", "Solo cambia el volumen de NaOH requerido por el equipo.", "Se obtiene una mejora de recuperación por digestión en seco."], "correct": 1, "rationale": "Toda la muestra debe estar en el medio digestivo. Material fuera de contacto efectivo no se convierte cuantitativamente en sulfato de amonio."}, {"id": "A08Q12", "text": "¿Por qué se añade agua lentamente al tubo digerido frio antes de destilar?", "options": ["Para diluir el ácido borico receptor.", "Para controlar la fuerte exoterma de dilución del ácido sulfúrico y evitar proyecciones o perdidas.", "Para precipitar el NH3 antes de que se forme.", "Para aumentar artificialmente la masa de proteína."], "correct": 1, "rationale": "El ácido sulfúrico concentrado libera mucho calor al diluirse. La adición controlada evita ebullicion violenta, salpicaduras y riesgos de seguridad."}, {"id": "A08Q13", "text": "¿Un blanco de reactivos en Kjeldahl consume un volumen apreciable de HCl. Qué indica?", "options": ["El HCl no reacciona con borato.", "Existe aporte de nitrógeno/amonio o contaminación de reactivos/procedimiento qué debe corregirse o investigarse.", "La digestión fue necesariamente completa.", "La muestra contiene mucha proteína."], "correct": 1, "rationale": "El blanco evalua el consumo no atribuible a la muestra. Un blanco alto afecta especialmente a muestras con bajo N y puede revelar contaminación."}, {"id": "A08Q14", "text": "¿Si se destila durante demasiado poco tiempo y no se recupera todo el NH3, qué efecto tendrá el resultado?", "options": ["Conversión del borato en fosfato.", "Subestimación del nitrógeno y de la proteína calculada.", "Sobrestimación por exceso de agua destilada.", "Ningun efecto si el indicador vira."], "correct": 1, "rationale": "La destilación debe transferir cuantitativamente el NH3 al receptor. Una recuperación incompleta reduce el volumen de HCl consumido y el N calculado."}, {"id": "A08Q15", "text": "¿Cuál de las siguientes expresiones resume correctamente el calculo conceptual de proteína por Kjeldahl?", "options": ["pH del suelo -> factor Van Bemmelen -> proteína.", "Absorbancia a 484 nm -> glucosa -> proteína.", "Masa de grasa Soxhlet -> nitrógeno -> proteína.", "Moles de HCl equivalentes a NH3 -> masa de N -> porcentaje de N -> multiplicacion por factor de matriz."], "correct": 3, "rationale": "La cadena metrológica es titulación ácido-base del NH3 captado, conversión a nitrógeno y aplicación del factor de proteína correspondiente."}], "9": [{"id": "A09Q01", "text": "¿Por qué se añade KSCN en gran exceso frente al Fe(III) en el dispositivo en papel?", "options": ["Para que el tiocianato sea el analito limitante.", "Para desplazar el equilibrio hacia la formación del complejo coloreado y hacer que la señal dependa principalmente del Fe(III).", "Para eliminar el color del complejo.", "Para precipitar Fe(III) como hidroxido."], "correct": 1, "rationale": "El exceso de ligando estabiliza la formación del complejo Fe-SCN. Así se minimiza la variación de señal por pequeñas diferencias de SCN y se relaciona mejor color con Fe.⁻"}, {"id": "A09Q02", "text": "¿Qué ocurre al calentar el papel con circulos de cera a 100 °C?", "options": ["La cera se funde y penetra en la porosidad de la celulosa, creando una barrera hidrofobica que confina el líquido.", "La cera se disuelve en el agua de muestra.", "El Fe(III) se reduce a Fe(0).", "La celulosa se convierte en vidrio impermeable."], "correct": 0, "rationale": "La fabricacion del microdispositivo aprovecha la hidrofobicidad de la cera y la capilaridad del papel. Al fundirla, se crea una pared que limita el flujo lateral."}, {"id": "A09Q03", "text": "¿Por qué se cubre la parte posterior del papel con cinta adhesiva transparente?", "options": ["Para evitar que la disolución atraviese el papel y se pierda volumen por la parte posterior.", "Para hacer que el papel sea conductor eléctrico.", "Para aumentar la concentración de Fe en la muestra.", "Para aportar tiocianato al sistema."], "correct": 0, "rationale": "En microvolúmenes, una pequeña perdida cambia concentración local, área mojada y color. La cinta mejora confinamiento y reproducibilidad."}, {"id": "A09Q04", "text": "¿El color se acumula más en el borde del circulo que en el centro por evaporación radial. Qué consecuencia tiene seleccionar ROIs de distinto tamaño entre patrones y muestras?", "options": ["Hace que el Fe desaparezca del papel.", "Introduce variabilidad o sesgo porque cada ROI promedia proporciones distintas de borde intenso y centro menos intenso.", "No afecta, porque todos los píxeles tienen siempre el mismo valor.", "Convierte la imagen a escala de pH."], "correct": 1, "rationale": "La heterogeneidad espacial convierte el criterio de selección de ROI en parte del método analítico. Debe mantenerse constante."}, {"id": "A09Q05", "text": "¿Por qué se espera un tiempo fijo antes de fotografiar el dispositivo tras añadir SCN ?⁻", "options": ["Para que la cámara aumente su resolución.", "Porque despues de 5 min todos los interferentes desaparecen.", "Para que el complejo se evapore por completo.", "Para que el desarrollo de color, la distribucion del líquido y la evaporación parcial sean comparables entre puntos."], "correct": 3, "rationale": "En un soporte poroso, reacción y transporte evolucionan con el tiempo. Fotografiar a tiempos diferentes cambia la señal por razones no relacionadas con concentración."}, {"id": "A09Q06", "text": "¿El complejo Fe(SCN)2+ es marron rojizo. En análisis RGB, que canal suele ser especialmente informativo para aumentar contraste?", "options": ["El canal rojo exclusivamente, porque siempre aumenta con el color rojo.", "Ningun canal, porque RGB no contiene informacion cuantitativa.", "El canal verde, complementario en gran medida al tono rojo/marron.", "El canal alfa, aunque la imagen no tenga transparencia."], "correct": 2, "rationale": "Un color rojizo absorbe en regiones complementarias. A menudo el canal verde muestra disminuciones de intensidad sensibles al desarrollo del color."}, {"id": "A09Q07", "text": "¿Una muestra muy concentrada produce píxeles saturados en una imagen de 8 bits. Cuál es la acción analítica correcta?", "options": ["Usar el mismo valor saturado para todas las muestras.", "Aumentar artificialmente el contraste despues de medir.", "Diluir la muestra o ajustar adquisición para volver al rango lineal de respuesta.", "Extrapolar porque la saturación mejora la precisión."], "correct": 2, "rationale": "Cuando los píxeles alcanzan 0 o 255, incrementos de concentración ya no producen cambios proporcionales. La cuantificación debe hacerse sin saturación."}, {"id": "A09Q08", "text": "¿Qué control mejora más la comparabilidad de fotografías tomadas con smartphone?", "options": ["Fotografiar cada patrón en una habitación distinta.", "Dejar que el telefono elija libremente exposicion y balance de blancos para cada imagen.", "Usar iluminación fija, distancia constante, fondo controlado y, si es posible, bloqueo de exposicion/balance de blancos.", "Usar siempre zoom digital máximo."], "correct": 2, "rationale": "La señal depende tanto de la química como de la captura. La estandarización de iluminación y geometría reduce variabilidad instrumental."}, {"id": "A09Q09", "text": "¿Cómo validarias un script de IA que calcula la media de gris de una ROI antes de usarlo con muestras reales?", "options": ["Comparando el nombre del archivo con la concentración.", "Usandolo directamente si el código parece largo.", "Analizando imágenes patrón con regiones de valores RGB conocidos y comprobando que devuelve medias aritméticas correctas.", "Verificando solo que la interfaz tenga colores agradables."], "correct": 2, "rationale": "Un patrón digital conocido permite probar matemáticamente el algoritmo: lectura de píxeles, selección de ROI, conversión a gris y calculo de media."}, {"id": "A09Q10", "text": "¿Un catión interferente forma también complejos coloreados con SCN o altera la disponibilidad de SCN . Qué⁻ ⁻ efecto puede producir?", "options": ["Transformar el papel en una columna HPLC.", "Cambiar la señal de Fe aparente por color adicional o competencia química.", "Eliminar la necesidad de calibrado.", "Hacer que la cámara mida absorbancia atomica."], "correct": 1, "rationale": "La selectividad química no depende del soporte en papel. Especies que reaccionan con el ligando o aportan color en el canal medido pueden sesgar el resultado."}, {"id": "A09Q11", "text": "¿Una muestra de agua real da una intensidad fuera del rango de los patrones 10-100 mg L ¹. Qué debe ⁻ hacerse?", "options": ["Eliminar el punto de calibrado más bajo.", "Ajustar la muestra mediante dilución o preparar un rango de calibrado valido, evitando extrapolar sin validación.", "Asignarle directamente el valor de 100 mg L ¹.⁻", "Cambiar de canal hasta que coincida con el calibrado."], "correct": 1, "rationale": "La calibración solo garantiza interpolación en el rango estudiado. Fuera de rango hay riesgo de no linealidad, saturación o falta de sensibilidad."}, {"id": "A09Q12", "text": "¿Por qué puede ser útil tomar una fotografía del papel antes de que desarrolle el color?", "options": ["Para medir el Fe antes de añadir muestra.", "Para sustituir la fotografía final.", "Para evaluar/corregir fondo del papel, iluminación y posibles manchas previas.", "Para aumentar la reacción por flash."], "correct": 2, "rationale": "Una imagen inicial proporciona informacion de blanco local. Puede ayudar a detectar defectos o corregir cambios de fondo no asociados al complejo."}, {"id": "A09Q13", "text": "¿Comparado con ImageJ en ordenador, cuál es una ventaja clara de PhotoMetrix en el móvil?", "options": ["Eliminacion completa de problemas de iluminación.", "Capacidad de medir Fe sin fotografía.", "Portabilidad y procesamiento directo in situ, aunque con menor control detallado que un flujo de escritorio.", "Mayor control absoluto de todos los algoritmos internos."], "correct": 2, "rationale": "El móvil facilita análisis de campo y rapidez. ImageJ suele ofrecer más flexibilidad y trazabilidad en separación de canales y selección de ROI."}, {"id": "A09Q14", "text": "¿Si la cera se calienta demasiado poco y no atraviesa bien la porosidad del papel, qué problema aparece?", "options": ["El SCN deja de reaccionar con Fe.⁻", "La muestra puede escapar lateralmente, variando volumen efectivo y área coloreada.", "El papel se convierte en hidrofobo en toda su superficie sin excepcion.", "El complejo se vuelve fluorescente."], "correct": 1, "rationale": "La barrera debe ser continua en el espesor del papel. Si no lo es, hay fugas capilares que deterioran reproducibilidad."}, {"id": "A09Q15", "text": "¿Por qué un R² alto de la recta intensidad-concentración no basta para asegurar exactitud en muestras reales?", "options": ["Porque pueden existir interferencias, diferencias de matriz, saturación o errores de captura no presentes en patrones.", "Porque R² alto significa que la pendiente es cero.", "Porque la exactitud solo depende de que el papel sea blanco.", "Porque las muestras reales no contienen agua."], "correct": 0, "rationale": "La linealidad de patrones es necesaria pero no suficiente. La validación debe incluir interferencias, recuperación y control de imagen en muestras reales."}], "10": [{"id": "A10Q01", "text": "¿Por qué se añade picrato alcalino en gran exceso respecto a la creatinina?", "options": ["Para que la reacción sea de orden cero respecto a creatinina.", "Para impedir la formación del complejo coloreado.", "Para que las concentraciones de picrato y OH sean prácticamente constantes y la velocidad dependa aparentemente de la ⁻ creatinina.", "Para eliminar la necesidad de medir tiempos."], "correct": 2, "rationale": "Si picrato y OH están en exceso, sus concentraciones se incorporan a una constante aparente k'. Así se ⁻ obtiene una cinética de pseudo-primer orden respecto a creatinina."}, {"id": "A10Q02", "text": "¿La orina puede contener 800-2500 mg L ¹ de creatinina y el calibrado final cubre 0-50 mg L ¹. Qué dilución ⁻ ⁻ inicial es razonable para que el valor alto entre justo en rango?", "options": ["1:2", "1:5", "1:50", "Sin diluir"], "correct": 2, "rationale": "2500 mg L ¹ dividido entre 50 da 50. Una dilución 1:50 llevaria el extremo alto a 50 mg L ¹ y el bajo a 16 mg⁻ ⁻ L ¹, dentro del intervalo.⁻"}, {"id": "A10Q03", "text": "¿En el procedimiento, el tiempo cero se define como la adición de la última gota de picrato. Por qué es crítico?", "options": ["Porque el tiempo no afecta a una reacción de Jaffé.", "Porque antes de esa gota no existe cubeta.", "Porque el espectrofotómetro solo funciona en segundos pares.", "Porque la señal usada es cinética; un error en el origen temporal cambia el intervalo real de reacción."], "correct": 3, "rationale": "La absorbancia evoluciona con el tiempo. Definir y reproducir el inicio es esencial para comparar patrones y muestras."}, {"id": "A10Q04", "text": "¿Se construyen rectas con A180-A45 y A180-A60. Cuál es la comparación más razonable?", "options": ["A180-A60 siempre da mayor señal porque empieza más tarde.", "A180-A45 suele dar mayor señal por intervalo más largo, pero puede ser más sensible a errores iniciales de mezcla y cronometraje.", "Ambas rectas deben tener pendiente exactamente cero.", "La eleccion del intervalo no puede afectar a sensibilidad ni robustez."], "correct": 1, "rationale": "El intervalo 45-180 s es más largo que 60-180 s y puede dar mayor ΔA, pero también incorpora una etapa más próxima al inicio, donde mezcla y tiempo cero pesan más."}, {"id": "A10Q05", "text": "¿Por qué el método cinético puede ser menos interferido que una lectura de punto final en equilibrio?", "options": ["Porque los interferentes dejan de absorber a 484 nm por definicion.", "Porque elimina químicamente todos los interferentes de la orina.", "Porque selecciona una ventana temporal donde la creatinina contribuye de forma caracteristica y algunos interferentes reaccionan antes, despues o solo aportan fondo constante.", "Porque no se usa longitud de onda."], "correct": 2, "rationale": "La selectividad cinética aprovecha diferencias de velocidad. No elimina todos los interferentes, pero reduce los que no evolucionan como la creatinina en la ventana elegida."}, {"id": "A10Q06", "text": "¿Cuál es la función del blanco preparado con agua y reactivo de picrato alcalino?", "options": ["Aportar creatinina de concentración conocida.", "Convertir el producto coloreado en incoloro.", "Corregir absorbancia propia del reactivo y cambios no debidos a creatinina.", "Medir la conductividad de la orina."], "correct": 2, "rationale": "El picrato es coloreado y el medio puede tener absorbancia basal. El blanco reproduce reactivos sin analito para corregir fondo."}, {"id": "A10Q07", "text": "¿Si una muestra no se diluye lo suficiente y la creatinina deja de ser pequeña frente al picrato, que falla en el modelo?", "options": ["Picrato ya no permanece prácticamente constante; k' deja de ser constante y la calibración lineal puede subestimar o sesgar la concentración.", "La creatinina deja de reaccionar con picrato.", "El pH se vuelve neutro automaticamente.", "La cubeta cambia de longitud de paso."], "correct": 0, "rationale": "La aproximación de pseudo-orden requiere exceso de reactivos. Si el analito consume una fracción significativa, la velocidad no depende linealmente como en los patrones."}, {"id": "A10Q08", "text": "¿Por qué es preferible usar ΔA entre dos tiempos en lugar de la absorbancia absoluta de la muestra antes de reaccionar?", "options": ["Porque la absorbancia absoluta no existe.", "Porque ΔA reduce contribuciones constantes de color/turbidez inicial de la matriz.", "Porque ΔA elimina cualquier reacción de interferentes.", "Porque el espectrofotómetro solo guarda diferencias."], "correct": 1, "rationale": "Restar dos tiempos cancela parcialmente fondos constantes. Lo que se cuantifica es el cambio de absorbancia asociado a la formación del producto en la ventana temporal."}, {"id": "A10Q09", "text": "¿La reacción se mide a 484 nm. Cuál es el criterio principal para seleccionar está longitud de onda?", "options": ["Es obligatoriamente la misma para todos los complejos amarillos.", "Es donde la cubeta no transmite luz.", "Corresponde al máximo de absorción del complejo creatinina-picrato, aumentando sensibilidad.", "Es la longitud de onda de máxima emisión fluorescente del agua."], "correct": 2, "rationale": "Medir cerca del máximo del producto coloreado maximiza la pendiente analítica para un cambio de concentración dado."}, {"id": "A10Q10", "text": "¿Qué efecto tendría una temperatura de medida más alta en una serie de muestras pero no en los patrones?", "options": ["No tendría efecto porque las reacciones cinéticas no dependen de temperatura.", "Podría aumentar la velocidad de reacción y generar un sesgo sistemático en la interpolación.", "Transformaria la reacción en Kjeldahl.", "Haria que la creatinina no absorbiera luz."], "correct": 1, "rationale": "Las constantes cinéticas dependen de la temperatura. Patrones y muestras deben medirse bajo condiciones térmicas comparables."}, {"id": "A10Q11", "text": "¿Si la cubeta se agita de forma distinta entre patrones y muestras tras añadir picrato, cuál es el problema?", "options": ["La mezcla inicial cambia el tiempo efectivo de reacción y puede modificar ΔA.", "La agitacion solo afecta al color del tapón.", "La creatinina se volatiliza por completo.", "La longitud de onda cambia por agitacion."], "correct": 0, "rationale": "La reacción empieza al mezclar reactivos. Diferencias en homogeneizacion introducen variabilidad en las primeras decenas de segundos."}, {"id": "A10Q12", "text": "¿Una muestra diluida sigue dando ΔA por encima del patrón de 50 mg L ¹. Qué decisión es correcta?⁻", "options": ["Usar la ecuacion de calibrado extrapolando sin advertencia.", "Reducir el tiempo de reacción de forma arbitraria.", "Tomar el valor de 50 mg L ¹ como resultado final.⁻", "Hacer una dilución adicional y repetir el calculo aplicando el factor de dilución total."], "correct": 3, "rationale": "Debe interpolarse dentro del rango. Una dilución adicional permite mantener la química de medición validada y corregir al final por factor de dilución."}, {"id": "A10Q13", "text": "¿Un interferente de la orina absorbe a 484 nm pero su absorbancia es constante entre 45 y 180 s. Qué efecto tendrá sobre ΔA?", "options": ["Se duplicara necesariamente.", "Se cancelara en gran medida al restar absorbancias si realmente permanece constante.", "Se convertira en creatinina por la resta.", "Impide cualquier determinación cinética."], "correct": 1, "rationale": "La resta temporal cancela componentes invariables. Por eso el método cinético puede tolerar mejor ciertos fondos ópticos que una lectura absoluta."}, {"id": "A10Q14", "text": "¿Un interferente reacciona muy lentamente con picrato y empieza a generar color principalmente despues de 180 s. Cómo afecta a la ventana 45-180 s?", "options": ["No puede existir porque todos los interferentes son instantaneos.", "Dominara completamente la señal desde el inicio.", "La ventana cinética lo transforma en blanco.", "Su contribucion será menor que en una lectura de punto final tardia, aunque no necesariamente nula."], "correct": 3, "rationale": "La selección de una ventana intermedia evita parte de interferencias muy lentas. La discriminacion depende de velocidades relativas, no de una eliminacion química absoluta."}, {"id": "A10Q15", "text": "¿Por qué se analizan las muestras por triplicado en el método cinético?", "options": ["Para que tres medidas conviertan un resultado sesgado en exacto automaticamente.", "Para estimar precisión y detectar problemas de mezcla, cronometraje o preparación de alícuotas.", "Para eliminar la necesidad de calibrado.", "Para aumentar la concentración de creatinina en cada cubeta."], "correct": 1, "rationale": "Las replicas permiten evaluar reproducibilidad del proceso completo. No corrigen por si mismas un sesgo sistemático, pero revelan dispersión y errores groseros."}]};

 "P1/P2"]}}, {"date": "22 oct", "time": "16:00–19:00", "labs": {"A2": ["P1/P2", "P1/P2", "P1/P2"], "A3": ["P1/P2", "P1/P2", "P1/P2"]}}, {"date": "23 oct", "time": "16:00–19:00", "labs": {"A2": ["P7", "P3", "P5"], "A3": ["P8", "P4", "P4"]}}, {"date": "26 oct", "time": "16:00–19:00", "labs": {"A2": ["P7", "P9", "P5"], "A3": ["P8", "P5", "P8"]}}, {"date": "27 oct", "time": "16:00–19:00", "labs": {"A2": ["P9", "P7", "P3"], "A3": ["P3", "P5", "P8"]}}, {"date": "28 oct", "time": "16:00–19:00", "labs": {"A2": ["P6", "P7", "P9"], "A3": ["P6", "P9", "P5"]}}, {"date": "30 oct", "time": "16:00–19:00", "labs": {"A2": ["P3", "P6", "P10"], "A3": ["P9", "P6", "P5"]}}, {"date": "30 oct", "time": "16:00–19:00", "labs": {"A2": ["P8", "P5", "P6"], "A3": ["P4", "P7", "P6"]}}, {"date": "2 nov", "time": "16:00–19:00", "labs": {"A2": ["P8", "P5", "P8"], "A3": ["P10", "P7", "P9"]}}, {"date": "3 nov", "time": "16:00–19:00", "labs": {"A2": ["P5", "P10", "P8"], "A3": ["P7", "P10", "P3"]}}, {"date": "4 nov", "time": "16:00–19:00", "labs": {"A2": ["P5", "P8", "P4"], "A3": ["P7", "P3", "P10"]}}, {"date": "5 nov", "time": "16:00–19:00", "labs": {"A2": ["P4", "P8", "P7"], "A3": ["P5", "P8", "P7"]}}, {"date": "6 nov", "time": "16:00–19:00", "labs": {"A2": ["Seminario 3"], "A3": ["Seminario 3"]}}, {"date": "9 nov", "time": "16:00–19:00", "labs": {"A2": ["P10", "P4", "P7"], "A3": ["P5", "P8", "P7"]}}, {"date": "10 nov", "time": "16:00–19:00", "labs": {"A2": ["P11", "P11", "P11"], "A3": ["P11", "P11", "P11"]}}, {"date": "11 nov", "time": "16:00–19:00", "labs": {"A2": ["P11", "P11", "P11"], "A3": ["P11", "P11", "P11"]}}, {"date": "12 nov", "time": "16:00–19:00", "labs": {"A2": ["P11", "P11", "P11"], "A3": ["P11", "P11", "P11"]}}, {"date": "13 nov", "time": "16:00–19:00", "labs": {"A2": ["Seminario 4"], "A3": ["Seminario 4"]}}, {"date": "Fecha pendiente de confirmar", "time": "—", "labs": {"A2": ["Examen"], "A3": ["Examen"]}}];
