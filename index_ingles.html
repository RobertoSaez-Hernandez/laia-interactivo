e GC, a diferencia del método \nde calibración externa? \n\n7.2. Contenido aproximado de tocoferoles en diferentes aceites"], "videos": [{"label": "Análisis de ácidos grasos en aceites vegetales por cromatografía de gases", "url": "https://www.youtube.com/watch?v=oTV-6f6ZM64"}, {"label": "Protocolo de utilización del cromatógrafo de gases-FID y ChemStation", "url": "https://www.youtube.com/watch?v=dDCAiSfOt7U"}, {"label": "Determinación de tocoferoles en aceites vegetales", "url": "https://www.youtube.com/watch?v=yursEcERkr4"}, {"label": "Protocolo de HPLC con detección de fluorescencia y ChromNav", "url": "https://www.youtube.com/watch?v=I-gedPFBWCM"}], "notice": ""}, {"number": 8, "short": "Kjeldahl", "title": "Determinación de proteínas en pasta por el método Kjeldahl", "startPage": 32, "endPage": 34, "sections": {"Objetivos": "- Aplicar el método Kjeldahl. - Llevar a cabo la determinación del contenido de proteínas en muestras alimentarias.", "Fundamento teórico": "En los análisis de rutina de alimentos se suele determinar el contenido de nitrógeno total y expresar el conjunto de sustancias nitrogenadas como “% de nitrógeno total” o como “porcentaje de proteínas”. La estimación del contenido de proteínas de los alimentos a partir de la determinación del contenido de nitrógeno total no siempre es correcta, pero en general el contenido de compuestos nitrogenados no proteicos es pequeño comparado con el de las proteínas en la mayoría de los alimentos. En 1883 el investigador danés Johann Kjeldahl desarrolló el método más usado en la actualidad para el análisis de proteínas (método Kjeldahl) mediante la determinación del nitrógeno orgánico. En esta técnica se digieren las proteínas y otros componentes orgánicos de los alimentos en una mezcla con ácido sulfúrico en presencia de catalizadores. El nitrógeno orgánico total se convierte mediante esta digestión en sulfato de amonio. La mezcla digerida se neutraliza con una base y se destila posteriormente. El amoniaco liberado es arrastrado por destilación y recogido en una solución de ácido bórico. El exceso de ion borato formado se titula con HCl o con H₂SO₄, previamente estandarizado, para determinar el nitrógeno contenido en la muestra. Las etapas generales del método se pueden resumir en las siguientes: • DIGESTIÓN: se lleva a cabo con H₂SO₄ en presencia de un catalizador y calor: Proteínas + H₂SO₄ (+ catalizadores) → (NH₄)2SO4 • NEUTRALIZACIÓN Y DESTILACIÓN: neutralización del (NH₄)2SO4 digerido con una base fuerte (disolución de NaOH, 32%) seguida de una destilación sobre un exceso de ácido bórico: (NH₄)2SO4 + 2 NaOH → 2 NH₃ + Na₂SO₄ + 2 H₂O NH₃ + H₃BO₃ → NH₄+ + H2BO3- • VALORACIÓN: El anión borato es titulado con HCl estandarizado: H2BO3- + H+ → H₃BO₃", "Riesgos y residuos": "Lee detenidamente las fichas de seguridad de los reactivos utilizados. Los residuos de laboratorio se han de recoger por separado para su retirada.", "Material y reactivos": "Reactivos y disoluciones: Ácido Sulfúrico 95-98% NaOH, solución 35% (preparada) Indicador ácido base (preparada) Pastilla catalizador Kjeldahl: K2SO4 y CuSO4 (preparada) Disolución ácido bórico al 4% (preparada) Disolución de HCl 0.31 N (preparada) Equipos: Digestor y destilador Kjeldahl Muestra: muestra de pasta", "Metodología": "5.1. Digestión: Pesar con exactitud 1 g de muestra molida y homogeneizada e introducirl a en un tubo de digestión Kjeldahl (evitar que queden restos de muestra en las paredes del tubo de digestión). Añadir al tubo con muestra una pastilla de catalizador y 10 mL de ácido sulfúrico al 95-98%. Colocar los tubos de digestión con las muestras en el digestor con el colector de humos funcionando. Realizar la digestión a una temperatura de 400 º C y un tiempo de 9 0 minutos. Dejar enfriar la muestra a temperatura ambiente hasta el día siguiente. 5.2. Neutralización y destilación: Dosificar lentamente 50 mL de agua destilada en cada tubo de muestra (con cuidado y dejando caer el agua lentamente por las paredes del tubo). Dejar enfriar la muestra a temperatura ambiente durante 5 minutos. Añadir 25 mL de ácido bórico en un matraz Erlenmeyer de 250 mL y 2 o 3 gotas de indicador mixto. Colocar el Erlenmeyer en la alargadera del refrigerante teniendo la precaución de que ésta quede sumergida dentro de la disolución de ácido bórico. Colocar el tubo con la muestra en el lado izquierdo del destilador. Una vez colocados el tubo de muestra y el Erlenmeyer con el ácido bórico, dosificar 40 mL de NaOH (indicar en el equipo la cantidad de NaOH) e iniciar la destilación. La destilación debe prolongarse el tiempo suficiente para que se destilen un mínimo de 150 mL, aproximadamente de 5 a 15 minutos. 5.32. Valoración: Valorar con ácido clorhídrico 0.1 M, que ha de ser previamente estandarizado, el destilado obtenido hasta viraje del indicador. Calcular el % de proteína Factor de conversión para pasar de contenido en nitrógeno a contenido en proteínas. La mayoría de las proteínas contienen un 16% de N, de modo que el factor de conversión es 6.25 (100/16 = 6.25). Sin embargo, se han obtenido empíricamente otros factores de conversión en función de la materia prima utilizada: Huevos o carnes 6.25, Productos lácteos 6.38, Trigo 5.70, Otros cereales y semillas oleaginosas 6.25, Almendras 5.18, Cacahuetes y nueces de l Brasil 5.46, Otros frutos secos de árbol y nuez de coco 5.30.", "Referencias": "• Official Methods of Analysis (1995) 16th Ed., AOAC INTERNATIONAL, Gaithersburg, MD, sec. 33.2.11, Method 991.20 • International Dairy Federation (1993) Milk: Determination of Nitrogen Content, IDF Standard No. 20B:1993, Parts 1 and 2, IDF, Brussels, Belgium", "Cuestiones finales": "1. En la práctica de Kjeldahl se aplica un factor de conversión específico de para el trigo (pasta) en lugar del factor genérico. a) Justifica químicamente por qué varía este factor en función de la matriz alimentaria basándote en la composición de aminoácidos mayoritarios (como la glutamina o la arginina) y su porcentaje en peso de nitrógeno. b) Basándote en el fundamento de la técnica (que mide nitrógeno orgánico total y no proteínas directamente), explica por qué el método Kjeldahl es vulnerable a fraudes por adulteración con compuestos como la melamina o la urea, y qué técnica analítica alternativa (óptica o de separación) propondrías para asegurar que el nitrógeno medido proviene exclusivamente de enlaces peptídicos. 2. Durante la etapa de digestión a 400 oC, se añade una pastilla que contiene una mezcla de K 2SO4 y CuSO 4 junto al H₂SO₄ concentrado. Explica detalladamente la función físico-química diferenciada de cada sal: a) ¿Por qué el K2SO4 es termodinámicamente indispensable para alcanzar los 400 oC en el bloque digestor sin que el ácido sulfúrico se evapore prematuramente por debajo de su punto de ebullición nativo? b) ¿Cuál es el rol cinético del CuSO 4 y cómo delata visualmente el final de la digestión (destrucción completa de la materia orgánica) antes de pasar a la fase de destilación? 3. Al finalizar la digestión, el (NH₄)2SO4 se alcaliniza con para destilar el NaOH. El destilado se recoge en un Erlenmeyer que contiene un exceso de ácido bórico al 4%. Escribe las reacciones químicas equilibradas que ocurren en la disolución receptora de ácido bórico durante la destilación y explica por qué no es necesario conocer el volumen exacto añadido al Erlenmeyer (a diferencia de lo que ocurriría si recogiéramos el amoníaco sobre un ácido fuerte como el HCl."}, "postQuestions": ["En la práctica de Kjeldahl se aplica un factor de conversión específico de para el trigo (pasta) en lugar del factor \ngenérico. \na) Justifica químicamente por qué varía este factor en función de la matriz alimentaria basándote en la composición de \naminoácidos mayoritarios (como la glutamina o la arginina) y su porcentaje en peso de nitrógeno. \nb) Basándote en el fundamento de la técnica (que mide nitrógeno orgánico total y no proteínas directamente) , explica por \nqué el método Kjeldahl es vulnerable a fraudes por adulteración con compuestos como la melamina o la urea, y qué técnica \nanalítica alternativa (óptica o de separación) propondrías para asegurar que el nitrógeno medido proviene exclusivamente de \nenlaces peptídicos.", "Durante la etapa de digestión a 400 \noC, se añade una pastilla que contiene una mezcla de K 2SO4 y CuSO 4 junto al \nH2SO4 concentrado. Explica detalladamente la función físico-química diferenciada de cada sal: \na) ¿Por qué el K2SO4 es termodinámicamente indispensable para alcanzar los 400 oC en el bloque digestor sin que el ácido \nsulfúrico se evapore prematuramente por debajo de su punto de ebullición nativo? \nb) ¿Cuál es el rol cinético del CuSO 4 y cómo delata visualmente el final de la digestión (destrucción completa de la materia \norgánica) antes de pasar a la fase de destilación?", "Al finalizar la digestión, el (NH 4)2SO4 se alcaliniza con para destilar el NaOH . El destilado se recoge en un Erlenmeyer \nque contiene un exceso de ácido bórico al 4% . Escribe las reacciones químicas equilibradas que ocurren en la disolución \nreceptora de ácido bórico durante la destilación y explica por qué no es necesario conocer el volumen exacto añadido al \nErlenmeyer (a diferencia de lo que ocurriría si recogiéramos el amoníaco sobre un ácido fuerte como el HCl."], "videos": [{"label": "Determinación de proteínas en pasta por el método Kjeldahl", "url": "https://www.youtube.com/watch?v=Q0yT6qtj0cg"}], "notice": "", "equations": ["Proteínas + H₂SO₄  —(catalizador, calor)→  (NH₄)₂SO₄", "(NH₄)₂SO₄ + 2 NaOH → 2 NH₃ + Na₂SO₄ + 2 H₂O", "NH₃ + H₃BO₃ ⇌ NH₄⁺ + H₂BO₃⁻", "H₂BO₃⁻ + H⁺ → H₃BO₃"]}, {"number": 9, "short": "Dispositivos de papel", "title": "Determinación de hierro en aguas naturales mediante dispositivos basados en papel.", "startPage": 35, "endPage": 39, "sections": {"Objetivos": "Desarrollar y evaluar la selectividad de dispositivos basados en papel para la determinación de hierro en aguas naturales mediante su reacción con tiocianato. La calibración se llevará a cabo mediante fotografías tomadas con un dispositivo smartphone y análisis de imagen.", "Fundamento teórico": "El número de aplicaciones de dispositivos basados en papel ha aumentado drásticamente en la última década, especialmente en el campo de la Química Analítica. Además de los estudios científicos, los dispositivos basados en papel también se utilizan cada vez más en la industria para el análisis químico colorimétrico cualitativo y cuantitativo. Las principales ventajas que ofrecen los dispositivos basados en papel son las relacionadas con el bajo coste, la portabilidad, la fabricación fácil y rápida, el bajo consumo de reactivos y muestras, la facilidad de uso y disponibilidad. El método de detección más empleado en combinación con dispositivos en papel es el colorimétrico, con observaciones a simple vista o utilizando una cámara de móviles o smartphones para la adquisición de imágenes. El objetivo principal de esta práctica se centra en el desarrollo y la aplicación de un dispositivo en papel para la determinación de hierro (III) en muestras utilizando reacciones colorimétricas como métodos de detección. El hierro es un oligoelemento esencial, y tiene varios usos clínicos bien establecidos, como la prevención y el tratamiento de la anemia por deficiencia de hierro. El hierro, elemento que puede presentar toxicidad en concentraciones muy altas, debe determinarse en el agua del grifo porque actúa como un sustituto útil de otros metales pesados, cuya presencia en el agua potable constituye un peligro real para la salud pública. Muchos manuales de laboratorio de Química General incluyen la determinación colorimétrica de hierro usando tiocianato: Fe³⁺ + SCN⁻ → Fe(SCN)2+ (marron rojizo) El complejo Fe(SCN) 2+ muestra un máximo de absorbancia a 460 nm. El principio de este método es la reacción selectiva de iones de hierro (III) con tiocianato para proporcionar una di solución coloreada debido al complejo formado. Con un exceso de tiocianato, la intensidad del color depende cuantitativamente de la cantidad de iones de hierro en la muestra. En consecuencia, en esta práctica, se evaluarán las posibles interferencias de otros cationes metálicos y la determinación de la concentración de hierro (III) en una muestra problema mediante análisis colorimétrico utilizando una cámara de móvil y posterior tratamiento de las imágenes obtenidas.", "Riesgos y residuos": "• Leer el documento “Normas generales de seguridad en el laboratorio”. • Revisar la etiqueta de los reactivos, en particular las referentes a la seguridad. • Verter los residuos generados en los recipientes debidamente etiquetados y situados en el laboratorio. • El grado de peligrosidad de la instrumentación utilizada, trabajando en las condiciones adecuadas, es bajo. Se deben seguir los protocolos de seguridad de l laboratorio en todo momento durante el experimento. Se debe usar equipo de protección personal, incluyendo gafas de laboratorio, guantes y una bata de laboratorio. El KSCN es nocivo si se ingiere o inhala y causa irritación en la piel, los ojos y el tracto respiratorio. Los metales de transición se consideran tóxicos para la vida acuática. Las di soluciones sobrantes deben recogerse en un contenedor de desechos para su eliminación. Sin embargo, debe tenerse en cuenta que los riesgos asociados con esta práctica de laboratorio son mínimos debido a las pequeñas cantidades, las bajas toxicidades y las bajas concentraciones químicas que se utilizan.", "Material y reactivos": "", "Metodología": "5.1 Preparación del dispositivo basado en papel Se usa cinta adhesiva transparente para cubrir la parte posterior del dispositivo de papel para que la disolución no se filtre. Se dibujan diez u once círculos de 16 mm de diámetro usando un delineador de ojos o un lápiz de cera sobre un papel de filtro sin cenizas Whatman 4 ( de 110 mm de diámetro ) usando una plantilla de círculos de Westcott. Después, el papel de filtro se calienta en un horno a 100°C durante 30 s para derretir la cera y crear una barrera circular impermeable. 5.2 Obtención de la recta de calibración y determinación de hierro en la muestra El procedimiento analítico desarrollado para la determinación de hierro utilizando dispositivos basados en papel es el siguiente. Se preparan disoluciones de hierro (III) de varias concentraciones, de 10 a 100 mg L −1, por dilución de la disolución estándar (10000 mg L−1 de hierro (III)). A continuación, se coloca una porción de 5 μL de la muestra o disolución estándar en los círculos de cera seguido de 5 μL de solución de tiocianato de potasio 0,5 M. Luego, se fotografía el papel de filtro, se espera 5 minutos para que se desarrolle el color y se toma otra fotografía del papel de filtro con la cámara del móvil. 5.3 Estudio de interferencias Reactivos y disoluciones: Disolución estándar de hierro (III) de 10000 mg L−1 Tiocianato potásico Disoluciones de Cu2+, Al3+, Ni2+, Co2+, y Zn2+ a 10000 mg L−1 Material e instrumentación: papel de filtro Whatman del número 4 de 110 mm de diámetro, una plantilla de círculos de Westcott, un horno, un teléfono móvil Muestras: Muestras de agua Se preparan muestras de agua que contienen 50 mg L−1 de patrón de hierro (III) y diferentes interferentes como Cu2+, Al3+, Ni2+, Co2+ y Zn2+ a un nivel de concentración de 100 mg L −1. Adicionalmente, se analiza n también las disoluciones patrón de Cu 2+, Al3+, Ni2+, Co2+ y Zn2+ a un nivel de concentración de 100 mg L −1, sin presencia de hierro (III) y una disolución de 50 mg L−1 de hierro (III) sin interferentes siguiendo el procedimiento recomendado. Se colocó una porción de 5 µ L de disolución de muestra en los círculos de cera seguida de 5 µL de la disolución de tiocianato de potasio 0.5 M. 5.4 Análisis de imágenes Una vez obtenidas las fotografías de los dispositivos de papel, la cuantificación del color o de la intensidad de gris puede realizarse mediante cuatro metodologías analíticas alternativas. Opción A: Análisis colorimétrico directo in situ con PhotoMetrix Esta aplicación móvil permite capturar, procesar y realizar curvas de calibración multivariante (RGB o escala de grises) directamente en el smartphone, sin necesidad de transferir los archivos a un ordenador. 1. Descarga e instalación: Descargue e instale la aplicación gratuita PhotoMetrix (disponible para entornos móviles). 2. Configuración del análisis: Seleccione la opción de análisis colorimétrico directo. Defina el espacio de color de trabajo (RGB, HSV o escala de grises). 3. Medida: Centre la cámara sobre el círculo de cera del dispositivo analítico. Capture la imagen asegurando una iluminación homogénea. La aplicación transformará la señal óptica de la zona delimitada en valores numéricos instantáneos y calculará de forma autónoma la recta de calibración si se introducen las concentraciones de los patrones. Opción B: Análisis multicanal (Color y Escala de Grises) con ImageJ ImageJ permite descomponer la imagen digital para medir tanto la intensidad media de gris como los valores individuales de los canales de color rojo, verde y azul (RGB) de un área seleccionada. 1. Importación: Abra el software ImageJ y cargue la fotografía mediante File > Open. 2. Selección del área: Utilice la herramienta de selección circular para delimitar la zona coloreada del interior del círculo de cera. 3. Medida en Escala de Grises: Aplique el comando Analyze > Measure. El programa devolverá el valor medi o de intensidad de gris (en una escala de 0 a 255). 4. Medida en Canales de Color (RGB): Para evaluar canales individuales, vaya a Image > Color > Split Channels. La imagen se dividirá en tres ventanas independientes (rojo, verde y azul). Seleccione el canal complementario al color desarrollado (canal verde para el complejo marrón rojizo del hierro) y aplique nuevamente Analyze > Measure sobre el área delimitada para obtener la intensidad de color de ese canal específico. Opción C: Generación de código Python asistida por IA y ejecución en Google Colab Esta metodología utiliza la Inteligencia Artificial generativa para escribir scripts personalizados de procesamiento de imágenes y la plataforma en la nube de Google para su ejecución sin necesidad de instalar software local. 1. Generación del código con IA: Acceda a un modelo de lenguaje de IA (p. ej., Copilot ) y solicítele el código necesario utilizando un prompt técnico preciso: \"Escribe un script de Python utilizando las librerías OpenCV y Pillow para cargar una imagen RGB, permitir seleccionar una región de interés (ROI) circular, convertirla a escala de grises y calcular el valor medio de los píxeles de esa zona.\" 2. Entorno de ejecución: Abra un cuaderno en Google Colab e inicie sesión con su cuenta institucional. 3. Ejecución: Copie el código generado por la IA en una celda de código de Colab. Suba la fotografía de la muestra al almacenamiento temporal del cuaderno, adapte el nombre del archivo en la línea de lectura del script (p. ej., imread('hierro_patron1.jpg')) y ejecute la celda para obtener los datos numéricos de intensidad. Opción D: Creación automatizada de una Web-App local de tratamiento de imágenes mediante IA Consiste en delegar en la IA el diseño completo de una herramienta web interactiva ejecutada en código HTML/JavaScript que corre directamente en cualquier navegador de internet. 1. Generación de la Web-App: Solicite a la IA el desarrollo de la interfaz digital con el siguiente requerimiento escrito: \"Genera un único archivo HTML que incluya CSS y JavaScript para crear una aplicación web local. La web debe permitir al usuario subir una imagen, mostrarla en un lienzo (Canvas), hacer clic en el centro de una zona circular para seleccionar un área de interés, y mostrar instantáneamente en pantalla el valor medio RGB y de escala de grises de los píxeles de esa región.\" 2. Creación del archivo: Copie el código HTML íntegro proporcionado por la IA, péguelo en un editor de texto plano de su ordenador (como el Bloc de Notas) y guarde el archivo con la extensión.ht ml (p. ej., analizador_muPAD.html). 3. Análisis: Haga doble clic sobre el archivo guardado para abrirlo en su navegador web habitual. Suba las fotos de sus muestras y use el puntero del ratón para clicar directamente sobre los círculos del dispositivo en pape l; la aplicación calculará los datos analíticos en tiempo real de forma visual.", "Referencias": "Development and Evaluation of Paper -Based Devices for Iron(III) Determination in an Advanced Undergraduate Laboratory, Sergio Armenta, Francesc Albert Esteve-Turrillas, and José Manuel Herrero-Martínez, J. Chem. Educ. 2020, 97, 3852−3857.", "Cuestiones finales": "1. La reacción colorimétrica entre el Fe³⁺ y el SCN - genera el complejo monocoordinado Fe(SCN) 2+ de color marrón rojizo. Sabiendo que a concentraciones elevadas de tiocianato se pueden formar sucesivamente complejos superiores con diferentes estequiometrías, justifica desde el punto de vista del Principio d e Le Châtelier y de la constante de estabilidad global por qué el procedimiento exige añadir obligatoriamente un gran exceso de tiocianato de potasio 0.5 M frente a las concentraciones de hierro de las muestras. 2. Para la fabricación del dispositivo, se dibujan círculos con un lápiz de cera sobre papel de filtro Whatman 4 y se calienta en un horno a 100 ºC durante 30 segundos. Explica el fenómeno físico -químico que ocurre durante el calentamiento en relación con la porosidad de la celulosa y la hidrofobicidad de la cera. 3. A diferencia de una cubeta espectrofotométrica donde la disolución es homogénea, en el papel el líquido se evapora radialmente. Si dejas secar el dispositivo por completo bajo una corriente de aire caliente, el complejo coloreado migrar á por capilaridad hacia los bordes de la barrera de cera, acumulando más intensidad en la periferia que en el centro. a. ¿Cómo afecta esta distribución heterogénea del color a la reproducibilidad de la recta de calibrado si no se selecciona rigurosamente el mismo tamaño de área circular (ROI) en el software de análisis? b. Justifica la importancia de respetar estrictamente el tiempo de espera homogéneo de 5 minutos antes de tomar la fotografía. 4. Basándote en los resultados del estudio de interferencias, elige uno de los cationes que generan interferencia y prop ón una modificación experimental para solucionar su presencia en la muestra de agua sin necesidad de cambiar de técnica analítica. 5. El rango dinámico de una imagen digital de 8 bits está estrictamente limitado a valores enteros entre 0 (negro) y 255 (blanco). Si la concentración de hierro en la muestra es excesivamente elevada, el píxel alcanzará el valor 0 de escala de grises y la señal se saturará. Explica cómo afecta analíticamente esta limitación matemática al rango dinámico lineal de tu recta de calibrado y qué operación experimental debes realizar si una muestra de agua real excede este límite. 6. Al delegar en una Inteligencia Artificial la generación del código de Python (Opción C) o HTML (Opción D) para procesar tus imágenes, el programa actúa inicialmente como una \"caja negra\". Diseña una estrategia de control de calidad o una imagen analítica patrón (d e colores o grises puros conocidos) que puedas introducir en el software diseñado para verificar de forma matemática que el algoritmo calcula una media aritmética de píxeles real y reproducible antes de usarlo con muestras reales. 7. Compara críticamente las ventajas y limitaciones de utilizar una aplicación de procesamiento directo in situ en el móvil (PhotoMetrix) frente a un software de análisis de imagen de escritorio en ordenador (ImageJ). Evalúa parámetros como la portabilidad en análisis de campo, la flexibilidad para separar canales de color y el control de las condiciones de iluminación ambiental durante la captura."}, "postQuestions": ["La reacción colorimétrica entre el Fe\n3+ y el SCN - genera el complejo monocoordinado Fe(SCN) 2+ de color marrón rojizo. \nSabiendo que a concentraciones elevadas de tiocianato se pueden formar sucesivamente complejos superiores con diferentes \nestequiometrías, justifica desde el punto de vista del Principio d e Le Châtelier y de la constante de estabilidad global por qué \nel procedimiento exige añadir obligatoriamente un gran exceso de tiocianato de potasio 0.5 M frente a las concentraciones de \nhierro de las muestras.", "Para la fabricación del dispositivo, se dibujan círculos con un lápiz de cera sobre papel de filtro Whatman 4 y se calienta en \nun horno a 100 ºC durante 30 segundos. Explica el fenómeno físico -químico que ocurre durante el calentamiento en relación \ncon la porosidad de la celulosa y la hidrofobicidad de la cera.", "A diferencia de una cubeta espectrofotométrica donde la disolución es homogénea, en el papel el líquido se evapora \nradialmente. Si dejas secar el dispositivo por completo bajo una corriente de aire caliente, el complejo coloreado migrar á por \ncapilaridad hacia los bordes de la barrera de cera, acumulando más intensidad en la periferia que en el centro. \na. ¿Cómo afecta esta distribución heterogénea del color a la reproducibilidad de la recta de calibrado si no se selecciona \nrigurosamente el mismo tamaño de área circular (ROI) en el software de análisis? \nb. Justifica la importancia de respetar estrictamente el tiempo de espera homogéneo de 5 minutos antes de tomar la \nfotografía.", "Basándote en los resultados del estudio de interferencias, elige uno de los cationes que generan interferencia y prop ón una \nmodificación experimental para solucionar su presencia en la muestra de agua sin necesidad de cambiar de técnica analítica.", "El rango dinámico de una imagen digital de 8 bits está estrictamente limitado a valores enteros entre 0 (negro) y 255 \n(blanco). Si la concentración de hierro en la muestra es excesivamente elevada, el píxel alcanzará el valor 0 de escala de grises \ny la señal se saturará. Explica cómo afecta analíticamente esta limitación matemática al rango dinámico lineal de tu recta de \ncalibrado y qué operación experimental debes realizar si una muestra de agua real excede este límite.", "Al delegar en una Inteligencia Artificial la generación del código de Python (Opción C) o HTML (Opción D) para procesar tus \nimágenes, el programa actúa inicialmente como una \"caja negra\". Diseña una estrategia de control de calidad o una imagen \nanalítica patrón (d e colores o grises puros conocidos) que puedas introducir en el software diseñado para verificar de forma \nmatemática que el algoritmo calcula una media aritmética de píxeles real y reproducible antes de usarlo con muestras reales.", "Compara críticamente las ventajas y limitaciones de utilizar una aplicación de procesamiento directo in situ en el móvil \n(PhotoMetrix) frente a un software de análisis de imagen de escritorio en ordenador (ImageJ). Evalúa parámetros como la \nportabilidad en análisi s de campo, la flexibilidad para separar canales de color y el control de las condiciones de iluminación \nambiental durante la captura."], "videos": [{"label": "Determinación de hierro en aguas mediante dispositivos de papel", "url": "https://www.youtube.com/watch?v=yDA4_GOMfQE"}], "notice": "", "equations": ["Fe³⁺ + SCN⁻ → [FeSCN]²⁺"]}, {"number": 10, "short": "Creatinina", "title": "Determinación cinético-espectrofotométrica de creatinina con picrato alcalino", "startPage": 40, "endPage": 42, "sections": {"Objetivos": "- Determinación de creatinina en orina mediante métodos cinéticos de análisis", "Fundamento teórico": "La creatinina es una sustancia generada a partir de la degradación de la creatina, nutriente de los músculos. El contenido de creatinina es un parámetro utilizado para el diagnóstico de trastornos renales, ya que es filtrada por los riñones y excretada en la orina. Creatinina Ácido pícrico Para la determinación de creatinina se han propuesto diversos procedimientos, siendo el más utilizado el método de Jaffé, que es una determinación colorimétrica basada en la reacción de la creatinina con picrato a pH básico. Esta reacción origina un complejo creatinina-picrato que presenta un máximo de absorción a 484 nm. Esta determinación puede realizarse tanto en el equilibrio como mediante análisis cinético, donde este último presenta las ventajas de poseer menos interferencias y de ser más rápido. El análisis cinético se basa en la medida de la variación de una señal analítica relacionada con una de las especies implicadas en la reacción. La cinética de la reacción entre la creatinina y el picrato a pH básico ha sido establecida como de primer orden respecto a la concentración de picrato, OH⁻ y creatinina. Por ello, si se trabaja en exceso de picrato y de álcali, la velocidad de reacción es únicamente función de la concentración de creatinina, es decir, puede ser considerada una reacción de pseudoprimer orden: 𝑣𝑣= 𝑘𝑘𝑐𝑐creatinina𝑐𝑐picrato𝑐𝑐OH− = k'ccreatinina Dado que la velocidad de reacción está relacionada con la desaparición de la creatinina, pero también con la aparición del producto de reacción, la medida de la absorbancia de éste puede ser utilizada para la determinación de la velocidad inicial y, por tanto, para la cuantificación de creatinina.", "Riesgos y residuos": "Leer detenidamente las fichas de seguridad de los reactivos utilizados. Los residuos de la muestra deben ser recogidos y retirados por la empresa aut orizada para su conveniente eliminación.", "Material y reactivos": "O N N H 2 N C H 3 O N + O - N + O - O O H N + O - O Reactivos y disoluciones: disolución patrón de creatinina de concentración 80 mg L -1 y disolución de picrato 1.7 10-3 M preparada en medio NaOH 0.5 M. (preparadas) Instrumentación: espectrofotómetro de absorción UV-Vis. Material: cronómetro. Muestra: muestra de orina", "Metodología": "5.1. Obtención de la recta de calibrado Las disoluciones necesarias para la obtención de la curva de calibrado se preparan directamente en la cubeta del espectrofotómetro. Para ello, se introduce el volumen necesario de la disolución patrón y de agua para completar 1.5 mL de disolución y 1 mL de picrato alcalino, de forma que la concentración final de creatinina se encuentre e n el intervalo de concentraciones 0-50 mg L-1. El blanco se prepara de igual modo, es decir, con 1.5 mL de agua y 1 mL de reactivo. Se considera tiempo cero de la reacción el instante en el cual se adiciona la última gota de picrato a la cubeta de 1 cm de paso óptico. A continuación, se tapa la cubeta, se agita y se coloca en el espectrofotómetro, tomando las señales de absorbancia a los 45, 60 y 180 s. La recta de calibrado se calcula representando )( creatininacfA =∆ a dos pares de tiempos de reacción (45 -180 s y 60- 180 s) con objeto de seleccionar el incremento de tiempo más adecuado. 5.2. Determinación de creatinina en la muestra En primer lugar, se procede a diluir la muestra para obtener disoluciones de medida en el intervalo lineal de concentraciones. Sabiendo que e l contenido en creatinina oscila entre 800 y 2500 mg·L-1, estima la dilución a decuada de la muestra. A continuación, ésta se analizará por triplicado tomando alícuotas de muestra de 1.5 mL siguiendo el procedimiento descrito en el punto anterior. En caso de que la absorbancia no se encuentre dentro del intervalo de señale s del calibrado, se toma un volumen menor de muestra completando hasta 1.5 mL con agua. Finalmente, a partir de las absorbancias se calculan A 180s- A60s y A 180 s - A45 s, y por interpolación en las ecuaciones de calibrado obtenidas en el apartado anterior se calcula la concentración de creatinina en la muestra en mg de creatinina por litro de muestra.", "Referencias": "• Mauri, A.; Llobat, M. y Herráez, R. Laboratorio de Análisis Instrumental. Servei de Publicacions de la UV i editorial Reverté (2010). • Campins Falcó, P.; Sevillano Cabeza, A. y Llobat Estellés, M. “Kinetic and chemometric studies of the determination of creatinine using the Jaffé reaction Part 2. Application to human serum samples: Kinetic behaviour and chemometric evaluation of the determination.” Analyst 114 (1989) 603-607. • Campins Falcó, P.; Tortajada-Genaro, L. A.; Meseger-Llloret, S.; Blasco-Gómez, F.; Sevillano Cabeza, A. y Molins-Legua, C. “Creatinine determination in urine samples by batchwise kinetic procedure and flow injection analysis using the Jaffé reaction: chemometric study.” Talanta 55 (2001) 1079-1089.", "Cuestiones finales": "1. La velocidad de la reacción de Jaffé depende de las concentraciones de creatinina, picrato e hidróxido. En la práctica, preparas las cubetas de forma que la concentración final de creatinina esté entre 0 y 50 mg L -1, mientras que el reactivo de picrato alcalino se añade en un gran exceso. a. Demuestra matemáticamente cómo se transforma la ecuación de velocidad real en una de pseudoprimer orden bajo estas condiciones experimentales. b. ¿Qué error sistemático ocurriría en la cuantificación si la muestra de orina de un paciente no se diluyera las veces adecuadas y la concentración de creatinina fuera tan alta que compitiera en magnitud con la de picrato? 2. El análisis cinético presenta la gran ventaja de poseer menos interferencias que la determinación colorimétrica en el equilibrio (punto final). Sabiendo que la orina es una matriz compleja que contiene otros cromóforos e interferentes químicos (como proteínas, glucosa, cuerpos cetónicos o cefalosporinas): a. Explica, desde el punto de vista de las velocidades de reacción diferenciadas, cómo el método cinético de Jaffé discrimina los interferentes de \"reacción rápida\" (que consumen picrato en los primeros segundos) y los de \"reacción lenta\" (que solo empiezan a absorber pasados varios minutos). b. Justifica por qué la ventana temporal elegida en el procedimiento se sitúa precisamente en ese intervalo intermedio. 3. En el apartado 5.1 se pide calcular y representar dos rectas de calibrado analizando dos incrementos de tiempo diferentes: a. Si un alumno comete un error manual de retraso de 3 s al poner en marcha el cronómetro justo tras añadir el reactivo picrato (tiempo cero), razona detalladamente cuál de l as dos rectas de calibrado se verá más afectada negativamente en su ordenada en el origen y su pendiente. b. ¿Cuál de los dos intervalos temporales proporciona teóricamente una mayor sensibilidad analítica (mayor pendiente) y cuál ofrece una mayor robustez frente al error humano en los primeros instantes de la mezcla?"}, "postQuestions": ["La velocidad de la reacción de Jaffé depende de las concentraciones de creatinina, picrato e hidróxido. En la práctica, \npreparas las cubetas de forma que la concentración final de creatinina esté entre 0 y 50 mg L -1, mientras que el reactivo de \npicrato alcalino se añade en un gran exceso. \na. Demuestra matemáticamente cómo se transforma la ecuación de velocidad real en una de pseudoprimer orden bajo \nestas condiciones experimentales. \nb. ¿Qué error sistemático ocurriría en la cuantificación si la muestra de orina de un paciente no se diluyera las veces \nadecuadas y la concentración de creatinina fuera tan alta que compitiera en magnitud con la de picrato?", "El análisis cinético presenta la gran ventaja de poseer menos interferencias que la determinación colorimétrica en el \nequilibrio (punto final). Sabiendo que la orina es una matriz compleja que contiene otros cromóforos e interferentes químicos \n(como proteínas, glucosa, cuerpos cetónicos o cefalosporinas): \na. Explica, desde el punto de vista de las velocidades de reacción diferenciadas, cómo el método cinético de Jaffé \ndiscrimina los interferentes de \"reacción rápida\" (que consumen picrato en los primeros segundos) y los de \"reacción \nlenta\" (que solo empiezan a absorber pasados varios minutos). \nb. Justifica por qué la ventana temporal elegida en el procedimiento se sitúa precisamente en ese intervalo intermedio.", "En el apartado 5.1 se pide calcular y representar dos rectas de calibrado analizando dos incrementos de tiempo diferentes: \na. Si un alumno comete un error manual de retraso de 3 s al poner en marcha el cronómetro justo tras añadir el reactivo \npicrato (tiempo cero), razona detalladamente cuál de l as dos rectas de calibrado se verá más afectada negativamente \nen su ordenada en el origen y su pendiente. \nb. ¿Cuál de los dos intervalos temporales proporciona teóricamente una mayor sensibilidad analítica (mayor pendiente) \ny cuál ofrece una mayor robustez frente al error humano en los primeros instantes de la mezcla?"], "videos": [{"label": "Determinación cinético-espectrofotométrica de creatinina", "url": "https://www.youtube.com/watch?v=FqypQ_ilhJg"}], "notice": "", "equations": ["Creatinina + picrato + OH⁻ → complejo creatinina–picrato", "v = k[creatinina][picrato][OH⁻] = k′[creatinina]"]}, {"number": 11, "short": "Proyecto", "title": "Desarrollo del guion por el alumnado", "startPage": null, "endPage": null, "sections": {}, "postQuestions": [], "videos": [], "notice": "Práctica autónoma: el alumnado desarrollará el guion. La información y los materiales se publicarán cuando estén disponibles."}];
const AUTOQUIZ_BANK={"1": [{"id": "A01Q01", "text": "¿Una muestra de suelo contiene humedad residual aunque se haya dejado secar al aire. Si el porcentaje de materia orgánica se expresa respecto a la masa de muestra seca al aire, sin corregir a masa seca a 105 °C, cuál será el sesgo más probable?", "options": ["El resultado será independiente de la humedad, porque la valoración depende solo del dicromato.", "Solo aumentará la desviación estándar, pero no aparecerá sesgo.", "El porcentaje de materia orgánica quedará sobrestimado, porque el agua reduce el dicromato.", "El porcentaje de materia orgánica quedará subestimado."], "correct": 3, "rationale": "La masa seca al aire incluye agua residual. El denominador es artificialmente mayor que la masa seca real, por lo que una misma cantidad de carbono oxidable se expresa como un porcentaje menor."}, {"id": "A01Q02", "text": "¿Al comparar el pH de un mismo suelo medido en agua y en una disolución diluida de KCl, se observa un pH menor en KCl. Cuál es la explicacion química más razonable?", "options": ["El Cl- oxida la materia orgánica y genera ácido sulfúrico.", "El electrodo de vidrio solo responde correctamente en presencia de potasio.", "El ión K+ desplaza protones y otros cationes ácidos adsorbidos en los coloides, aumentando la acidez de la suspensión.", "El KCl diluye más la muestra y por eso siempre baja el pH."], "correct": 2, "rationale": "El pH en KCl suele reflejar acidez intercambiable. K+ compite por sitios de intercambio y desplaza H o ⁺ especies ácidas asociadas a Al, que pasan a la fase líquida y disminuyen el pH medido."}, {"id": "A01Q03", "text": "¿Por qué no es correcto comparar directamente dos valores de pH de suelo si uno se midio en una suspensión 1:2.5 suelo:agua y otro en una suspensión 1:5?", "options": ["Porque la suspensión 1:5 siempre transforma un suelo ácido en alcalino.", "Porque a mayor volumen de agua el electrodo deja de responder a H y mide conductividad.⁺", "Porque el pH es una propiedad absoluta y no depende de la relación suelo:agua.", "Porque la relación de dilución modifica los equilibrios de adsorción, disolución e intercambio iónico que controlan la actividad de H .⁺"], "correct": 3, "rationale": "El pH del suelo es operacional. Cambiar la proporción suelo:agua cambia fuerza iónica, disolución de sales y equilibrio con superficies coloidales; por eso debe indicarse la metodología."}, {"id": "A01Q04", "text": "¿Un suelo presenta una conductividad eléctrica muy elevada en el extracto acuoso. Desde el punto de vista agronomico, cuál es la consecuencia más directa?", "options": ["La conductividad eléctrica alta indica necesariamente mayor contenido de materia orgánica.", "Aumenta la presión osmótica de la disolución del suelo y se dificulta la absorción de agua por las raíces.", "Las raíces absorben agua con mayor facilidad por aumento del potencial hídrico.", "La salinidad solo afecta a la medida instrumental, no al crecimiento vegetal."], "correct": 1, "rationale": "La conductividad es un indicador global de iones solubles. Si la salinidad aumenta, la disolución del suelo tiene menor potencial hídrico y la planta debe vencer una mayor presión osmótica para absorber agua."}, {"id": "A01Q05", "text": "¿Un estudiante propone determinar por separado todos los iones solubles del suelo en lugar de medir conductividad. Cuál es la mejor defensa analítica de la medida de conductividad como prueba previa?", "options": ["La conductividad identifica inequvocamente que ión está presente.", "La conductividad mide exclusivamente nitratos y fosfatos.", "La conductividad elimina la necesidad de calibrar el conductímetro.", "La conductividad permite estimar rápidamente la carga iónica soluble total, aunque no tenga selectividad individual."], "correct": 3, "rationale": "La CE es una medida global, no específica. Su valor es precisamente servir como screening rápido de salinidad total, no sustituir a un perfil iónico completo cuando se requiere especiacion."}, {"id": "A01Q06", "text": "¿En la determinación de carbono oxidable con dicromato, se realiza una valoración del exceso de dicromato con sal de Mohr. Si una muestra contiene más materia orgánica oxidable que otra, qué se espera en la valoración del exceso?", "options": ["Consumirá más sal de Mohr, porque quedará más dicromato sin reaccionar.", "Consumirá menos sal de Mohr, porque la muestra habra reducido una mayor fracción del dicromato inicial.", "Consumirá el mismo volumen de sal de Mohr, porque el dicromato se añade en exceso fijo.", "No podrá valorarse porque el carbono orgánico precipita al Fe(II)."], "correct": 1, "rationale": "La materia orgánica consume dicromato durante la oxidación. Cuánto mayor es el consumo por la muestra, menos oxidante queda para ser valorado con Fe(II), y menor será el volumen de sal de Mohr respecto al blanco."}, {"id": "A01Q07", "text": "¿En el método de oxidación humeda se aplica un factor 1.30 al carbono orgánico oxidable determinado. Qué representa este factor?", "options": ["El factor de dilución de la suspensión suelo:agua.", "Una corrección empírica porque bajo esas condiciones no se oxida todo el carbono orgánico del suelo.", "La conversión estequiométrica de carbono a CO₂.", "La corrección por la masa molecular del dicromato potásico."], "correct": 1, "rationale": "El método asume que solo se oxida una fracción del carbono orgánico. El factor 1.30 corrige empíricamente esa recuperación incompleta, no es una conversión estequiométrica simple."}, {"id": "A01Q08", "text": "¿El factor de Van Bemmelen 1.72 se usa para pasar de carbono orgánico a materia orgánica. Cuál es la hipótesis implícita?", "options": ["Que la humedad del suelo siempre es 17.2%.", "Que toda la materia orgánica es glucosa pura.", "Que el dicromato reduce exactamente 1.72 moles de Fe(III).", "Que la materia orgánica del suelo contiene, en promedio, aproximadamente un 58% de carbono."], "correct": 3, "rationale": "Si la materia orgánica contiene un 58% de C, entonces materia orgánica = carbono orgánico / 0.58, aproximadamente 1.72 veces el carbono. Es una aproximación composicional media."}, {"id": "A01Q09", "text": "¿Por qué puede ser importante añadir H₃PO₄ antes de la valoración con sal de Mohr en el método con dicromato y difenilamina?", "options": ["Para precipitar cuantitativamente todo el carbono orgánico como fosfato.", "Para neutralizar completamente el H₂SO₄ y valorar en medio basico.", "Para reducir directamente el dicromato sobrante.", "Para complejar Fe(III) y mejorar el salto redox y la nitidez del punto final del indicador."], "correct": 3, "rationale": "El ácido fosfórico puede complejar Fe(III), modificar el potencial del par Fe(III)/Fe(II) y facilitar un viraje más definido del indicador redox. No actua como reductor principal ni elimina la necesidad del medio ácido."}, {"id": "A01Q10", "text": "¿Si tras preparar la suspensión para pH o conductividad quedan arcillas finas en el sobrenadante y la lectura del electrodo fluctua, cuál es la actuación analítica más adecuada?", "options": ["Cambiar el resultado por la media de los valores extremos observados.", "Agitar más durante la lectura para homogeneizar mejor.", "Separar la fase líquida de forma reproducible, por centrifugacion o filtracion si procede, antes de medir.", "Añadir dicromato para destruir los coloides."], "correct": 2, "rationale": "Las particulas coloidales pueden depositarse sobre membranas, modificar localmente la composición y generar lecturas inestables. La separación controlada mejora la reproducibilidad operacional."}, {"id": "A01Q11", "text": "¿Una muestra se seca a 105 °C hasta masa constante. Cuál es la interpretación más rigurosa de esa humedad?", "options": ["Es exactamente toda el agua molecular existente en cualquier forma mineralógica.", "Es solo el agua que estaba en los poros macroscópicos y nunca incluye agua adsorbida.", "Es una humedad operacional definida por la perdida de masa bajo esas condiciones, útil para normalizar resultados.", "Es identica a la humedad relativa ambiental."], "correct": 2, "rationale": "El secado a 105 °C define una magnitud operacional. Es adecuada para normalizar determinaciones, aunque no necesariamente distingue todas las formas de agua ni otros procesos térmicos posibles en matrices complejas."}, {"id": "A01Q12", "text": "¿Si el pH-metro se calibra solo con tampón pH 7 antes de medir suelos ácidos y basicos, qué problema analítico aparece?", "options": ["El pH de todos los suelos se desplaza exactamente una unidad.", "Se corrige el desplazamiento de cero, pero no se verifica la pendiente de respuesta del electrodo en el intervalo de medida.", "El electrodo se convierte en selectivo a potasio.", "No aparece ninguno, porque una calibración a un punto corrige pendiente e intercepto."], "correct": 1, "rationale": "La calibración multipunto permite comprobar pendiente y linealidad de la respuesta Nernstiana en el intervalo de trabajo. Con un solo punto se ajusta de forma limitada y se compromete la exactitud fuera de ese punto."}, {"id": "A01Q13", "text": "¿Durante la oxidación de la materia orgánica con dicromato, un alumno no espera a que la mezcla se enfrie tras añadir ácido sulfúrico y continua inmediatamente. Cuál es el riesgo analítico principal?", "options": ["El dicromato se transforma cuantitativamente en permanganato.", "La temperatura no afecta a una reacción redox en medio ácido.", "La materia orgánica se vuelve inerte y no reacciona.", "Se incrementa la variabilidad de la extension de oxidación y del manejo volumetrico, ademas de aumentar el riesgo de perdidas o proyecciones."], "correct": 3, "rationale": "La oxidación con dicromato es sensible a condiciones de tiempo y temperatura. Saltarse tiempos de enfriamiento deteriora la reproducibilidad y la seguridad, y puede alterar la fracción oxidada."}, {"id": "A01Q14", "text": "¿Se analiza un suelo muy salino y otro poco salino. Ambos se preparan con la misma relación suelo:agua. Por qué la conductividad no permite, por si sola, concluir que el suelo salino contiene más nutrientes disponibles?", "options": ["Porque la conductividad solo mide iones positivos.", "Porque una CE alta siempre se debe a materia orgánica disuelta.", "Porque los nutrientes no conducen la electricidad.", "Porque mide carga iónica soluble total, incluyendo sales no nutritivas o incluso perjudiciales, sin identificar cada especie."], "correct": 3, "rationale": "Una CE elevada puede deberse a diversos iones. Algunos nutrientes contribuyen, pero también sales que generan estres osmótico. La técnica es global, no específica ni directamente nutricional."}, {"id": "A01Q15", "text": "¿En un informe de suelo se da el contenido de materia orgánica sin indicar si se calculo sobre masa fresca, seca al aire o seca a 105 °C. Cuál es el principal problema metrológico?", "options": ["El resultado pasa automaticamente a ser una concentración molar.", "La unidad porcentaje deja de existir.", "No afecta mientras se haya usado el mismo indicador.", "Se pierde trazabilidad operacional y comparabilidad entre muestras o laboratorios."], "correct": 3, "rationale": "La base de masa es parte del mensurando. Sin especificarla, no puede saberse si el denominador incluye agua variable, lo que impide comparar resultados de forma rigurosa."}], "2": [{"id": "A02Q01", "text": "¿Una miel se mide a una temperatura mayor que la de referencia y el valor se interpreta sin corrección. Cuál es el efecto más probable sobre la humedad calculada a partir de tablas empíricas?", "options": ["La humedad no cambia, porque el índice de refracción solo depende de la masa molecular.", "La humedad aparente será mayor que la real, porque el índice de refracción suele disminuir al aumentar la temperatura.", "La humedad aparente será menor que la real, porque el índice de refracción aumenta siempre con la temperatura.", "La temperatura solo afecta a la velocidad de lectura, no al valor obtenido."], "correct": 1, "rationale": "Al subir la temperatura disminuye la densidad y normalmente el índice de refracción. En miel, un índice menor se interpreta como mayor contenido de agua si no se aplica corrección térmica."}, {"id": "A02Q02", "text": "¿Por qué la refractometría es especialmente adecuada para un control rápido de humedad en miel, pero no puede considerarse una técnica específica para agua?", "options": ["Porque el índice de refracción responde a la composición global y las tablas son empíricas para una matriz concreta.", "Porque el agua no modifica el índice de refracción de mezclas azucaradas.", "Porque el refractómetro detecta solo enlaces O-H de forma selectiva.", "Porque las proteínas de la miel bloquean completamente la refracción."], "correct": 0, "rationale": "El índice de refracción es una propiedad global. La estimación de humedad funciona porque la composición de la miel se ajusta suficientemente a relaciones empíricas, no porque el equipo mida agua de manera selectiva."}, {"id": "A02Q03", "text": "¿En una disolución ideal de sacarosa, un grado Brix se interpreta como 1 g de sacarosa por 100 g de disolución. En zumo de naranja real, por qué es más correcto hablar de sólidos solubles totales aparentes?", "options": ["Porque el grado Brix es una unidad de pH.", "Porque el refractómetro responde también a ácidos orgánicos, sales y otros solutos, no solo a sacarosa.", "Porque el zumo de naranja no contiene ningun azúcar.", "Porque la pulpa convierte la escala Brix en una escala de densidad de sólidos insolubles."], "correct": 1, "rationale": "En una matriz compleja, ácido citrico, minerales, aminoacidos y otros solutos también afectan al índice de refracción. Por eso el Brix de zumo no equivale a sacarosa pura."}, {"id": "A02Q04", "text": "¿Una miel con 22% de agua según refractometría está fuera del límite general de calidad. Cuál es la razon tecnológica principal?", "options": ["El exceso de agua favorece el crecimiento de microorganismos osmofilos y la fermentacion.", "La miel con más agua deja de contener fructosa.", "El agua transforma la glucosa en almidon.", "El agua impide que el refractómetro mida azúcares."], "correct": 0, "rationale": "La miel tiene alta presión osmótica por su contenido en azúcares. Si la humedad aumenta demasiado, disminuye esa barrera y se facilita la fermentacion por levaduras osmofilas."}, {"id": "A02Q05", "text": "¿Quieres cuantificar azúcar en un refresco mediante refractometría con calibración instrumental. Cuál sería el diseno más coherente?", "options": ["Muestras de miel; eje x: masa de prisma; eje y: absorbancia a 880 nm.", "Patrones de sacarosa en agua; eje x: concentración de sacarosa; eje y: índice de refracción o Brix medido.", "Un único patrón de agua; eje x: tiempo; eje y: volumen de muestra.", "Patrones de NaCl; eje x: pH; eje y: temperatura del prisma."], "correct": 1, "rationale": "Para una cuantificación instrumental se preparan patrones del analito o un equivalente razonable, se mide la respuesta y se ajusta una curva. En refractometría, la respuesta es el índice de refracción o una escala derivada."}, {"id": "A02Q06", "text": "¿Por qué debe limpiarse cuidadosamente el prisma del refractómetro entre muestras de miel?", "options": ["Porque la miel destruye irreversiblemente el vidrio en cada medida.", "Porque la limpieza cambia la longitud de onda de la luz.", "Porque restos azucarados de la muestra anterior pueden modificar el índice medido de la siguiente y generar memoria positiva.", "Porque el prisma solo funciona si está cubierto por una película seca de azúcar."], "correct": 2, "rationale": "La miel es viscosa y rica en solutos. Una película residual altera la composición efectiva de la gota medida y puede producir contaminación cruzada."}, {"id": "A02Q07", "text": "¿Un zumo con mucha pulpa da lecturas poco estables en el refractómetro. Cuál es la interpretación analítica más adecuada?", "options": ["La pulpa no puede afectar a una medida óptica.", "Debe añadirse KOH para convertir la pulpa en sacarosa.", "La lectura inestable demuestra que el zumo no contiene sólidos solubles.", "La pulpa y particulas dispersan la luz y dificultan una interfase óptica reproducible; conviene clarificar o filtrar de forma controlada."], "correct": 3, "rationale": "La refractometría requiere un contacto óptico uniforme. Sólidos suspendidos, burbujas o heterogeneidad de pulpa deterioran la precisión aunque los solutos disueltos sean el objetivo."}, {"id": "A02Q08", "text": "¿Al calibrar el refractómetro con agua a 20 °C se obtiene un valor distinto del esperado. Qué decisión es más correcta antes de medir muestras?", "options": ["Medir las muestras por triplicado, ya que la repeticion elimina cualquier sesgo de calibración.", "Ignorar el problema si las muestras son dulces.", "Cambiar las unidades de Brix a pH.", "Ajustar o verificar el equipo, porque un error de cero se trasladará sistematicamente a todas las lecturas."], "correct": 3, "rationale": "La repeticion mejora precisión, no exactitud si el equipo está sesgado. La verificacion con un material de referencia simple como agua es un control basico del instrumento."}, {"id": "A02Q09", "text": "¿Si se aplica una tabla de humedad de miel a una disolución artificial de glucosa pura, por qué el resultado puede ser incorrecto?", "options": ["Porque la tabla incorpora empíricamente la composición típica de la miel, no de cualquier mezcla azucarada.", "Porque la humedad no puede calcularse en disoluciones acuosas.", "Porque las tablas solo funcionan con muestras coloreadas.", "Porque la glucosa no refracta la luz."], "correct": 0, "rationale": "Las tablas de miel dependen de la relación entre índice y agua en una matriz con fructosa, glucosa y otros solutos. Cambiar la matriz rompe la validez del modelo empírico."}, {"id": "A02Q10", "text": "¿Se mide un zumo recien exprimido con temperatura no equilibrada respecto al prisma. Qué efecto se espera?", "options": ["Ningun efecto, porque el refractómetro mide masas, no propiedades ópticas.", "Una mejora automatica de la sensibilidad.", "Mayor dispersión de resultados por gradientes térmicos y falta de equilibrio entre muestra e instrumento.", "Una separación cromatográfica de azúcares."], "correct": 2, "rationale": "La temperatura influye en el índice de refracción. Si la muestra no se estabiliza, la lectura puede derivar durante la medida y empeorar la precisión."}, {"id": "A02Q11", "text": "¿En zumo de naranja, un aumento de Brix durante la maduracion se interpreta a menudo como aumento de sólidos solubles. Cuál es una limitacion de esa interpretación?", "options": ["El Brix solo mide la cantidad de pulpa insoluble.", "El índice de refracción no cambia con la maduracion.", "Un Brix alto implica necesariamente menor sabor dulce.", "El Brix no distingue entre aumento de azúcares y cambios en ácidos u otros solutos solubles."], "correct": 3, "rationale": "La refractometría proporciona una respuesta global. Aunque el azúcar suele dominar, otros solutos contribuyen y la conclusion debe formularse como sólidos solubles aparentes."}, {"id": "A02Q12", "text": "¿Por qué la relación entre índice de refracción y concentración suele considerarse lineal solo dentro de intervalos limitados?", "options": ["Porque a concentraciones altas cambian interacciones soluto-disolvente, densidad y no idealidad de la disolución.", "Porque los refractómetros no pueden medir soluciones transparentes.", "Porque la luz deja de cambiar de velocidad a partir de 1% de soluto.", "Porque la linealidad solo es posible en gases."], "correct": 0, "rationale": "La linealidad es una aproximación útil a intervalos acotados. En mezclas concentradas, los efectos no ideales pueden curvar la relación entre composición e índice."}, {"id": "A02Q13", "text": "¿Si un estudiante informa los resultados de humedad de miel sin indicar temperatura de medida ni corrección aplicada, que falla principalmente?", "options": ["La trazabilidad del resultado, porque la temperatura es una variable crítica de la respuesta refractométrica.", "La identificacion cromatográfica de los azúcares.", "La estequiometría del agua, porque faltan moles de yodo.", "La unidad de porcentaje, que deja de ser valida."], "correct": 0, "rationale": "La temperatura forma parte de las condiciones de medida. Sin ella, el resultado no es comparable ni plenamente interpretable frente a tablas o límites de calidad."}, {"id": "A02Q14", "text": "¿Una muestra de miel parcialmente cristalizada se deposita sobre el prisma sin homogeneizar. Qué problema genera?", "options": ["La fase medida puede no ser representativa de la composición global, ya que cristales y fase líquida tienen composiciones distintas.", "El refractómetro convierte los cristales en índice cero.", "La cristalizacion hace que la medida sea automaticamente más exacta.", "La cristalizacion elimina todo el contenido de agua."], "correct": 0, "rationale": "La cristalizacion separa preferentemente componentes y puede crear heterogeneidad. La alícuota óptica debe representar a la muestra total o el resultado será sesgado."}, {"id": "A02Q15", "text": "¿Cuál de las siguientes situaciones justifica mejor usar una tabla empírica en lugar de una calibración con sacarosa pura para humedad en miel?", "options": ["Las tablas empíricas eliminan cualquier error instrumental.", "La sacarosa no tiene índice de refracción.", "Una calibración con sacarosa solo sirve para espectrofotometría UV.", "La miel es una matriz compleja con mezcla de azúcares y componentes minoritarios; la tabla relaciona empíricamente nD con agua en esa matriz."], "correct": 3, "rationale": "La tabla no es universal, pero puede ser más apropiada para una matriz estandarizada como miel que una curva de sacarosa pura, porque recoge el comportamiento composicional real de esa matriz."}], "3": [{"id": "A03Q01", "text": "¿En suelos calizos, por qué el extractante Olsen con NaHCO₃ a pH 8.5 puede aumentar el fósforo soluble?", "options": ["Porque disuelve selectivamente solo la materia orgánica y no afecta al calcio.", "Porque reduce todo el fosfato a fosfina gaseosa.", "Porque favorece la precipitacion de Ca como CaCO₃ y desplaza equilibrios que liberan fosfato de fases calcicas.", "Porque el bicarbonato actua como detector UV a 880 nm."], "correct": 2, "rationale": "En medios calizos, disminuir la actividad de Ca2+ mediante formación de carbonato favorece la liberacion de fosfato asociado a fases calcicas. La extracción es un equilibrio químico controlado por pH y solubilidad."}, {"id": "A03Q02", "text": "¿En suelos ácidos ricos en fosfatos de Fe y Al, el pH alcalino del extractante Olsen también ayuda a extraer P. Cuál es el razonamiento más adecuado?", "options": ["El pH no influye en la adsorción del fosfato en oxidos metalicos.", "Al elevar el pH disminuye la estabilidad relativa de algunas asociaciones fosfato-Fe/Al y aumenta la concentración de fosfato en disolución.", "A pH 8.5 el fósforo se convierte siempre en metal elemental.", "El bicarbonato impide que haya especies fosfato cargadas."], "correct": 1, "rationale": "La disponibilidad de fosfato depende de adsorción, precipitacion y especiacion ácido-base. Elevar el pH puede reducir la retencion en fases de Fe/Al y favorecer la extracción."}, {"id": "A03Q03", "text": "¿La mezcla de reacción debe prepararse dejando enfriar tras añadir H₂SO₄ antes de incorporar ácido ascórbico. Qué ocurriría si se añadiera el reductor a una disolución todavía caliente?", "options": ["Podría degradarse u oxidarse parcialmente, reduciendo la estabilidad del reactivo y la reproducibilidad de la formación del azul.", "No hay efecto posible porque el ascórbico es térmicamente inerte.", "El molibdato precipitaria como CaCO₃.", "El ácido ascórbico se transformaria en fosfato y aumentaria falsamente la concentración."], "correct": 0, "rationale": "El ácido ascórbico es un reductor susceptible de oxidación y degradación. Preparar el reactivo en caliente puede modificar su capacidad reductora y generar respuestas menos reproducibles."}, {"id": "A03Q04", "text": "¿Por qué los patrones de fósforo no deben prepararse solo en agua, sino con una cantidad fija de extractante Olsen neutralizado?", "options": ["Porque el fósforo no es soluble en agua destilada.", "Porque el bicarbonato es el analito que se mide a 880 nm.", "Porque el agua destruye el azul de fosfomolibdeno instantaneamente.", "Para que patrones y muestras tengan matriz, acidez y fuerza iónica comparables durante la formación del complejo."], "correct": 3, "rationale": "La sensibilidad de la reacción depende del medio. La calibración debe reproducir la matriz de las muestras para evitar sesgos de pendiente o intercepto."}, {"id": "A03Q05", "text": "¿Durante la neutralización del extractante con H₂SO₄ se produce efervescencia. Si el estudiante no agita y queda CO₂ disuelto o burbujas en el matraz, cuál es el problema más probable?", "options": ["Aumentará la variabilidad por cambios de volumen efectivo, turbidez o burbujas en la medida óptica.", "El fosfato se convertira cuantitativamente en nitrógeno.", "No afectará porque los gases no influyen en espectrofotometría.", "El CO₂ se medirá selectivamente a 880 nm como fósforo."], "correct": 0, "rationale": "Las burbujas y el CO₂ residual pueden afectar al enrase, a la homogeneidad y a la absorbancia aparente por dispersión. La eliminacion del ácido carbónico mejora la reproducibilidad."}, {"id": "A03Q06", "text": "¿Qué ventaja selectiva tiene medir el azul de fosfomolibdeno a 880 nm en extractos de suelo que pueden estar amarillos o pardos?", "options": ["A 880 nm solo absorben las cubetas de vidrio.", "A 880 nm la ley de Beer deja de aplicarse.", "A 880 nm se minimiza la interferencia de muchos compuestos coloreados amarillos/pardos que absorben más en UV-visible corto.", "A 880 nm todos los extractos orgánicos tienen absorbancia máxima."], "correct": 2, "rationale": "La medición en el rojo/NIR cercano puede aumentar selectividad frente a materia orgánica soluble coloreada. El complejo reducido azul tiene una banda intensa a esa longitud de onda."}, {"id": "A03Q07", "text": "¿El blanco de calibrado contiene extractante neutralizado y reactivos, pero concentración cero de fósforo. Por qué no es equivalente usar agua como blanco?", "options": ["Porque el agua contiene siempre 1 mg L ¹ de fósforo.⁻", "Porque el blanco debe ser más concentrado que las muestras.", "Porque el blanco debe corregir la absorbancia propia de reactivos y matriz del calibrado.", "Porque la absorbancia de un blanco nunca se resta."], "correct": 2, "rationale": "El blanco instrumental debe reproducir todo salvo el analito. Así corrige color, turbidez o absorbancia basal de reactivos y medio."}, {"id": "A03Q08", "text": "¿Si las disoluciones se miden antes de que hayan transcurrido los 10 min de desarrollo de color, qué efecto es esperable?", "options": ["No hay diferencia, porque el color se forma antes de mezclar.", "El complejo se descompone completamente en 10 segundos.", "Absorbancias infinitas por saturación inmediata.", "Absorbancias menores y dependientes del tiempo, con posible subestimación del P."], "correct": 3, "rationale": "La reacción requiere un tiempo definido para alcanzar una señal reproducible. Medir demasiado pronto convierte el tiempo de espera en una fuente de sesgo y dispersión."}, {"id": "A03Q09", "text": "¿Una muestra da una absorbancia por encima del patrón de mayor concentración. Cuál es la actuación correcta?", "options": ["Restar arbitrariamente 0.1 unidades de absorbancia.", "Diluir adecuadamente el extracto y repetir la medida dentro del intervalo de calibrado.", "Cambiar la longitud de onda hasta que la absorbancia entre en rango.", "Extrapolar siempre que el R² del calibrado sea mayor de 0.99."], "correct": 1, "rationale": "La cuantificación fiable exige interpolar dentro del rango validado. La extrapolación puede ser especialmente problemática si hay desviaciones de linealidad o efectos de matriz."}, {"id": "A03Q10", "text": "¿Por qué se expresan a veces los resultados de fósforo del suelo como P₂O₅ aunque la especie medida sea fosfato/fósforo?", "options": ["Porque el método transforma todo el fósforo en P₂O₅ sólido antes de medir.", "Porque un mol de P equivale a un mol de P₂O₅.", "Por convencion agronomica historica; se aplica un factor estequiométrico de conversión desde P a P₂O₅.", "Porque P₂O₅ absorbe directamente a 880 nm."], "correct": 2, "rationale": "El resultado analítico se obtiene como P, pero puede reportarse como P₂O₅ por convencion de fertilizantes. El factor es M(P₂O₅)/(2M(P)), aproximadamente 2.29."}, {"id": "A03Q11", "text": "¿Tras centrifugar, el extracto de suelo sigue ligeramente turbio. Qué efecto tendría medirlo sin filtrar?", "options": ["La medida a 880 nm elimina cualquier efecto de particulas.", "La turbidez solo afecta a medidas de pH, nunca a UV-Vis.", "La dispersión de luz puede aumentar la absorbancia aparente y empeorar la precisión.", "La turbidez convierte el fosfato en molibdato."], "correct": 2, "rationale": "Las particulas suspendidas dispersan luz y alteran la lectura espectrofotométrica. La filtracion, si es necesaria, controla un error físico, no químico."}, {"id": "A03Q12", "text": "¿El patrón primario de fósforo se seca previamente a 105 °C antes de preparar la disolución madre. Cuál es la razon analítica?", "options": ["Evitar un error de pesada por humedad o agua adsorbida en el sólido.", "Aumentar artificialmente la masa pesada para mejorar la sensibilidad.", "Eliminar el fósforo volátil del patrón.", "Transformar el fósforo en un compuesto fluorescente."], "correct": 0, "rationale": "La preparación de un patrón requiere conocer la cantidad real de sustancia. La humedad del sólido produciria una concentración preparada menor que la nominal."}, {"id": "A03Q13", "text": "¿Qué papel tiene el tartrato de antimonio y potasio en la reacción del azul de molibdeno usada para fosfato?", "options": ["Mejora/cataliza la formación del complejo reducido y aumenta la sensibilidad del método.", "Es el blanco que absorbe a 880 nm.", "Neutraliza cuantitativamente todo el bicarbonato sin ácido.", "Es el patrón primario de fósforo."], "correct": 0, "rationale": "En los métodos tipo molibdeno azul, el antimonio participa favoreciendo la formación del complejo coloreado de manera sensible y reproducible."}, {"id": "A03Q14", "text": "¿Si se añade H₂SO₄ rápidamente al extractante bicarbonato de la muestra, provocando efervescencia violenta y perdida de gotas, qué tipo de error aparece?", "options": ["Aumento selectivo de la concentración de fosfato.", "Error nulo, porque solo se pierde gas.", "Error sistemático por perdida de una fracción desconocida de analito/matriz antes de la medida.", "Mejora de la sensibilidad porque se elimina CO₂."], "correct": 2, "rationale": "La adición brusca puede arrastrar líquido y analito fuera del recipiente. La neutralización gota a gota y la agitacion controlada evitan perdidas de muestra."}, {"id": "A03Q15", "text": "¿Un estudiante usa cubetas con huellas y gotas exteriores para medir a 880 nm. Qué problema genera?", "options": ["Perdidas y dispersión de luz en el camino óptico, con absorbancias no atribuibles al complejo.", "Desplazamiento del pH del extractante a 8.5.", "Aumento estequiométrico del fósforo.", "Separación cromatográfica de los componentes."], "correct": 0, "rationale": "La espectrofotometría exige un camino óptico limpio y reproducible. Suciedad externa o gotas modifican la transmitancia y deterioran exactitud y precisión."}], "4": [{"id": "A04Q01", "text": "¿Por qué el capilar de silica fundida se acondiciona con NaOH antes de iniciar la serie analítica?", "options": ["Para limpiar y activar grupos silanol, generando una superficie reproducible y un flujo electroosmótico estable.", "Para neutralizar permanentemente todos los analitos aromáticos.", "Para convertir el capilar en una columna de GC.", "Para eliminar la necesidad de electrolito de fondo."], "correct": 0, "rationale": "El tratamiento alcalino limpia la superficie y deprotona silanoles. La densidad de carga superficial controla el EOF, por lo que el acondicionamiento es esencial para tiempos de migración reproducibles."}, {"id": "A04Q02", "text": "¿A pH 9, ASA y ácido salicílico están mayoritariamente como aniones. En presencia de EOF hacia el detector, por qué aun pueden separarse?", "options": ["Porque solo uno de ellos absorbe radiacion UV.", "Porque la masa pesada de cada patrón determina directamente el tiempo de migración.", "Porque los aniones no se mueven en CE.", "Porque cada anión tiene movilidad electroforética propia e interacciones distintas con el medio, que modifican su velocidad neta."], "correct": 3, "rationale": "La velocidad neta combina EOF e impulso electroforético. Aunque ambos sean arrastrados hacia el detector, sus movilidades e interacciones son distintas y pueden generar resolución."}, {"id": "A04Q03", "text": "¿La disolución tampón contiene SDS 4 mM, cerca pero por debajo de la CMC en agua pura. Si se aumentará a 50 mM, qué cambio sería más probable?", "options": ["El SDS dejaría de tener carga y desaparecería el EOF.", "Todos los compuestos eluirian necesariamente a tiempo cero.", "La separación tenderia a comportarse como MEKC, con micelas actuando como fase pseudoestacionaria.", "El detector UV dejaría de funcionar a 200 nm."], "correct": 2, "rationale": "Por encima de la CMC se forman micelas. Estas pueden particionar diferencialmente los analitos y cambiar selectividad, resolución y tiempos de migración respecto a una CE zonal simple."}, {"id": "A04Q04", "text": "¿Qué problema causaria inyectar directamente una disolución de comprimido con excipientes insolubles sin filtrar?", "options": ["Ningun problema, porque los sólidos insolubles no entran en el vial.", "Riesgo de obstruccion del capilar, adsorción de particulas y cambios no reproducibles de EOF y presión efectiva.", "Desaparición del ácido salicílico por volatilización.", "Aumento controlado de la resolución por cromatografía sólido-líquido."], "correct": 1, "rationale": "La CE usa capilares estrechos. Particulas o excipientes pueden obstruir, ensuciar o modificar la superficie, afectando a área y tiempo de migración."}, {"id": "A04Q05", "text": "¿Si aparece un pico minoritario de ácido salicílico en una aspirina comercial, cuál combinacion de explicaciones es más plausible?", "options": ["Reducción electroquímica del ASA en el detector y formación de glucosa.", "Evaporación del excipiente y formación de salicilato gaseoso.", "Contaminación por el tampón de tetraborato, que contiene salicílico.", "Impureza de sintesis por acetilacion incompleta y/o hidrólisis del ASA durante almacenamiento."], "correct": 3, "rationale": "El ácido salicílico puede proceder de reactivo no acetilado o de degradación del ASA por hidrólisis. En está última se forma también ácido acético, que no es el analito principal UV."}, {"id": "A04Q06", "text": "¿Por qué se usa detección a 200/220 nm para estos analitos aromáticos y una referencia a 350 nm?", "options": ["A 350 nm absorbe selectivamente el ASA y a 200 nm solo el agua.", "Los aromáticos absorben en UV bajo; la referencia ayuda a corregir variaciones de fondo, deriva o efectos ópticos no específicos.", "La detección UV no depende de la longitud de onda.", "La referencia a 350 nm convierte la técnica en fluorescencia."], "correct": 1, "rationale": "ASA y salicílico absorben en UV. Una longitud de referencia donde no se espera absorbancia analítica ayuda a corregir fondo instrumental, aunque no elimina interferencias coeluyentes reales."}, {"id": "A04Q07", "text": "¿La inyección hidrodinámica se realiza a 50 mbar durante 10 s. Si una muestra tiene una viscosidad mucho mayor que los patrones, qué efecto puede aparecer?", "options": ["La carga de los analitos se duplicara.", "La muestra se convertira en fase móvil.", "Se inyectara un volumen efectivo diferente, afectando áreas de pico y exactitud.", "El tiempo de migración será siempre cero."], "correct": 2, "rationale": "En inyección hidrodinámica, el volumen introducido depende de presión, tiempo, dimensiones y viscosidad. Matrices muy distintas pueden producir errores de cantidad inyectada."}, {"id": "A04Q08", "text": "¿Qué consecuencia tendría no lavar el capilar con BGE entre inyecciones?", "options": ["Aumentaria el riesgo de memoria, cambios de superficie y deriva de tiempos de migración.", "Convertiria la separación en espectrometria de masas.", "No tendría efecto porque el capilar se autolimpia con el voltaje.", "Mejoraria siempre la separación por acumulacion de analito."], "correct": 0, "rationale": "Los lavados estabilizan la composición interna, eliminan restos adsorbidos y restauran condiciones de partida. Sin ellos, la reproducibilidad se deteriora."}, {"id": "A04Q09", "text": "¿Si el pH del BGE bajara accidentalmente de 9 a valores cercanos al pKa de los analitos, qué efecto sería más probable?", "options": ["Disminuiría la fracción ionizada y cambiarían movilidad y selectividad de separación.", "El EOF aumentaria siempre de forma ilimitada.", "El SDS precipitaria obligatoriamente como metal.", "Los analitos se volverian neutros y no podrían absorber UV."], "correct": 0, "rationale": "La movilidad electroforética depende de la carga efectiva. Cambios de pH próximos a pKa modifican ionización, interacciones y tiempos de migración."}, {"id": "A04Q10", "text": "¿Por qué se preparan patrones multicomponente de ASA y salicílico en lugar de calibrar cada uno completamente por separado?", "options": ["Porque reproducen mejor la presencia simultanea de ambos analitos y permiten evaluar resolución, identidad y cuantificación en condiciones similares a la muestra.", "Porque la calibración multicomponente elimina cualquier interferencia de excipientes.", "Porque el ASA se transforma en salicílico solo en los patrones separados.", "Porque la CE solo funciona si todos los patrones tienen dos analitos."], "correct": 0, "rationale": "Cuando dos analitos se determinan en la misma corrida, los patrones multicomponente permiten comprobar separación y respuesta bajo condiciones comparables a la mezcla real."}, {"id": "A04Q11", "text": "¿Un pico de la muestra aparece al mismo tiempo de migración que el salicílico, pero el perfil UV no coincide con el patrón. Qué conclusion es más prudente?", "options": ["Debe integrarse como ASA porque todos los picos aromáticos son iguales.", "El pico debe eliminarse matemáticamente sin justificarlo.", "La identificacion solo por tiempo de migración puede ser insuficiente; podría haber co-migración o interferencia.", "El tiempo de migración demuestra identidad absoluta en cualquier CE."], "correct": 2, "rationale": "La coincidencia temporal es una evidencia, no una prueba absoluta. La confirmacion con espectro, fortificacion o condiciones alternativas mejora la fiabilidad de identificacion."}, {"id": "A04Q12", "text": "¿Si la muestra de aspirina se diluye de forma insuficiente y las áreas quedan por encima del patrón más concentrado, qué debe hacerse?", "options": ["Preparar una dilución adicional y cuantificar por interpolación en el rango lineal.", "Reducir el tiempo de análisis para bajar el área.", "Extrapolar porque la CE siempre es lineal a cualquier concentración.", "Usar la altura del ruido cómo señal."], "correct": 0, "rationale": "La exactitud requiere trabajar dentro del rango validado. Las respuestas fuera de rango pueden mostrar sobrecarga, no linealidad o mala integración."}, {"id": "A04Q13", "text": "¿Qué efecto puede producir una concentración salina muy diferente entre muestra y BGE?", "options": ["Impedir que el detector UV emita luz.", "Eliminar la carga de todos los analitos.", "Alterar conductividad, campo eléctrico local y eficiencia, generando distorsion de picos o calentamiento Joule.", "Aumentar indefinidamente la longitud del capilar."], "correct": 2, "rationale": "La CE es sensible a conductividad y composición del medio. Diferencias importantes pueden alterar apilamiento, dispersión, temperatura y movilidad efectiva."}, {"id": "A04Q14", "text": "¿La referencia a 350 nm corrige parte del fondo óptico. Qué NO puede corregir adecuadamente?", "options": ["Un compuesto co-migrante que absorbe también a 200/220 nm con cinética de pico similar.", "Una deriva lenta de lámpara comun a ambas longitudes de onda.", "Pequeños cambios de turbidez no específica.", "Variaciones de absorbancia basal sin estructura de pico."], "correct": 0, "rationale": "La sustraccion de referencia no resuelve selectividad química si un interferente co-migra y absorbe en la longitud analítica. La separación y confirmacion siguen siendo necesarias."}, {"id": "A04Q15", "text": "¿Durante la disolución del comprimido, un alumno aplica ultrasonidos prolongados y calienta la muestra. Cuál es un riesgo a considerar para ASA?", "options": ["Convertir el salicílico en SDS.", "Eliminar toda absorbancia UV.", "Favorecer hidrólisis del éster y aumentar artificialmente el salicílico.", "Transformar ASA en hierro metalico."], "correct": 2, "rationale": "El ASA es un éster susceptible de hidrólisis, especialmente con humedad y condiciones agresivas. El pretratamiento debe asegurar disolución sin inducir degradación apreciable."}], "5": [{"id": "A05Q01", "text": "¿En Karl Fischer se pesa una pequeña masa de cacao y se tarda demasiado en introducirla en la celda. Qué sesgo es más probable?", "options": ["Sobrestimación de humedad por adsorción de agua ambiental por la muestra y/o entrada de humedad en la celda.", "Solo cambia el color del cacao, no la valoración.", "Ninguno, porque el reactivo solo reacciona con agua original de la muestra.", "Subestimación, porque el agua del cacao se destruye al contacto con aire."], "correct": 0, "rationale": "KF es muy sensible al agua. En masas pequeñas, cualquier humedad ambiental adsorbida o introducida se atribuye a la muestra y aumenta el consumo de reactivo."}, {"id": "A05Q02", "text": "¿Se
