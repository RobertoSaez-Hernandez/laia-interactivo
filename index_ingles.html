function practiceLabel(value){if(!/^P\d+(\/P\d+)?$/.test(value))return `<span class="${value==='Examen'?'exam':'seminar'}">${esc(value)}</span>`;return value.split('/').map(code=>{const n=Number(code.slice(1));return `<span class="practice-pill">${esc(code)}</span>`}).join('');}
function renderHome(){document.getElementById('home').innerHTML=`<div class="hero"><p class="eyebrow">Academic year 2026–27</p><h1>Applied Instrumental Analysis Laboratory</h1><p>Review the practical timetable, prepare each session and complete private self-assessment activities. The page does not send assessment data to teaching staff.</p></div><div class="grid four"><article class="card"><span class="count">11</span><h2>Practicals</h2><p>Ten technical practical guides and one student-developed practical.</p><button class="go" data-jump="practices">View practicals</button></article><article class="card"><span class="count">3</span><h2>Laboratories</h2><p>A1, A2 and A3, organised by working pairs.</p><button class="go" data-jump="schedule">View schedule</button></article><article class="card"><span class="count">100</span><h2>Private questions</h2><p>An independent self-assessment bank: 10 questions per practical.</p><button class="go" data-jump="autoeval">Start practising</button></article><article class="card"><span class="count">7</span><h2>Simulations</h2><p>Seven data-based scenarios for practising analytical decisions and chemical reasoning.</p><button class="go" data-jump="simulation">Open simulations</button></article></div><div class="grid two"><article class="card"><h2>How to use this resource</h2><p>First find your laboratory and working pair. Each session shows the assigned practical. Then use the self-assessment and simulations to revise; results remain only in this browser.</p></article><article class="card"><h2>Final questions 11</h2><p>The guide will be developed by the students. No self-assessment is currently available.</p><div class="notice">Information and materials will be added when they have been defined.</div></article></div>`;document.querySelectorAll('[data-jump]').forEach(btn=>btn.onclick=()=>changeView(btn.dataset.jump));}
function renderSchedule(){const lab=document.getElementById('labFilter')?.value||'all';const pair=document.getElementById('pairFilter')?.value||'all';let rows=[];for(const entry of SCHEDULE){for(const [laboratory,items] of Object.entries(entry.labs)){if(lab!=='all'&&lab!==laboratory)continue;const sessionItems=items.length===1?[{pair:"All",value:items[0]}]:items.map((value,index)=>({pair:PAIRS[index],value}));for(const item of sessionItems){if(pair!=='all'&&pair!==item.pair)continue;rows.push(`<tr><td>${esc(entry.date)}</td><td>${esc(entry.time)}</td><td><strong>${esc(laboratory)}</strong></td><td>${esc(item.pair)}</td><td><div class="slot">${practiceLabel(item.value)}</div></td></tr>`);}}}document.getElementById('schedule').innerHTML=`<h1 class="section-title">Schedule and allocation</h1><p class="lead">Filter the table by laboratory and working pair.</p><div class="filterbar"><label>Laboratory<select id="labFilter"><option value="all">All</option><option value="A1">A1</option><option value="A2">A2</option><option value="A3">A3</option></select></label><label>Pair<select id="pairFilter"><option value="all">All</option>${PAIRS.map(p=>`<option value="${p}">${p}</option>`).join('')}</select></label></div><div class="schedule-wrap"><table><thead><tr><th>Date</th><th>Time</th><th>Laboratory</th><th>Pair</th><th>Activity</th></tr></thead><tbody>${rows.join('')}</tbody></table></div><p class="small">The examination date is awaiting confirmation. P11 is a student-developed practical and has no self-assessment available.</p>`;document.getElementById('labFilter').value=lab;document.getElementById('pairFilter').value=pair;document.getElementById('labFilter').onchange=renderSchedule;document.getElementById('pairFilter').onchange=renderSchedule;}
function rich(value){return `<p>${esc(value).replace(/\s+/g,' ').trim()}</p>`;}
function equationsHtml(item){return item.equations?.length?`<section class="equations"><h2>Expresiones químicas</h2>${item.equations.map(equation=>`<div class="equation">${esc(equation)}</div>`).join('')}</section>`:'';}
function videoCards(item){return item.videos.length?`<section class="video-grid">${item.videos.map(video=>`<article class="video"><span class="video-play" aria-hidden="true">▶</span><a href="${esc(video.url)}" target="_blank" rel="noreferrer">${esc(video.label)}<span>Abrir vídeo en YouTube ↗</span></a></article>`).join('')}</section>`:'';}
function renderPractices(){const item=practice(currentPractice);document.getElementById('practices').innerHTML=`<div class="practice-shell"><aside class="practice-list" aria-label="Practicals">${PRACTICES.map(p=>`<button class="${p.number===item.number?'active':''}" data-practice="${p.number}"><strong>P${p.number}</strong> · ${esc(p.short)}</button>`).join('')}</aside><article><p class="eyebrow">Practical ${item.number}</p><h1 class="practice-title">${esc(item.title)}</h1>${item.number===11?`<div class="notice" style="margin-top:18px">${esc(item.notice)}</div>`:`<div class="meta"><span class="tag">Complete guide</span><span class="tag">10 self-assessment questions</span>${item.videos.length?`<span class="tag">${item.videos.length} video(s)</span>`:''}</div>${Object.entries(item.sections).map(([title,content])=>`<details class="content-block" ${title==="Objectives"?'open':''}><summary>${esc(title)}</summary><div class="rich">${rich(content)}</div></details>`).join('')}${equationsHtml(item)}${videoCards(item)}${item.number===3?`<div class="card" style="margin-top:18px"><h2>Data simulation</h2><p>Practise selecting standards, applying dilution and calculating P and P₂O₅ with a new data set on each attempt.</p><button class="primary" data-sim="3">Open phosphorus simulation</button></div>`:''}<div class="card" style="margin-top:18px"><h2>Self-assessment</h2><p>A private five-question quiz with explanations at the end.</p><button class="primary" data-start="${item.number}">Start self-assessment</button></div>`}</article></div>`;document.querySelectorAll('[data-practice]').forEach(button=>button.onclick=()=>{currentPractice=Number(button.dataset.practice);renderPractices();});document.querySelectorAll('[data-start]').forEach(button=>button.onclick=()=>{currentPractice=Number(button.dataset.start);newQuiz(currentPractice);changeView('autoeval');});document.querySelectorAll('[data-sim]').forEach(button=>button.onclick=()=>changeView('simulation'));}
function newQuiz(number=currentPractice){currentPractice=Number(number);currentQuiz=shuffle(AUTOQUIZ_BANK[String(currentPractice)]).slice(0,5).map(question=>({...question,shownOptions:shuffle(question.options.map((text,index)=>({text,index})))}));selectedAnswers={};}
function renderAutoeval(){if(!currentQuiz.length||currentQuiz[0].id.slice(1,3)!==String(currentPractice).padStart(2,'0'))newQuiz(currentPractice);const p=practice(currentPractice);document.getElementById('autoeval').innerHTML=`<h1 class="section-title">Self-assessment</h1><p class="lead">These questions are for practice. They are not sent to or recorded by teaching staff.</p><div class="card"><div class="quiz-head"><div><h2>${esc(p.title)}</h2><p>Five random questions from a bank of 10. Unlimited attempts.</p></div><label class="small">Practical<select id="quizPractice">${PRACTICES.filter(p=>p.number<=10).map(item=>`<option value="${item.number}" ${item.number===currentPractice?'selected':''}>P${item.number} · ${esc(item.short)}</option>`).join('')}</select></label></div><form id="quizForm">${currentQuiz.map((question,number)=>`<fieldset class="question"><legend>${number+1}. ${esc(question.text)}</legend>${question.shownOptions.map(option=>`<label class="option"><input type="radio" name="${question.id}" value="${option.index}"><span>${esc(option.text)}</span></label>`).join('')}</fieldset>`).join('')}<button class="primary" type="submit">Mark self-assessment</button><button class="secondary" type="button" id="newQuiz">Generate another quiz</button></form><div id="result"></div></div>`;document.getElementById('quizPractice').onchange=e=>{newQuiz(e.target.value);renderAutoeval();};document.getElementById('newQuiz').onclick=()=>{newQuiz(currentPractice);renderAutoeval();};document.getElementById('quizForm').onsubmit=event=>{event.preventDefault();const form=new FormData(event.currentTarget);let correct=0;const details=currentQuiz.map((question,index)=>{const answer=Number(form.get(question.id));const good=answer===question.correct;if(good)correct++;const selected=Number.isInteger(answer)?question.options[answer]:"No answer";return `<div class="feedback ${good?'good':'bad'}"><strong>${index+1}. ${good?"Correct":"Review"}</strong><br>Your answer: ${esc(selected)}<br>Correct answer: ${esc(question.options[question.correct])}<br><span class="small">${esc(question.rationale)}</span></div>`}).join('');localStorage.setItem(`laia-en-GB-autoeval-p${currentPractice}`,JSON.stringify({date:new Date().toISOString(),score:correct,total:5}));document.getElementById('result').innerHTML=`<div class="result"><strong>Result: ${correct}/5</strong><p class="small">This result is stored only in this browser and is not shared with teaching staff.</p>${details}</div>`;};}
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>changeView(button.dataset.view));renderHome();
</script>
<script>
const legacyRenderSimulation=()=>{};
let currentSimulation=3,genericScenario=null;
const SIMULATION_MODULES={
2:{title:'Materia orgánica del suelo',subtitle:'Oxidación con dicromato y valoración de retorno',make(){const mass=1.10+Math.random()*.25,humidity=5+Math.random()*7,blank=22.8+Math.random()*1.4,sample=13.8+Math.random()*3.2;return{rows:[['Masa de suelo pesada',`${mass.toFixed(3)} g`],['Humedad a 105 °C',`${humidity.toFixed(1)} %`],['Sal de Mohr consumida por el blanco',`${blank.toFixed(2)} mL`],['Sal de Mohr consumida por la muestra',`${sample.toFixed(2)} mL`]],metrics:[`Masa seca: ${(mass*(1-humidity/100)).toFixed(3)} g`,`Diferencia de valoración: ${(blank-sample).toFixed(2)} mL`],decision:{prompt:'¿Qué interpretación de las valoraciones y del resultado final es químicamente correcta?',options:[{id:'a',text:'Un menor volumen de sal de Mohr en la muestra indica que quedó menos dicromato; por tanto, se oxidó más materia orgánica. El resultado debe expresarse sobre masa seca y aplicar los factores del método.'},{id:'b',text:'Un menor volumen de sal de Mohr indica menos materia orgánica, porque se ha gastado menos reductor.'},{id:'c',text:'El contenido puede expresarse directamente sobre la masa fresca; la humedad no afecta al cálculo.'}],correct:'a',feedback:'La materia orgánica reduce parte del dicromato. Cuanto menos oxidante quede para valorar con Fe(II), menor es el volumen de sal de Mohr y mayor la fracción oxidada. La base seca evita que la humedad introduzca un sesgo.'}};},questions:[{prompt:'El método corrige el carbono oxidable con 1,30 y después usa 1,72 para estimar materia orgánica. ¿Qué representan?',options:[{id:'a',text:'Dos correcciones de volumen de la bureta.'},{id:'b',text:'1,30 compensa la oxidación incompleta estimada del carbono; 1,72 convierte carbono orgánico en materia orgánica asumiendo aproximadamente un 58 % de C.'},{id:'c',text:'1,30 corrige la humedad y 1,72 el blanco.'}],correct:'b',feedback:'Los factores tienen distinto origen: uno es una corrección empírica por oxidación incompleta y el otro corresponde a la composición media supuesta de la materia orgánica.'},{prompt:'Antes de valorar el exceso de dicromato se añade ácido fosfórico. ¿Qué función analítica explica mejor esta operación?',options:[{id:'a',text:'Complejar Fe(III) y modificar el sistema redox para obtener un viraje más definido durante la valoración con Fe(II).'}, {id:'b',text:'Precipitar cuantitativamente todo el dicromato restante.'},{id:'c',text:'Convertir el carbono orgánico en CO₂ después de la valoración.'}],correct:'a',feedback:'El H₃PO₄ compleja Fe(III) y ayuda a controlar el potencial del sistema, haciendo más nítida la detección del punto final.'},{prompt:'Para una misma muestra, ¿por qué el pH medido en KCl puede diferir del obtenido en agua?',options:[{id:'a',text:'El K⁺ desplaza H⁺ adsorbidos en coloides del suelo y revela parte de la acidez intercambiable.'},{id:'b',text:'El KCl neutraliza irreversiblemente todos los ácidos del suelo.'},{id:'c',text:'El pH no puede cambiar porque la masa de suelo es idéntica.'}],correct:'a',feedback:'El catión K⁺ participa en el intercambio sobre los coloides y puede desplazar protones adsorbidos; por eso ambos métodos deben identificarse al informar el resultado.'}]},
4:{title:'Aspirina por electroforesis capilar',subtitle:'Movilidad electroforética, EOF y calidad de la muestra',make(){const asa=3.15+Math.random()*.28,sa=4.10+Math.random()*.35;return{rows:[['pH del BGE','9,0'],['Pico X: tiempo de migración',`${asa.toFixed(2)} min`],['Pico Y: tiempo de migración',`${sa.toFixed(2)} min`],['Detección','200/220 nm; referencia 350 nm'],['EOF','Hacia el cátodo/detector']],metrics:[`Pico más temprano: X (${asa.toFixed(2)} min)`,`Diferencia de migración: ${(sa-asa).toFixed(2)} min`],decision:{prompt:'A pH 9 ambos analitos están esencialmente como aniones. Con EOF intenso hacia el detector, ¿qué asignación es más razonable?',options:[{id:'a',text:'X es ácido salicílico: al ser más pequeño, su movilidad electroforética aniónica se opone más al EOF y llega antes.'},{id:'b',text:'X es ASA: su movilidad aniónica se opone menos al EOF que la del salicilato, por lo que su movilidad neta al detector puede ser mayor.'},{id:'c',text:'Los dos picos no se pueden asignar porque los aniones nunca alcanzan el detector.'}],correct:'b',feedback:'El EOF puede arrastrar ambos aniones hacia el detector. La especie con movilidad electroforética aniónica menos intensa queda menos frenada frente al EOF y puede migrar antes.'}};},questions:[{prompt:'Aparece un pico minoritario de ácido salicílico en una aspirina comercial. ¿Qué explicación química es coherente?',options:[{id:'a',text:'La hidrólisis del ASA por humedad puede producir ácido salicílico y ácido acético; también puede quedar salicilato por síntesis incompleta.'},{id:'b',text:'El ASA se oxida inevitablemente a salicilato y oxígeno.'},{id:'c',text:'El ácido salicílico se genera por la radiación UV del detector durante la separación.'}],correct:'a',feedback:'El ASA puede contener ácido salicílico residual o hidrolizarse en presencia de humedad, liberando ácido salicílico y ácido acético.'},{prompt:'Tras disolver el comprimido queda un sólido de excipientes. ¿Por qué debe filtrarse antes de la inyección?',options:[{id:'a',text:'Para evitar obstrucciones, adsorción y cambios no reproducibles de EOF y de tiempos de migración.'},{id:'b',text:'Para convertir los excipientes en especies fluorescentes.'},{id:'c',text:'Porque el filtro aumenta químicamente la concentración de ASA.'}],correct:'a',feedback:'Las partículas pueden bloquear o ensuciar el capilar y alterar la superficie de sílice, con pérdida de reproducibilidad de la separación.'},{prompt:'El BGE contiene 4 mM de SDS y la CMC en agua es cercana a 8 mM. ¿Qué conclusión prudente es la más adecuada?',options:[{id:'a',text:'No puede asumirse una MEKC intensa solo por añadir SDS; la concentración está cerca o por debajo de la CMC, aunque las sales pueden modificarla.'},{id:'b',text:'Siempre hay micelas abundantes, independientemente de la concentración.'},{id:'c',text:'El SDS elimina por completo el EOF.'}],correct:'a',feedback:'La formación micelar depende de superar la CMC efectiva. La fuerza iónica puede modificarla, pero no permite dar por sentada una fase pseudoestacionaria dominante.'}]},
5:{title:'Humedad de cacao por Karl Fischer',subtitle:'Estequiometría, título del reactivo y control de la humedad',make(){const vStd=2.25+Math.random()*.45,factor=5/vStd,mass=47+Math.random()*8,vSample=1.35+Math.random()*.75,water=factor*vSample,pct=water/mass*100;return{rows:[['Patrón de agua introducido','5,00 μL = 5,00 mg'],['Reactivo gastado en estandarización',`${vStd.toFixed(2)} mL`],['Factor KF calculado',`${factor.toFixed(2)} mg H₂O mL⁻¹`],['Masa de cacao transferida',`${mass.toFixed(1)} mg`],['Reactivo gastado por la muestra',`${vSample.toFixed(2)} mL`]],metrics:[`Agua valorada: ${water.toFixed(2)} mg`,`Humedad: ${pct.toFixed(2)} % m/m`],decision:{prompt:'La muestra se pesó en un vidrio de reloj abierto y se tardó un minuto en transferirla. ¿Cómo afecta previsiblemente al resultado?',options:[{id:'a',text:'La humedad se subestima porque el aire consume el iodo antes de que entre la muestra.'},{id:'b',text:'La humedad se sobreestima: el cacao puede captar agua ambiental y el método KF es directamente sensible a cada aporte adicional de agua.'},{id:'c',text:'No hay efecto porque el punto final amperométrico corrige la humedad ambiental.'}],correct:'b',feedback:'La muestra y la celda deben protegerse de la humedad ambiental. En Karl Fischer cualquier agua adicional se valora estequiométricamente y produce un sesgo positivo.'}};},questions:[{prompt:'Según la reacción de Karl Fischer, ¿qué relación estequiométrica es relevante entre agua e iodo?',options:[{id:'a',text:'Un mol de agua consume un mol de I₂ en la reacción global del método.'},{id:'b',text:'Un mol de agua produce dos moles de I₂.'},{id:'c',text:'El agua solo actúa como disolvente y no interviene en la estequiometría.'}],correct:'a',feedback:'La estequiometría agua–iodo permite expresar el título del reactivo como masa de agua equivalente por mililitro.'},{prompt:'¿Por qué la humedad ambiental suele ser más crítica en Karl Fischer que en un secado gravimétrico en estufa?',options:[{id:'a',text:'Porque pequeñas entradas de agua se convierten directamente en consumo de titulante y son comparables al analito cuando la muestra es pequeña.'},{id:'b',text:'Porque el agua ambiental no tiene masa y solo afecta a la señal eléctrica.'},{id:'c',text:'Porque la estufa elimina el agua del ambiente antes de pesar.'}],correct:'a',feedback:'La microvaloración es extremadamente sensible a agua adventicia; en gravimetría se trabaja normalmente con masas de muestra mayores y el error relativo puede ser mucho menor.'},{prompt:'¿Por qué un Soxhlet con disolvente fresco condensado extrae grasa mejor que una única extracción estática?',options:[{id:'a',text:'Porque cada ciclo restablece un gradiente de concentración favorable y mantiene la partición de los lípidos hacia disolvente casi puro.'},{id:'b',text:'Porque el disolvente se vuelve cada vez más saturado y por eso extrae mejor.'},{id:'c',text:'Porque el reflujo transforma químicamente toda grasa en agua.'}],correct:'a',feedback:'La recirculación aporta repetidamente disolvente poco cargado de analito, manteniendo la fuerza impulsora de la extracción.'}]},
6:{title:'Perfil de aceites por GC y HPLC',subtitle:'FAMES, normalización interna y huellas de tocoferoles',make(){const oleic=68+Math.random()*7,linoleic=8+Math.random()*5,linolenic=.45+Math.random()*.55,alpha=155+Math.random()*65,betaGamma=42+Math.random()*35;return{rows:[['Oleico (área relativa GC-FID)',`${oleic.toFixed(1)} %`],['Linoleico (área relativa GC-FID)',`${linoleic.toFixed(1)} %`],['Linolénico (área relativa GC-FID)',`${linolenic.toFixed(2)} %`],['α-tocoferol (HPLC-FLD)',`${alpha.toFixed(0)} mg kg⁻¹`],['β+γ-tocoferoles (HPLC-FLD)',`${betaGamma.toFixed(0)} mg kg⁻¹`]],metrics:[`Oleico/linoleico: ${(oleic/linoleic).toFixed(1)}`,`α/(β+γ): ${(alpha/betaGamma).toFixed(2)}`],decision:{prompt:'El perfil de FAMES es compatible con oliva, pero también podría corresponder a un girasol alto oleico. ¿Qué conclusión está mejor sustentada?',options:[{id:'a',text:'GC-FID por sí sola confirma de forma inequívoca el origen botánico.'},{id:'b',text:'El perfil de FAMES es informativo, pero conviene contrastarlo con el perfil absoluto de tocoferoles por HPLC-FLD para discriminar una posible mezcla de aceites.'},{id:'c',text:'Los tocoferoles no aportan información porque todos los aceites tienen idéntico perfil.'}],correct:'b',feedback:'Los aceites de semillas alto oleico pueden imitar ciertas relaciones de ácidos grasos. Los tocoferoles proporcionan una huella complementaria y más discriminante.'}};},questions:[{prompt:'¿Por qué es necesario convertir triglicéridos en FAMES antes de analizarlos por GC?',options:[{id:'a',text:'Los FAMES son más volátiles y térmicamente manejables; los triglicéridos son demasiado pesados y poco adecuados para el inyector y la columna de GC.'},{id:'b',text:'La transesterificación vuelve fluorescentes a los triglicéridos.'},{id:'c',text:'La GC solo admite compuestos iónicos.'}],correct:'a',feedback:'La derivatización reduce masa molecular y mejora volatilidad y estabilidad térmica de los derivados que se separan.'},{prompt:'¿Qué ventaja principal aporta HPLC con detección fluorimétrica para tocoferoles en aceite?',options:[{id:'a',text:'Mayor selectividad y sensibilidad para trazas de tocoferoles frente a la matriz mayoritaria de triglicéridos.'},{id:'b',text:'Evita por completo la necesidad de calibrar.'},{id:'c',text:'Convierte los triglicéridos en tocoferoles.'}],correct:'a',feedback:'La fluorescencia explota una propiedad del analito y reduce la contribución de la matriz no fluorescente o débilmente fluorescente.'},{prompt:'Si compuestos volátiles no se integran y se normalizan solo las áreas restantes al 100 %, ¿qué tipo de error aparece?',options:[{id:'a',text:'Sesgo sistemático en el perfil relativo, porque falta una fracción real de la muestra.'},{id:'b',text:'Solo error aleatorio sin efecto en la media.'},{id:'c',text:'Ningún error, porque toda suma de áreas es siempre 100 %.'}],correct:'a',feedback:'Al omitir sistemáticamente picos, los porcentajes de los demás se inflan de forma sesgada.'}]},
7:{title:'Proteína en pasta por Kjeldahl',subtitle:'Conversión de nitrógeno, destilación de NH₃ y valoración',make(){const mass=.96+Math.random()*.10,blank=.12+Math.random()*.12,sample=13.9+Math.random()*2.0,acid=.100;const nitrogen=(sample-blank)*acid*14.007/(10*mass),protein=nitrogen*5.70;return{rows:[['Masa de pasta',`${mass.toFixed(3)} g`],['HCl estandarizado',`${acid.toFixed(3)} mol L⁻¹`],['Valoración del blanco',`${blank.toFixed(2)} mL`],['Valoración del destilado',`${sample.toFixed(2)} mL`],['Factor de conversión para trigo','5,70']],metrics:[`N total: ${nitrogen.toFixed(2)} %`,`Proteína estimada: ${protein.toFixed(2)} %`],decision:{prompt:'Una vez calculado el porcentaje de N total, ¿qué conversión corresponde a una muestra de pasta de trigo?',options:[{id:'a',text:'Multiplicar por 6,25 en todos los alimentos, porque todas las proteínas contienen exactamente 16 % de N.'},{id:'b',text:'Multiplicar por 5,70, factor empírico específico de trigo que refleja su composición proteica media.'},{id:'c',text:'Dividir por 5,70 para eliminar el nitrógeno no proteico.'}],correct:'b',feedback:'El factor 6,25 es una aproximación general. Para trigo se utiliza el factor empírico 5,70, más adecuado a su composición proteica media.'}};},questions:[{prompt:'¿Qué función diferenciada tienen K₂SO₄ y CuSO₄ durante la digestión Kjeldahl?',options:[{id:'a',text:'K₂SO₄ eleva el punto de ebullición del medio ácido; CuSO₄ cataliza la oxidación de la materia orgánica.'},{id:'b',text:'K₂SO₄ captura NH₃ y CuSO₄ neutraliza HCl en la valoración.'},{id:'c',text:'Ambos solo colorean la disolución y no afectan al proceso.'}],correct:'a',feedback:'La sal potásica permite trabajar a temperatura de digestión elevada, mientras el cobre acelera la conversión del nitrógeno orgánico en amonio.'},{prompt:'¿Por qué el método Kjeldahl puede sobreestimar proteína si la muestra contiene melamina o urea?',options:[{id:'a',text:'Porque mide nitrógeno total, no enlaces peptídicos de forma específica.'},{id:'b',text:'Porque la melamina impide destilar amoníaco.'},{id:'c',text:'Porque la urea no contiene nitrógeno.'}],correct:'a',feedback:'Cualquier compuesto nitrogenado que se convierta en amonio contribuye a la señal; por eso la estimación de proteína es indirecta.'},{prompt:'¿Por qué se recoge el NH₃ destilado en ácido bórico antes de titular?',options:[{id:'a',text:'El ácido bórico captura el amoníaco como borato de amonio y permite valorarlo después con ácido estandarizado.'},{id:'b',text:'El ácido bórico destruye el amoníaco para evitar interferencias.'},{id:'c',text:'Porque el NH₃ solo puede existir disuelto a pH ácido fuerte.'}],correct:'a',feedback:'La disolución receptora retiene cuantitativamente el NH₃; la valoración posterior cuantifica el borato formado de manera indirecta.'}]}
};
function simulationSelector(){return `<div class="sim-tabs" aria-label="Select simulation">${[2,3,4,5,6,7].map(number=>`<button type="button" class="secondary ${currentSimulation===number?'active':''}" data-sim="${number}">P${number}</button>`).join('')}</div>`;}
function makeGenericScenario(number){const module=SIMULATION_MODULES[number],baseQuestion=shuffle(module.questions)[0],data=module.make();return{number,...data,question:{...baseQuestion,options:shuffle(baseQuestion.options)}};}
function renderGenericSimulation(){const module=SIMULATION_MODULES[currentSimulation];if(!genericScenario||genericScenario.number!==currentSimulation)genericScenario=makeGenericScenario(currentSimulation);const scenario=genericScenario,rows=scenario.rows.map(row=>`<tr><td>${esc(row[0])}</td><td>${esc(row[1])}</td></tr>`).join(''),decisionOptions=scenario.decision.options.map(option=>`<label class="sim-choice"><input type="radio" name="simDecision" value="${option.id}"><span>${esc(option.text)}</span></label>`).join(''),questionOptions=scenario.question.options.map(option=>`<label class="sim-choice"><input type="radio" name="simReasoning" value="${option.id}"><span>${esc(option.text)}</span></label>`).join('');document.getElementById('simulation').innerHTML=`<h1 class="section-title">Simulaciones de datos</h1><p class="lead">Casos autocorregibles para practicar decisiones analíticas y razonamiento químico. No se envían datos ni se registran calificaciones.</p>${simulationSelector()}<div class="card"><div class="quiz-head"><div><p class="eyebrow">Práctica ${currentSimulation}</p><h2>${esc(module.title)}</h2><p>${esc(module.subtitle)}</p></div><button class="secondary" id="newGeneric" type="button">Generar nuevo caso</button></div><div class="sim-grid"><div><h3>1. Interpreta los datos</h3><p>${esc(scenario.decision.prompt)}</p>${decisionOptions}<h3 style="margin-top:22px">2. Situación experimental</h3><p>${esc(scenario.question.prompt)}</p>${questionOptions}<button class="primary" id="checkGeneric" type="button">Corregir análisis</button></div><div class="card chart-card"><h3>Datos del caso</h3><table class="sim-table"><tbody>${rows}</tbody></table><p class="small">Los valores cambian en cada caso. La corrección requiere relacionarlos con el fundamento químico y el procedimiento.</p></div></div><div id="genericResult" class="sim-result" aria-live="polite"></div></div>`;bindSimulationSelector();document.getElementById('newGeneric').onclick=()=>{genericScenario=makeGenericScenario(currentSimulation);renderGenericSimulation();};document.getElementById('checkGeneric').onclick=checkGenericSimulation;}
function checkGenericSimulation(){const decision=document.querySelector('input[name="simDecision"]:checked')?.value,reasoning=document.querySelector('input[name="simReasoning"]:checked')?.value;if(!decision||!reasoning){document.getElementById('genericResult').innerHTML='<div class="notice">Completa las dos decisiones antes de corregir.</div>';return;}const decisionOK=decision===genericScenario.decision.correct,reasoningOK=reasoning===genericScenario.question.correct,score=(decisionOK?1:0)+(reasoningOK?1:0);localStorage.setItem(`laia-en-GB-p${currentSimulation}-simulation`,JSON.stringify({date:new Date().toISOString(),score,question:genericScenario.question.prompt}));document.getElementById('genericResult').innerHTML=`<div class="result"><strong>Revisión del análisis · ${score}/2 decisiones correctas</strong><br>${genericScenario.metrics.map(metric=>`<span class="metric">${esc(metric)}</span>`).join('')}<div class="feedback ${decisionOK?'good':'bad'}"><strong>Interpretación:</strong> ${decisionOK?'Decisión correcta. ':'La decisión más adecuada era distinta. '}${esc(genericScenario.decision.feedback)}</div><div class="feedback ${reasoningOK?'good':'bad'}"><strong>Situación experimental:</strong> ${reasoningOK?'Decisión correcta. ':'La respuesta más adecuada era distinta. '}${esc(genericScenario.question.feedback)}</div></div>`;}
function bindSimulationSelector(){document.querySelectorAll('[data-sim]').forEach(button=>button.onclick=()=>{currentSimulation=Number(button.dataset.sim);genericScenario=null;renderSimulation();});}
renderSimulation=function(){if(currentSimulation===3){legacyRenderSimulation();document.getElementById('simulation').insertAdjacentHTML('afterbegin',simulationSelector());bindSimulationSelector();return;}renderGenericSimulation();};
</script>

const __completePracticeTranslations={"1":{"Objectives":"Apply solid–liquid extraction to soil and determine moisture, pH, electrical conductivity and organic matter.","Theoretical background":"Moisture changes the mass reference used for reporting results, so composition data are expressed on a dry-soil basis. Soil pH depends on the suspension medium, while electrical conductivity estimates the soluble ionic load. Organic matter is estimated by wet oxidation of organic carbon with dichromate followed by back-titration with iron(II).","Risks and waste":"Handle acids, dichromate and iron(II) solutions with care and wear the required personal protective equipment. Collect chromium-containing and acidic waste in the labelled containers; do not dispose of it down the sink.","Equipment and reagents":"Use an analytical balance, drying oven, pH meter, conductivity meter, extraction vessels, filtration material and titration glassware. The method requires distilled water, potassium chloride, dichromate, concentrated sulphuric acid and iron(II) ammonium sulphate, together with the specified indicators and buffers.","Methodology":"Dry a representative soil portion to constant mass, prepare the required suspensions or extracts and measure pH and conductivity under controlled ratios. Determine organic matter from the difference between the blank and sample titrations, then correct all mass-based results to dry soil.","Final questions":"Explain why dry-mass correction is necessary, why pH in potassium chloride can differ from pH in water, and how the blank is used in the dichromate titration."},"2":{"Objectives":"Use refractometry to estimate moisture in honey and soluble solids in orange juice, while controlling temperature and interpreting the result correctly.","Theoretical background":"Refraction changes when light passes between media with different propagation speeds. The refractive index depends on composition and temperature; °Brix is an apparent soluble-solids scale and is not automatically the mass fraction of sucrose in a multicomponent juice or honey sample.","Risks and waste":"The samples and glass components present low chemical risk, but hot water baths, broken glass and spills must still be handled safely. Clean the prism immediately after use and dispose of contaminated material according to the laboratory instructions.","Equipment and reagents":"Use a calibrated refractometer, temperature-controlled bath, Pasteur pipettes, beakers, tissues and representative honey and juice samples. Use distilled water for zero adjustment and the certified or laboratory reference materials specified in the method.","Methodology":"Bring the sample and instrument to the reference temperature, clean and zero the prism, place a homogeneous drop on the measuring surface and record the refractive index or °Brix. Repeat the measurement, apply the validated temperature correction and report the result with its appropriate analytical meaning.","Final questions":"Discuss the effect of temperature on refractive index, the meaning of °Brix in orange juice, and why a calibration must use standards and controlled measurement conditions."},"3":{"Objectives":"Determine available phosphorus in soil extracts by forming phosphomolybdenum blue and quantifying the colour with a spectrophotometric calibration.","Theoretical background":"Phosphate is extracted with neutralised Olsen extractant and reacts with molybdate under acidic conditions. Reduction with ascorbic acid produces a blue complex whose absorbance is measured at the validated wavelength. Standards must reproduce the sample matrix and the colour-development time must be controlled.","Risks and waste":"Use eye protection and gloves when handling sulphuric acid, molybdate, antimony and ascorbic-acid reagents. Add acid carefully, allow hot mixtures to cool before neutralisation and collect acidic, phosphate- and metal-containing waste as instructed.","Equipment and reagents":"Use extraction vessels, volumetric flasks, pipettes, a spectrophotometer and clean cuvettes. Prepare neutralised Olsen extractant, phosphate standards, the acidic molybdate reagent and the reducing solution exactly as specified by the method.","Methodology":"Prepare the soil extract and matrix-matched standards, add the reaction reagents in the prescribed order, allow the colour to develop for the validated time and measure the absorbance. Fit the calibration line, check its residuals and dilute samples that fall outside the validated range before calculating phosphorus and P₂O₅ on a soil basis.","Final questions":"Justify matrix matching, the colour-development interval, the selected wavelength and the treatment of a calibration point or sample that lies outside the validated range."},"4":{"Objectives":"Use capillary electrophoresis to separate and determine salicylic acid and acetylsalicylic acid in pharmaceutical samples.","Theoretical background":"In capillary zone electrophoresis, charged species migrate through a narrow capillary under a high electric field. Migration depends on charge, size, buffer composition, pH and electro-osmotic flow. Separation quality is assessed from migration times, peak shape, resolution and detector response.","Risks and waste":"High voltage, alkaline or acidic buffers and pharmaceutical solutions require the prescribed safety precautions. Never open the instrument while the voltage is applied, keep the capillary connections dry and collect sample and buffer waste in the appropriate container.","Equipment and reagents":"Use the capillary electrophoresis instrument, the specified fused-silica capillary, buffer, standards, sample solutions, volumetric equipment and a suitable detector. Filter and degas solutions when required by the operating procedure.","Methodology":"Condition the capillary, prepare standards and samples, select the validated voltage, temperature, injection and detection conditions, and run the sequence. Identify the analytes by migration time, construct the calibration and evaluate repeatability, resolution and possible matrix effects.","Final questions":"Explain how pH and electro-osmotic flow affect migration, how an analyte is identified, and which evidence is needed before accepting a quantitative electropherogram."},"5":{"Objectives":"Determine moisture and fat in cocoa using Karl Fischer water determination and Soxhlet extraction.","Theoretical background":"Karl Fischer titration measures water through a selective chemical reaction. Soxhlet extraction separates the lipid fraction by repeatedly washing the sample with a volatile organic solvent. Results depend on representative sampling, complete extraction and correction to the appropriate mass basis.","Risks and waste":"Karl Fischer reagents and extraction solvents may be corrosive, toxic or flammable. Work in a fume cupboard, avoid ignition sources and collect solvent and cocoa residues in the designated waste containers.","Equipment and reagents":"Use a Karl Fischer titrator, Soxhlet apparatus, extraction thimble, heating mantle, condenser, analytical balance, drying equipment and the specified solvent and titration reagents. Check that all glassware is clean and dry before use.","Methodology":"Homogenise and weigh the cocoa, determine water with the Karl Fischer procedure and extract the lipid fraction under reflux for the required time. Remove solvent, dry or cool the receiving vessel as specified, weigh the residue and calculate moisture and fat percentages with blanks where required.","Final questions":"Compare the chemical basis of Karl Fischer titration with Soxhlet extraction, identify the main sources of mass bias and explain why solvent recovery and complete drying matter."},"6":{"Objectives":"Develop an analytical method for determining iron and manganese in tea leaves by flame atomic absorption spectrometry.","Theoretical background":"In flame atomic absorption, free ground-state atoms absorb element-specific radiation. The signal depends on atomisation, wavelength, flame conditions, matrix composition and concentration. Reliable results require suitable digestion, blanks, calibration, dilution and quality-control samples.","Risks and waste":"Handle concentrated acids, oxidising digestion mixtures and hot vessels behind the appropriate shield or in a fume cupboard. Follow the instrument safety instructions and collect acid and metal-containing waste separately.","Equipment and reagents":"Use a flame atomic absorption spectrometer with iron and manganese lamps, digestion vessels, a heating block, volumetric glassware, certified standards and the acid mixture specified for tea samples.","Methodology":"Homogenise the tea, digest a known mass, cool and dilute quantitatively, then prepare calibration standards and blanks. Optimise the flame and wavelength, measure iron and manganese, verify the calibration with quality-control solutions and report concentrations on the original sample basis.","Final questions":"Explain why digestion, matrix matching, blank correction and dilution are essential, and describe how calibration and quality controls support the reported concentrations."},"7":{"Objectives":"Identify and quantify tocopherols in vegetable oils by reversed-phase liquid chromatography with fluorimetric detection, and characterise fatty acids by gas chromatography.","Theoretical background":"Reversed-phase liquid chromatography separates tocopherols according to their interaction with the stationary phase and mobile phase, while fluorimetric detection provides selective sensitivity. Fatty acids are converted into volatile methyl esters and separated by gas chromatography; the chromatographic profile is interpreted from retention times and response areas.","Risks and waste":"Organic solvents, derivatisation reagents and compressed gases must be handled in a fume cupboard and kept away from ignition sources. Wear eye protection and gloves, check gas connections and collect solvent and derivatisation waste separately.","Equipment and reagents":"Use an HPLC system with a reversed-phase column and fluorimetric detector, a gas chromatograph with a suitable capillary column and flame-ionisation detector, calibrated standards, vegetable-oil samples, solvents and the specified derivatisation reagents.","Methodology":"Prepare and dilute the oil samples, filter them and run the HPLC sequence with standards and quality controls. For the fatty-acid analysis, form methyl esters, inject them under the validated GC programme, identify peaks with standards and calculate composition from corrected response areas.","Final questions":"Explain why standards and retention times are needed for identification, how response factors affect quantification and why derivatisation is required before gas-chromatographic analysis of fatty acids."},"8":{"Objectives":"Determine the protein content of pasta by converting organically bound nitrogen to ammonium and applying the Kjeldahl method.","Theoretical background":"The sample is digested in concentrated sulphuric acid with a catalyst, converting organic nitrogen into ammonium. After alkalisation, ammonia is distilled, collected and quantified by titration or an equivalent validated measurement. A nitrogen-to-protein factor converts the measured nitrogen into an estimated protein content.","Risks and waste":"Concentrated sulphuric acid, catalysts, strong alkali and hot digestion mixtures are hazardous. Use the digestion and distillation systems behind the required protection, work in a fume cupboard and collect acidic, alkaline and catalyst-containing waste separately.","Equipment and reagents":"Use a digestion block, distillation unit, titration glassware, analytical balance, catalyst, sulphuric acid, sodium hydroxide, boric acid and the standardised titrant specified by the method.","Methodology":"Homogenise and weigh the pasta, digest it to a clear solution, alkalise and distil the released ammonia into the receiving solution. Titrate the distillate, run a blank and calculate nitrogen and protein on the original sample basis.","Final questions":"Explain the chemical transformations in digestion, why a blank is required and why the nitrogen-to-protein factor is an assumption rather than a direct measurement of every protein."},"9":{"Objectives":"Develop and evaluate a paper-based device for the selective determination of iron in natural waters using a colour reaction and image analysis.","Theoretical background":"Iron forms a coloured complex with thiocyanate on a patterned paper substrate. Images captured with a smartphone convert colour intensity into an analytical signal. Selectivity, uniform reagent deposition, lighting, image processing and calibration determine the quality of the result.","Risks and waste":"Handle acid, thiocyanate and iron standards with gloves and eye protection. Prevent contact with the colour reagents, label all solutions and collect metal- and thiocyanate-containing waste in the designated container.","Equipment and reagents":"Use patterned paper devices, a cutting or printing template, a smartphone or camera, controlled illumination, image-analysis software, pipettes, iron standards, buffer and thiocyanate reagent.","Methodology":"Prepare the paper devices and calibration standards, apply equal volumes, allow the colour to develop for a fixed time and capture images under controlled conditions. Extract the selected colour channel, construct the calibration and assess repeatability, selectivity and recovery in natural-water samples.","Final questions":"Discuss the sources of variation in paper devices, why image acquisition must be controlled and how calibration and recovery experiments support selectivity claims."},"10":{"Objectives":"Determine creatinine by the kinetic reaction with alkaline picrate and evaluate the result using a time-dependent spectrophotometric measurement.","Theoretical background":"Creatinine reacts with alkaline picrate to form a coloured product. The increase in absorbance depends on reaction time, reagent concentration, temperature and matrix composition, so kinetic measurements must use a defined interval and calibration or comparison procedure.","Risks and waste":"Alkaline picrate and biological samples require gloves, eye protection and appropriate handling. Treat urine and contaminated material as biological waste and collect picrate-containing solutions in the designated chemical-waste container.","Equipment and reagents":"Use a spectrophotometer with temperature control, cuvettes, pipettes, creatinine standards, alkaline picrate reagent, blanks and the urine samples specified by the practical.","Methodology":"Prepare standards, blanks and samples, mix them with alkaline picrate and record absorbance at the prescribed wavelength and times. Use the validated kinetic interval, construct or apply the calibration and report creatinine with the relevant dilution and sample-volume corrections.","Final questions":"Explain why reaction time and temperature must be controlled, how a blank corrects the reagent contribution and why kinetic calibration is preferable to an arbitrary single reading."}};
