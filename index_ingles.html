<script>
const PRACTICES=[{"number": 1, "short": "Suelos", "title": "Determinación de humedad, pH, conductividad y materia orgánica en suelos", "startPage": 3, "endPage": 6, "sections": {"Objetivos": "- Aplicación de la metodología de la extracción sólido-líquido. - Determinación de parámetros físico-químicos del suelo como humedad, pH, conductividad y materia orgánica.", "Fundamento teórico": "El contenido en agua o porcentaje de humedad es un factor importantísimo, ya que el agua es esencial para el crecimiento de las plantas, y actúa como disolvente y agente transportador de numerosas sustancias incluidos nutrientes esenciales y contaminantes. El agua proporciona el medio para que muchas reacciones químicas y actividades biológicas tengan lugar. La determinación del contenido de humedad al aire se realiza gravimétricamente, se mantiene la muestra en estufa a 105 ºC hasta obtener el peso constante. Los resultados se expresan en porcentaje. Se utiliza para expresar los resultados de otras determinaciones en función del peso seco del suelo. La reacción del suelo se caracteriza por medio del pH del sistema suelo -agua. Las propiedades físicas, químicas y biológicas del suelo se ven influenciadas por la acidez o basicidad del medio. El pH influye sobre la movilidad de los diferentes elementos del suelo. En unos casos se disminuirá la solubilidad con lo que las plantas no podrán absorberlos, en otros aumentará debido a la acidez, y se alcanzarán niveles tóxicos para las plantas. El pH se mide normalmente con un pH -metro en una suspensión 1:2.5 de suelo:agua, aunque se pueden emplear otros factores de dilución, es necesario indicar dicho factor en cada caso para poder comparar los resultados. También se puede medir el pH del suelo en una disolución de cloruro potásico, de este modo el catión desplazará los protones adsorbidos en el coloide. La conductividad de un suelo se puede emplear como una medida de la totalidad de iones solubles en lugar de realizar la determinación individual de cada ion. La prueba previa de salinidad permite evaluar si el exceso de sales solubles en el suelo es la causa de los problemas en los cultivos. El aumento de la salinidad y por ello de la presión osmótica del suelo afecta negativamente al crecimiento de las plantas. La conductividad eléctrica (CE) se determina mediante la prueba previa de salinidad en una suspensión 1:5 de suelo:agua, empleando un conductímetro. El carbono del suelo puede hallarse de varias formas: carbono inorgánico (carbonatos, CO 2, etc.), carbono orgánico, restos de animales y plantas más o menos transformados y los productos derivados de ellos, que constituyen el humus, y el carbono elemental ( carbón, grafito, etc. ). Sin embargo, la fracción de carbono oxidable corresponde únicamente a los compuestos orgánicos. Su determinación permite obtener información indirecta de las propiedades físicas del suelo (retención de agua, estructuración y aireación del suelo), interpretar aspectos relacionados con la nutrición de las plantas, conocer la relación C/N del suelo y la actividad microbiana del mismo. La determinación de la materia orgánica del suelo se realiza mediante la oxidación en frío de la misma con dicromato potásico en presencia de ácido sulfúrico; el exceso de oxidante se valora con sulfato ferroso amónico (sal de Mohr) y la cantidad de carbono orgánico oxidado se calcula a partir de la cantidad de dicromato reducido. Se estima que en estas condiciones se oxida sólo el 77% del carbono orgánico, por lo que hay que multiplicar por 1.30 el valor obtenido en la determinación. Cuando en el texto se habla de la cantidad de materia orgánica del suelo, se refiere a la fracción oxidable de carbono orgánico presente en el suelo multiplicada por el factor de Van Bemmelen (1.72) que supone que la materia orgánica del suelo contiene un 58% de carbono orgánico. El contenido de materia orgánica se expresa en porcentaje.", "Riesgos y residuos": "Leer detenidamente las fichas de seguridad de los reactivos utilizados. Los residuos del análisis deben ser recogidos separadamente para su conveniente eliminación.", "Material y reactivos": "Reactivos y disoluciones: H₂SO₄ 95-97%, H3PO4 85%. Disoluciones patrón de pH 4, pH 7 y pH 9. (preparadas) Disolución patrón de conductividad (KCl 0.01 M). (preparada) Disolución patrón de K2Cr2O7 0.1667 M. Disolución patrón de sulfato ferroso amónico 0.5 M (sal de Mohr). Se disuelve 196.10 g de (NH₄)2Fe(SO4)2.6H₂O en 800 mL de agua que contiene 20 mL de H₂SO₄ 95-97 % y se afora a 1 L. (preparada) Disolución indicadora de difenilamina 1% (m/m) en sulfúrico: en un vaso de 250 mL que contiene 20 mL de agua se añaden, lentamente y con precaución, 100 mL de H₂SO₄ 95-97 %. Se deja enfriar. Por otro lado, se pesa 1.0 g de (C6H5)2NH. A continuación, se vierte sobre la difenilamina la disolución de sulfúrico y se agita hasta la completa disolución. (preparada) Instrumentación: estufa, pH-metro, conductímetro. Muestra: muestra de suelo", "Metodología": "5.1. Determinación de la humedad La determinación del contenido de humedad de las muestras se realiza gravimétricamente, basándose en las indicaciones del método 2 de la Orden 17 de septiembre de 1981 (BOE, 1981). 5.2. Determinación del pH Para la determinación del pH y la conductividad se siguen los procedimientos descritos por Porta et al. (1986). 5.3. Determinación de la conductividad La conductividad se mide basándose en las indicaciones de la Guía de conductividad eléctrica del suelo de METER para la determinación mediante extracto de saturación. 5.4. Determinación de la materia orgánica Para su determinación se sigue el procedimiento volumétrico recomendado por Nieto-Velázquez (2015). Consideraciones para el método volumétrico: Dejar enfriar 30 min después de añadir ácido sulfúrico. Dejar enfriar después de añadir ácido fosfórico. Calcular el carbono orgánico oxidable, expresado en porcentaje sobre muestra seca a 105 oC (IMPORTANTE).", "Referencias": "• Porta Canellas, J.; Lopez-Acevedo Reguerin, M. y Rodríguez Ochoa, R. Técnicas y experimentos en Edafología. Col ·legi Official d’Enginyers Agrònoms de Catalunya, 1986. • Conductividad eléctrica del suelo: Guía completa de mediciones. METER Group. https://links.uv.es/KTSBb50 • S. Nieto-Velázquez, K. Carpio-Domínguez, M. E. Páez-Hernández, Determinación de materia orgánica en muestras de suelo, como indicador en el rendimiento de extracción de ácidos húmicos (ahs), TÓPICOS DE INVESTIGACIÓN EN CIENCIAS DE LA TIERRA Y MATERIALES VOL 2 (2015). https://repository.uaeh.edu.mx/revistas/index.php/aactm/article/download/9706/10044/ • Radojevic, M. y Bashkin, V. N. Practical environmental analysis. Royal Society of Chemistry, Londres, 1999. • Marín García, M. L.; Aragón Revuelta, P. y Gómez Benito, C. Análisis químico de suelos y aguas: manual de laboratorio. Universidad Politécnica de Valencia, Departamento de Química, 2002. • ORDEN de 5 de diciembre de 1975 por la que se aprueban como oficiales los métodos de análisis de suelos y aguas. BOE N.º 78 de 31 de marzo de 1976.", "Cuestiones finales": "1. En el análisis de suelos, ¿por qué es metodológicamente incorrecto expresar los contenidos de materia orgánica o de nutrientes directamente sobre la masa de muestra fresca o \"seca al aire\" tal cual s e pesa en el laboratorio? Justifica la necesidad de la determinación previa de la humedad a 105 ºC. 2. Al calcular el porcentaje de materia orgánica total en el suelo mediante el método de oxidación húmeda con dicromato, se utilizan en los cálculos dos factores numéricos fijos: 1.30 y 1.72. Explica detalladamente el significado químico o la deducción empírica de cada uno de estos dos factores. 3. El pH del suelo suele medirse en suspensión acuosa (relación 1:2.5), pero que también puede medirse utilizando una disolución diluida de cloruro potásico (KC l). ¿Qué diferencia esperas encontrar entre ambos valores de pH para una misma muestra de suelo y qué fenómeno de intercambio iónico ocurre en la superficie de los coloides para justificar dicha diferenci a? Si has usado otra metodología, explica las diferencias. 4. Explica la relación analítica y agronómica que existe entre la conductividad eléctrica (CE) medida en el suelo y la presión osmótica en la solución del suelo. ¿Cómo afecta un valor excesivamente elevado de CE al potencial hídrico y a la capacidad de absorción de las raíces de los cultivos? 5. En la determinación de la materia orgánica, tras la oxidación con dicromato potásico y antes de valorar con la sal de Mohr, el procedimiento exige la adición es tricta de 10 mL de ácido fosfórico concentrado. ¿Cuál es la función química y termodinámica del H3PO4? 6. Si al realizar la suspensión de suelo para medir el pH o la conductividad, observas que las partículas coloidales (arcillas) no sedimentan pasados los 30 minutos y quedan suspendidas en el sobrenadante causando inestabilidad en las lecturas de los electrodos, ¿qué operación físico-química de separación debes realizar según el guion para asegurar una medida reproducible? Justifica tu respuesta."}, "postQuestions": ["En el análisis de suelos, ¿por qué es metodológicamente incorrecto expresar los contenidos de materia orgánica o de \nnutrientes directamente sobre la masa de muestra fresca o \"seca al aire\" tal cual s e pesa en el laboratorio? Justifica la \nnecesidad de la determinación previa de la humedad a 105 ºC.", "Al calcular el porcentaje de materia orgánica total en el suelo mediante el método de oxidación húmeda con dicromato, se \nutilizan en los cálculos dos factores numéricos fijos: 1.30 y 1.72. Explica detalladamente el significado químico o la deducción \nempírica de cada uno de estos dos factores.", "El pH del suelo suele medirse en suspensión acuosa (relación 1:2.5), pero que también puede medirse utilizando una \ndisolución diluida de cloruro potásico (KC l). ¿Qué diferencia esperas encontrar entre ambos valores de pH para una misma \nmuestra de suelo y qué fenómeno de intercambio iónico ocurre en la superficie de los coloides para justificar dicha diferenci a? \nSi has usado otra metodología, explica las diferencias.", "Explica la relación analítica y agronómica que existe entre la conductividad eléctrica (CE) medida en el suelo y la presión \nosmótica en la solución del suelo. ¿Cómo afecta un valor excesivamente elevado de CE al potencial hídrico y a la capacidad de \nabsorción de las raíces de los cultivos?", "En la determinación de la materia orgánica, tras la oxidación con dicromato potásico y antes de valorar con la sal de Mohr, \nel procedimiento exige la adición es tricta de 10 mL de ácido fosfórico concentrado. ¿Cuál es la función química y \ntermodinámica del H3PO4?", "Si al realizar la suspensión de suelo para medir el pH o la conductividad, observas que las partículas coloidales (arcillas) no \nsedimentan pasados los 30 minutos y quedan suspendidas en el sobrenadante causando inestabilidad en las lecturas de los \nelectrodos, ¿qué operación físico -química de separación debes realizar según el guion para asegurar una medida \nreproducible? Justifica tu respuesta."], "videos": [{"label": "Determinación de humedad, pH, conductividad y materia orgánica en suelos", "url": "https://www.youtube.com/watch?v=70KzSuKIivE"}], "notice": ""}, {"number": 2, "short": "Refractometría", "title": "Determinación refractométrica del grado de humedad en miel y sólidos solubles en zumo de naranja", "startPage": 7, "endPage": 9, "sections": {"Objetivos": "- Análisis cuantitativo mediante refractometría.", "Fundamento teórico": "El fenómeno de la refracción consiste en el cambio de dirección que experimenta la luz al pasar de un medio a otro debido a un cambio en su velocidad de propagación. El índice de refracción es una magnitud no específica pero útil para valorar la pureza de un compuesto y para el análisis cuantitativo de mezclas binarias. Po r ello, cuando se conoce la composición de una disolución acuosa es útil para la cuantificación del soluto, ya que existe una variación lineal entre el índice de refracción y su concentración. No obstante, para la aplicación de esta técnica al análisis de muestras complejas se suelen utilizar relaciones empíricas que permiten caracterizar alguno de los componentes de la muestra. Así por ejemplo, la determinación de la cantidad de sólidos solubles en un zumo se determina a partir de la medida del índice de r efracción y se expresa en grados Brix. La refractometría se utiliza también para la determinación del grado de humedad en miel haciendo uso de tablas empíricas. La miel es un fluido dulce y viscoso producido por las abejas a partir del néctar de las flores, de secreciones de partes vivas de las plantas o de excreciones de insectos chupadores de plantas. Las abejas transforman estas sustancias gracias al enzima invertasa que contiene su saliva. La miel es utilizada desde los tiempos prehistóricos, tal y como se puede constatar en la escena de recolección de la miel de la cueva de la Araña (Bicorp, Valencia). Desde el punto de vista químico la miel contiene agua (14- 22%), fructosa (28 -44%), glucosa (22- 40%), sacarosa (0,2- 7%), maltosa (2 -16%), otros azúcares ( 0.1-8%) y en menor porcentaje proteínas, aminoácidos, vitaminas, enzimas, hormonas y minerales. La humedad de la miel varía en gran medida con las condiciones ambientales y está relacionada con la calidad y conservación del producto, y también con la flora y clima, y por lo tanto, con la zona geográfica de donde proviene. El contenido en agua influye negativamente en el proceso de conservación ya que favorece el desarrollo de microorganismos. Por ello, el contenido máximo en agua de la miel está establecido en un 20% excepto para la miel de brezo (REAL DECRETO 1049/2003). Por otra parte, la calidad de la naranja para la fabricación de zumos se mide por el porcentaje de zumo que proporciona, los sólidos solubles y el índice de madurez. Los sólidos solubles so n fundamentalmente los azúcares y los ácidos, cuyo contenido varía según la variedad, grado de madurez y técnica de cultivo de las naranjas. La determinación de los sólidos solubles también puede ser llevada a cabo mediante refractometría. En esta experiencia se propone la determinación del grado de humedad mediante refractometría utilizando la relación empírica entre el índice de refracción y el contenido en agua para este tipo de muestras (tabla 1). Asimismo se propone al estudiante que diseñe una experiencia para la determinación de sólidos solubles en zumos.", "Riesgos y residuos": "Los productos utilizados no suponen ningún peligro para la salud ni para el medio ambiente.", "Material y reactivos": "Instrumentación: refractómetro de Abbe provisto de termómetro y sistema de regulación de temperatura y baño termostático. Muestra: miel comercial y zumo de naranja.", "Metodología": "5.1. Determinación del porcentaje de humedad en la muestra Seguir el protocolo descrito por Cano et al. 5.3. Determinación del contenido en sólidos solubles del zumo de naranja A partir de una revisión bibliográfica explica la importancia de la determinación del contenido en sólidos solubles en un zum o de naranja y diseña una experiencia para realizar su determinación mediante refractometría. 1", "Referencias": "• Moisture in honey AOAC método oficial de análisis 969.38 B:2000. • Cano, C. B.; Felsner, M. L.; Matos, J. R.; Bruns, R. E.; Whatanabe, H. M. y Almeida -Muradian, L. B., “Comparison of Methods for determining moisture content of citrus and aucalyptus Brazilian honeys by refractometry ”, Journal of Food Composition and Analysis, 14 (2001) 101-109. • REAL DECRETO 1049/2003, de 1 de agosto, por el que se aprueba la Norma de calidad relativa a la miel. BOE núm. 186 del 5 agosto 2003.", "Cuestiones finales": "1. A qué temperatura debe estar conectado el baño termostático para la medida de la humedad. Si por un fallo del equipo realizas la lectura de una miel a una temperatura mayor sin corregirla matemáticamente, ¿el valor de humedad que obtendrás mediante las tablas empíricas será mayor o menor que el real? Razona tu respuesta basándote en el efecto de la temperatura sobre la densidad del medio y la velocidad de la luz. 1 Recordad que en el caso de que las medidas no se realicen a 20°C es necesario realizar una corrección con la temperatura. 2. Define conceptualmente qué representa un \"Grado Brix\" en una disolución ideal de sacarosa. Cuando aplicamos esta escala a una matriz real y compleja como el zumo de naranja, ¿por qué se habla de \"sólidos solubles totales\" en lugar de azúcares puros? Nombra al menos un componente no azucarado del zumo que contribuya de forma significativa al índice de refracción medido. 3. Tanto en el suelo como en la miel, el control del agua es un parámetro de calidad crítico, pero por razones biológicas opuestas. Explica por qué un exceso de humedad en el suelo es vital para la movilidad de nutrientes, mientras que en la miel comercial el contenido de agua debe mantenerse estrictamente por debajo del 20%. ¿Qué proceso microbiológico se intenta prevenir en la miel? 4. En la sección que has diseñado para el zumo de naranja, basándote en la linealidad entre el índice de refracción y la concentración de solutos: ¿Cómo prepararías la recta de calibrado instrumental si quisieras cuantificar el contenido de azúcar en un refresco comercial utilizando el refractómetro de Abbe? Indica el patrón de referencia elegido y las variables que situarías en los ejes de ordenadas y abscisas."}, "postQuestions": ["A qué temperatura debe estar conectado el baño termostático para la medida de la humedad. Si por un fallo del equipo \nrealizas la lectura de una miel a una temperatura mayor sin corregirla matemáticamente, ¿el valor de humedad que obtendrás \nmediante las tablas empíricas será mayor o menor que el real? Razona tu respuesta basándote en el efect o de la temperatura \nsobre la densidad del medio y la velocidad de la luz. \n\n1 Recordad que en el caso de que las medidas no se realicen a 20°C es necesario realizar una corrección con la temperatura.", "Define conceptualmente qué representa un \"Grado Brix\" en una disolución ideal de sacarosa. Cuando aplicamos esta escala \na una matriz real y compleja como el zumo de naranja, ¿por qué se habla de \"sólidos solubles totales\" en lugar de azúcares \npuros? Nombra al menos un componente no azucarado del zumo que contribuya de forma significativa al índice de refracción \nmedido.", "Tanto en el suelo como en la miel, el control del agua es un parámetro de calidad crítico, pero por razones biológicas \nopuestas. Explica por qué un exceso de humedad en el suelo es vital para la movilidad de nutrientes , mientras que en la miel \ncomercial el contenido de agua debe mantenerse estrictamente por deba jo del 20%. ¿Qué proceso microbiológico se intenta \nprevenir en la miel?", "En la sección que has diseñado para el zumo de naranja, basándote en la linealidad entre el índice de refracción y la \nconcentración de solutos: ¿Cómo prepararías la recta de calibrado instrumental si quisieras cuantificar el contenido de azúcar \nen un refresco comercial utilizando el refractómetro de Abbe? Indica el patrón de referencia elegido y las variables que \nsituarías en los ejes de ordenadas y abscisas."], "videos": [{"label": "Determinación refractométrica del grado de humedad en miel", "url": "https://www.youtube.com/watch?v=SZWe1EoAXCU"}], "notice": ""}, {"number": 3, "short": "Fósforo", "title": "Determinación de fósforo en suelos por formación de azul de fosfomolibdeno", "startPage": 10, "endPage": 14, "sections": {"Objetivos": "- Determinación de fósforo en suelos.", "Fundamento teórico": "El fósforo es uno de los elementos esenciales para la vida, y está implicado en un ciclo nutricional muy importante que supone el tránsito del elemento por una serie de estados inorgánicos, y orgánicos que lo van transformando a través de mecanismos en gran parte mediados por microorganismos. El fósforo, factor limitante para el crecimiento del fitoplancton al igual que el nitrógeno y carbono, a diferencia de estos no puede ser fijado desde la atmósfera, por lo cual, inexcusablemente, su provisión en agua se agota si no se renueva. Por otro lado, cuando el aporte del elemento a un lago o embalse es elevado se produce un incremento muy notable de la producción fitoplanctónica del mismo con los consiguientes problemas de agotamiento de oxígeno y exceso de materia orgánica en el agua, que da lugar a los conocidos fenómenos de \"eutrofización\". El fosfato se fija fuertemente a todos los suelos excepto a los muy arenosos, por lo que su movilidad es muy pequeña y los niveles naturales de fosfatos en las aguas suelen ser muy bajos. El anión no presenta un riesgo importante para la salud, siendo la concentración máxima admisible de 5 mg L -1. No obstante a veces llega a los cursos de agua por el aporte de fertilizantes, y los fosfatos sódicos usados en el tratamiento de aguas, que precipitan el calcio como fosfato cálcico cristalino, evitando la formación de costras en el interior de calderas e instalaciones industriales. En el control de la fertilidad de los suelos, el contenido de nutrientes disponible incluye los iones realmente en disolución y una proporción de los retenidos por la arcilla y los coloides orgánicos. Se han realizado, pero con poco éxito, muchos ensayos para desarrollar métodos simples que simulen la acción de absorción por las raíces de las plantas. Para la medida de los nutrientes disponibles del suelo se han empleado principalmente técnicas de extracción química. En estos métodos los iones (generalmente cationes) son desplazados desde los lugares de adsorción por otros iones desplazantes aplicados en gran exceso. Los iones desplazados son entonces estimados cuantitativamente. El fosfato reacciona con el molibdato en medio ácido para producir un heteropoliácido de color amarillo pálido, el ácido fosfomolíbdico ([NH₄]3[PO4·12MoO3]·12H₂O). Este compuesto reacciona con un reductor adecuado para producir un intenso color azul conocido como azul de fosfomolibdeno. Los reductores que pueden utilizarse son hidrazina, cloruro estannoso y ácido ascórbico. El procedimiento tiene una excelente sensibilidad, la cual puede aumentarse si se extrae el compuesto a una fase orgánica. La absorbancia del azul de fosfomolibdeno depende del disolvente empleado (agua, butanol, otros disolventes orgánicos oxigenados), del reductor y de la acidez de la fase acuosa. La determinación espectrofotométrica de fosfato en extractos de suelos se basa en la reacción con molibdato amónico en medio ácido, para formar fosfomolibdato amónico de color amarillo, seguido de la reducción a l a forma azul con ácido ascórbico, midiendo la absorbancia del azul de fosfomolibdeno a 880 nm.", "Riesgos y residuos": "Leer detenidamente las fichas de seguridad de los reactivos utilizados. Los residuos del análisis deben ser recogidos separadamente para su conveniente eliminación.", "Material y reactivos": "4.2.1. Disolución extractante de Olsen. Disolución 0.5 M de NaHCO 3 ajustada a pH = 8.5. (preparada) 4.2.2. Disolución de H₂SO₄ 2.5 M. (preparada) 4.2.3. Disolución de tartrato de antimonio y potasio 0.27%. (preparada) 4.2.4. Disolución molibdato amónico 4%. (preparada) 4.2.5. Disolución de ácido ascórbico 1.76%. (preparada) 4.2.6. Mezcla de reacción (100 mL). Mezclar después de la adición de cada reactivo y dejar enfriar a temperatura ambiente antes de la adición del próximo reactivo. Si la disolución final está turbia, agitar y esperar unos minutos hasta que la disolución se clarifique (se torne clara). Este reactivo es estable solo 4 horas, por lo tanto, prepararlo cuando se vaya a utilizar. Mezclar, en un vaso de precipitados de 250 mL, 50 mL de H₂SO₄ 2.5 M, 5 mL de tartrato de antimonio y potasio, 15 mL de molibdato amónico y 30 mL de ácido ascórbico (emplear probetas o dosificadores). 4.2.7. Disolución patrón de fósforo de 100 mg L-1. Patrón secado previamente en la estufa a 105°C. (preparada) 4.2.8. Disolución patrón de fósforo de 10 mg L-1. 4.2.9. Disolución de rojo de metilo. (preparada)", "Metodología": "4.3.1. Tratamiento de la muestra Tomar 3 tubos de centrífuga de 50 mL, perfectamente limpios, y rotular. Pesar alrededor de 1.0 g de muestra de suelo, añadir 20 mL de disolución extractante de Olsen. Tapar los tubos y agitar en el agitador mecánico durante 30 min. Centrifugar a 3500 rpm durante 5 min. PRECAUCIÓN: equilibrar la centrífuga, que todos los tubos tengan el mismo nivel y estén en posiciones opuestas, utilizar para ello un tubo con agua si es necesario. Transferir el sobrenadante a un frasco, perfectamente limpio y rotulado con el número de muestra. Filtrar la solución si es necesario. 4.3.2. Preparación de la recta de calibrado Tomar un vaso de precipitados de 100 mL perfectamente limpio (rotular extractante neutralizado). Añadir 60 mL de disolución de extractante de Olsen (probeta) y dos gotas de rojo de metilo indicador. Neutralizar (viraje del amarillo al rojo del indicador) añadiendo gota agota H₂SO₄ 2.5 M, con precaución debido a la efervescencia producida por el HCO 3-. Agitar enérgicamente para favorecer la eliminación del ácido carbónico. Preparar un calibrado entre 0 y 1 mg L –1. Para ello se han de añadir en el siguiente orden: 10 mL (pipeta aforada) de la disolución de extractante neutralizado y el volume adecuado de disolución patrón de fósforo. Seguidamente, se diluye hasta mitad de volumen con agua y se adicionan 8 mL de la disolución mezcla de reacción. Enrasar con agua destilada y homogeneizar. Dejar desarrollar el color durante 10 min. El complejo es estable durante 30 minutos. 4.3.3. Preparación de la disolución de medida de la muestra Añadir 10 mL de extracto de muestra y una gota de rojo de metilo indicador, respectivamente. Neutralizar (viraje del amarillo al rojo del indicador) añadiendo gota agota H₂SO₄ 2.5 M, con precaución debido a la efervescencia del HCO 3- que podría producir pérdidas de muestra. Diluir con agua destilada hasta mitad de volumen, adicionar 8 mL de la disolución mezcla de reacción, enrasar con agua y homogeneizar. Dejar desarrollar el color durante 10 min. El complejo es estable durante 30 minutos. 4.3.4. Medida de la absorbancia de patrones y muestras Medir la absorbancia de las disoluciones a 880 nm, empleando el patrón de concentración 0 como blanco de patrones (disolución de referencia). Enjuagar las cubetas antes de medir la disolución siguiente. 4.3.5. Expresión del resultado Expresar el resultado en mg kg-1 de P y también como P2O5, valor medio y desviación estándar.", "Referencias": "• Porta Canellas, J.; Lopez- Acevedo Reguerin, M. y Rodriguez Ochoa, R. Técnicas y experimentos en Edafología. Col·legi Oficial d’Enginyers Agrònoms de Catalunya, 1986. • Radojevic, M. y Bashkin, V. N. Practical environmental analysis. Royal Society of Chemistry, Londres, 1999. • Marín García, M. L.; Aragón Revuelta, P. y Gómez Benito, C. Análisis químico de suelos y aguas: manual de laboratorio. Universidad Politécnica de Valencia, Departamento de Química, 2002. • ORDEN de 5 de diciembre de 1975 por la que se aprueban como oficiales los métodos de análisis de suelos y aguas. BOE N.º 78 de 31 de marzo de 1976.", "Cuestiones finales": "1. La extracción del fósforo asimilable se realiza estrictamente c on una disolución 0.5 M de NaHCO 3 ajustada a pH = 8.5. Explica, desde el punto de vista del equilibrio químico y del producto de solubilidad (K ps), por qué este valor de pH alcalino consigue aumentar la concentración de fósforo soluble en la fase extractora tanto en suelos calizos (ricos en fosfatos de calcio) como en suelos ácidos (ricos en fosfatos de hierro y aluminio). 2. En la preparación de la mezcla de reacción, se exige añadir de forma secuencial y dejar enfriar a temperatura ambiente la disolución tras incorporar el H₂SO₄ 2.5 M, antes de añadir el tartrato de antimonio y potasio, el molibdato amónico y el ácido ascórbico. ¿Qué consecuencias químicas o analíticas (en la estabilidad del reactivo o en la formación del heteropoliácido) tendría añadir el ácido ascórbico mientras la disolución sigue caliente debido al calor de dilución del sulfúrico? Razona tu respuesta basándote en las propiedades del reductor. 3. Durante la fase de preparación de los patrones y de las muestras, se realiza una ne utralización gota agota con H₂SO₄ 2.5 M usando rojo de metilo, indicándose explícitamente que se debe \"agitar enérgicamente para favorecer la eliminación del ácido carbónico\". Si un alumno no agita lo suficiente y queda CO 2 disuelto en el matraz aforado en el momento de enrasar con agua: ¿Cómo afectará este gas atrapado a la reproducibilidad de la medida de absorbancia a 880 nm? 4. Para preparar la recta de calibrado, en lugar de diluir el patrón de fósforo simplemente en agua destilada, el procedimiento exige añadir obligatoriamente 10 mL de la disolución de \"extractante Olsen neutralizado\" a cada matraz de los patrones. Explica el fundamento analítico de esta operación, y razona qué tipo de error (sistemático, aleatorio o ambos) se cometería en la cuantificación de las muestras si los patrones se prepararan únicamente con agua y el patrón de fósforo. 5. El azul de fosfomolibdeno presenta una banda de absorción muy ancha con un máximo a 880 nm. Sabiendo que los extractos de suelo suelen arrastrar restos d e materia orgánica soluble (como ácidos fúlvicos y húmicos) que aportan una coloración inherentemente amarillenta o parda a la disolución, justifica las ventajas selectivas de medir a una longitud de onda tan elevada (880 nm) en lugar de medir el complejo precursor amarillo (ácido fosfolmolíbdico sin reducir) en la región UV o azul del espectro visible. Otra cuestión importante es ¿por qué se expresa en ocasiones el fosfato como P 2O5?"}, "postQuestions": ["La extracción del fósforo asimilable se realiza estrictamente c on una disolución 0.5 M de NaHCO\n3 ajustada a pH = 8.5. \nExplica, desde el punto de vista del equilibrio químico y del producto de solubilidad (K ps), por qué este valor de pH alcalino \nconsigue aumentar la concentración de fósforo soluble en la fase extractora tanto en suelos calizos (ricos en fosfatos de calcio) \ncomo en suelos ácidos (ricos en fosfatos de hierro y aluminio).", "En la preparación de la mezcla de reacción, se exige añadir de forma secuencial y dejar enfriar a temperatura ambiente la \ndisolución tras incorporar el H 2SO4 2.5 M, antes de añadir el tartrato de antimonio y potasio, el molibdato amónico y el ácido \nascórbico. ¿Qué consecuencias químicas o analíticas (en la estabilidad del reactivo o en la formación del heteropoliácido) \ntendría añadir el ácido ascórbico mientras la disolución sigue caliente debido al calor de dilución del sulfúrico? Razona tu \nrespuesta basándote en las propiedades del reductor.", "Durante la fase de preparación de los patrones y de las muestras, se realiza una ne utralización gota a gota con H 2SO4 2.5 M \nusando rojo de metilo, indicándose explícitamente que se debe \"agitar enérgicamente para favorecer la eliminación del ácido \ncarbónico\". Si un alumno no agita lo suficiente y queda CO 2 disuelto en el matraz aforado en el momento de enrasar con agua: \n¿Cómo afectará este gas atrapado a la reproducibilidad de la medida de absorbancia a 880 nm?", "Para preparar la recta de calibrado, en lugar de diluir el patrón de fósforo simplemente en agua destilada, el procedimiento \nexige añadir obligatoriamente 10 mL de la disolución de \"extractante Olsen neutralizado\" a cada matraz de los patrones. \nExplica el fundamento analítico de esta operación, y razona qué tipo de error (sistemático, aleatorio o ambos) se cometería en \nla cuantificación de las muestras si los patrones se prepararan únicamente con agua y el patrón de fósforo.", "El azul de fosfomolibdeno presenta una banda de absorción muy ancha con un máximo a 880 nm. Sabiendo que los \nextractos de suelo suelen arrastrar restos d e materia orgánica soluble (como ácidos fúlvicos y húmicos) que aportan una \ncoloración inherentemente amarillenta o parda a la disolución, justifica las ventajas selectivas de medir a una longitud de \nonda tan elevada (880 nm) en lugar de medir el complejo precursor amarillo (ácido fosfolmolíbdico sin reducir) en la región UV \no azul del espectro visible. Otra cuestión importante es ¿por qué se expresa en ocasiones el fosfato como P 2O5?"], "videos": [{"label": "Determinación de fósforo en suelo por formación de azul de fosfomolibdeno", "url": "https://www.youtube.com/watch?v=1fT6gK5gW4w"}], "notice": ""}, {"number": 4, "short": "Electroforesis capilar", "title": "Determinación de ácido salicílico y acetil salicílico mediante electroforesis capilar", "startPage": 15, "endPage": 19, "sections": {"Objetivos": "- Conocer la técnica de electroforesis capilar (CE) en modo de electroforesis capilar zonal. - Aplicar la electroforesis capilar a la determinación de ácido salicílico y acetilsalicílico en muestras farmacéuticas.", "Fundamento teórico": "Los orígenes de la aspirina pueden situarse a principios del siglo XIX, tras la identificación del ácido salicílico como responsable de la acción antipirética de los extractos de la corteza del sauce blanco, normalmente empleados con esta finalidad. Pero los efectos secundarios que provocaba la ingesta de ácido salicílico llevaron al químico alemán Hoffmann a sintetizar un deriva do que, sin perder su acción analgésica y antipirética, no provocase estos efecto s secundarios. De esta forma, y mediante la acetilación del ácido salicílico, se sintetizó el ácido acetilsalicílico (ASA) comercializado por Bayer con el nombre de aspi rina. Desde aquel momento, la aspirina ha sido ampliamente utilizada en todo el mundo c omo analgésico, antipirético y, más recientemente, como antiinflamatorio. A nivel industrial, la producción de aspirina y, en concreto, de su principio activo, se basa en la reacción de acetilación d el ácido salicílico utilizando anhídrido acético: Después de la síntesis se eliminan las impurezas y el exceso de ácido salicílico, operación que puede ser llevada a cabo mediante recristalización. Finalmente, mediante la acción de los agentes de enlace y diluyentes, se obtiene la aspirina en sus diferentes formas comerciales. Para la determinación del contenido de ASA en aspirina se pueden utilizar distintas técnicas analíticas. En esta práctica, se propone la utilización de la electroforesis capi lar (CE) que permite, además, detectar la presencia del ácido salicílico en la muestra analizada. La electroforesis capilar (CE) es una técnica de separación basada en la migración de especies cargadas a través de un capilar estrecho bajo la acción de un campo eléctrico. Cada ion se desplaza a una velocidad determinada por su movilidad electroforética, que depende de su carga, tamaño y del pH del medio. Además, la presencia de un flujo electroosmótico (EOF, por sus siglas en inglés ) en el interior del capilar permite que todas las especies, tanto aniones como cationes, sean transportadas hacia el detector, lo que proporciona una alta versatilidad. Entre las principales ventajas de la CE destacan su gran poder de resolución, el bajo consumo de muestra y reactivos, la posibilidad de trabajar con muestras complejas sin necesidad de una preparación extensa y su carácter rápido y respetuoso con el medio ambiente. Estas características la convierten en una herramienta ideal para el análisis rutina rio de aniones inorgánicos y orgánicos en matrices reales como aguas, bebidas o productos alimentarios.", "Riesgos y residuos": "Leer detenidamente las fichas de seguridad de los reactivos utilizados. Los residuos del análisis deben ser recogidos separadamente para su conveniente eliminación.", "Material y reactivos": "Reactivos y disoluciones: Reactivos y disoluciones: ácido acetilsalicílico, ácido salicílico, NaOH, tetraborato sódico decahidrato (bórax), dodecilsulfat sódico (SDS). Material: equipo de filtración para disolventes, filtros de nylon de 0.45 µm de diámetro de poro. Equipo: equipo de electroforesis capilar con detector UV y capilar de sílice fundida de 45 cm de longitud hasta el detector y 50 µm de diámetro interno. Muestra: Aspirina comercial", "Metodología": "5.1. Activación del capilar Antes de iniciar el trabajo analítico, el capilar de sílice fundida debe activarse y acondicionarse para asegurar una superficie limpia, homogénea y reproducible. El procedimiento consiste en realizar un enjuague secuencial a 60 º C con las siguientes disoluciones: primero con NaOH 1 M durante 10 minutos, seguido de un enjuague con NaOH 0.1 M durante 10 min y seguido de agua ultrapura durante 10 minutos para eliminar restos de álcali, y finalmente con el electrolito de trabajo (BGE) a temperatura ambiente durante 15 minutos para equilibrar el sistema. 5.2. Preparación de las disoluciones de calibración y disoluciones de muestra En primera instancia se prepara una disolución patrón de 200 mg L -1 de ácido acetilsalicílico, pesando la cantidad correspondiente y disolviéndola en unos 50 mL de agua destilada en un vaso de precipitados de 100 mL. Una vez disuelta, se trasvasa a un matraz aforado de 100 mL y se enrasa con agua destilada. De forma análoga se prepara una disolución de 100 mg L -1 de ácido salicílico. A partir de estas dos disoluciones, se preparan en matraces aforados de 25 mL una serie de disoluciones de calibración multicomponente ( n = 5) con ASA en concentraciones entre 10 y 40 mg L -1 y ácido salicílico en concentraciones entre 5 y 20 mg L -1. Seguidamente, alícuotas de cada una de estas disoluciones se filtran utilizando filtros de nylon de 0.45 μm de diámetro de poro y se introducen en los viales de inyección del equipo de electroforesi s. Para la determinación de ASA en una muestra comercial, se pesa el comprimido y se anota su masa. Después de triturar en un mortero de vidrio y homogeneizar el polvo, se pesan por triplicado cantidades del orden de 0.1 g y se trasvasan a vasos de precipitados de 100 mL. Se adicionan unos 5 0 mL de agua destilada y se agita hasta la disolución del ASA. Se pueden aplicar ultrasonidos unos minutos para asegurarnos de la disolución total del ASA. En el caso que la muestra no se pueda di solver completamente (si están presentes excipientes no solubles ), se habrá de filtra r la disolución a través de papel de filtro antes de trasvasarla a un matraz aforado de 100 mL y completar hasta el volumen con agua destilada. Para finalizar, teniendo en cuenta el contenido esperado (consultar la información disponible en el empaquetado de la muestra), se preparan las disoluciones de muestra mediante la dilución apropiada. 5.3. Análisis de los patrones y de las muestras Para llevar a cabo la determinación se utilizarán las siguientes condiciones instrumentales: Temperatura de la separación: 25 ºC. Inyección de la muestra: inyección hidrodinámica a 50 mbar durante 10 s. Voltaje: 25 kV. Detección: 200 nm, referencia 350 nm y 220 nm, referencia 350 nm. El capilar, una vez acondicionado, se lava con la disolución tampón constituida por una disolución 2 mM de tetraborato de sodio y 4 mM de SDS a pH 9.0 unos 10 min. Una vez cargado el carrusel con los viales con las disoluciones patrones y las muestras, se lanza el método, que consiste en un análisis de 6 min. Entre inyecciones se realiza un l avado con disolución tampón durante 1 min. Los electroferogramas obtenidos se graban para su posterior tratamiento.", "Referencias": "• “Principios de Análisis Instrumental”, D. A. Skoog, F.J. Holler, S.R. Crouch. Ed. Paraninfo, 6ª ed., 2009. • “Using Capillary Electrophoresis to determine the purity of Acetylsalicilic acid synthesized in the undergraduated laboratory” Welder F. y Colyer C.L. Journal of Chemical Education 78 (2001) 1525. • “Laboratorio de análisis instrumental” A. Mauri, M. Llobat, R. Herraez, Publicacions de la Universitat de Valencia, 2010.", "Cuestiones finales": "1. El tampón de separación utiliza tetraborato de sodio 2 mM y dodecilsulfato sódico (SDS) 4 mM a pH 9.0. Sabiendo que la concentración micelar crítica (CMC) del SDS en agua pura es de aproximadamente 8 mM (pero disminuye ligeramente en presencia de sales), razona si la separación de los dos ácidos se está produciendo puramente por su movilidad electroforética nativa (CEZ) o si el SDS está actuando como una \"fase pseudoestacionaria\" (MEKC). ¿Qué consecuencias tendría en la resolución si aumentáramos la concentración de SDS a 50 mM? 2. Durante el análisis de la aspirina comercial, el equipo detecta un pico minoritario de ácido salicílico. Desde el punto de vista de la reactividad orgánica y las condiciones de almacenamiento del medicamento, explica los dos motivos por los cuales puede aparecer este pico: a) Como un subproducto de una síntesis industrial incompleta o deficiente. b) Como resultado de una reacción de degradación posterior del principio activo (ASA). Indica qué tipo de reacción química sufre el ASA debido a la humedad ambiental y qué otro producto químico (no detectable por UV a 200 nm) se genera en dicho proceso. 3. A pH 9.0, tanto el ácido acetilsalicílico (pK a 3.5) como el ácido salicílico ( pKa 3.0) se encuentran prácticamente ionizados al 100% en forma de aniones. Sabiendo que el flujo electroosmótico (EOF) se dirige con fuerza hacia el cátodo (polo negativo) y que el voltaje aplicado es positivo (+25 kV en la inyección), predice razonadamente el orden de elución de ambos analitos en el detector basándote en la relación carga/tamaño de sus estructuras moleculares. ¿Cuál migrará más rápido y por qué? 4. En el procedimiento se indica que, tras disolver el comprimido triturado en agua, es muy probable que quede un residuo sólido insoluble que obliga a filtrar la disolución ant es de enrasar el matraz de 100 mL. Si este residuo insoluble corresponde a excipientes como el almidón o la celulosa microcristalina, explica qué problemas físicos o instrumentales causarías en el equipo de electroforesis si decidieras inyectar la muestra directamente sin filtrar. ¿Cómo afectaría a la reproducibilidad de los tiempos de migración? 5. Las condiciones instrumentales especifican una longitud de onda de detección de 200 y/o 220 nm y una longitud de onda de referencia de 350 nm. Justifica la selección de estas longitudes de onda: a) ¿Cuál es la función matemática y óptica de restar la señal medida a 350 nm?"}, "postQuestions": ["El tampón de separación utiliza tetraborato de sodio 2 mM y dodecilsulfato sódico (SDS) 4 mM a pH 9.0. Sabiendo \nque la concentración micelar crítica (CMC) del SDS en agua pura es de aproximadamente 8 mM (pero disminuye \nligeramente en presencia de sales), razona si la separación de los dos ácidos se está produciendo puramente por su \nmovilidad electroforética nativa (CEZ) o si el SDS está actuando como una \"fase pseudoestacionaria\" (MEKC). ¿Qué \nconsecuencias tendría en la resolución si aumentáramos la concentración de SDS a 50 mM?", "Durante el análisis de la aspirina comercial, el equipo detecta un pico minoritario de ácido salicílico. Desde el punto \nde vista de la reactividad orgánica y las condiciones de almacenamiento del medicamento, explica los dos motivos \npor los cuales puede aparecer este pico: \na) Como un subproducto de una síntesis industrial incompleta o deficiente. \nb) Como resultado de una reacción de degradación posterior del principio activo (ASA). Indica qué tipo de reacción \nquímica sufre el ASA debido a la humedad ambiental y qué otro producto químico (no detectable por UV a 200 nm) \nse genera en dicho proceso.", "A pH 9.0, tanto el ácido acetilsalicílico (pK a 3.5) como el ácido salicílico ( pKa 3.0) se encuentran prácticamente \nionizados al 100% en forma de aniones. Sabi endo que el flujo electroosmótico (EOF) se dirige con fuerza hacia el \ncátodo (polo negativo) y que el voltaje aplicado es positivo (+25 kV en la inyección), predice razonadamente el orden \nde elución de ambos analitos en el detector basándote en la relación carga/tamaño de sus estructuras moleculares. \n¿Cuál migrará más rápido y por qué?", "En el procedimiento se indica que, tras disolver el comprimido triturado en agua, es muy probable que quede un \nresiduo sólido insoluble que obliga a filtrar la disolución ant es de enrasar el matraz de 100 mL. Si este residuo \ninsoluble corresponde a excipientes como el almidón o la celulosa microcristalina, explica qué problemas físicos o \ninstrumentales causarías en el equipo de electroforesis si decidieras inyectar la muestra directamente sin filtrar. \n¿Cómo afectaría a la reproducibilidad de los tiempos de migración?", "Las condiciones instrumentales especifican una longitud de onda de detección de 200 y/o 220 nm y una longitud de \nonda de referencia de 350 nm. Justifica la selección de estas longitudes de onda: \na) ¿Cuál es la función matemática y óptica de restar la señal medida a 350 nm?"], "videos": [], "notice": "Nota sobre el documento fuente: el título menciona aniones en vino, pero los objetivos, materiales y procedimiento describen la determinación de ácido acetilsalicílico y ácido salicílico en aspirina mediante electroforesis capilar. Este material conserva el título oficial y presenta el procedimiento realmente incluido en el guion."}, {"number": 5, "short": "Cacao", "title": "Determinación de humedad y materia grasa en cacao", "startPage": 20, "endPage": 23, "sections": {"Objetivos": "- Determinación de humedad por el método de Karl Fischer - Determinación de materia grasa mediante extracción con Soxhlet", "Fundamento teórico": "Theobroma cacao L. es el nombre científico que recibe el árbol del cacao o cacaotero, planta de hoja perenne de la familia Malvaceae. Theobroma significa en griego «alimento de los dioses»; cacao deriva del nahua «cacáhua». Los granos de cacao son utilizados para la obtención de manteca de cacao, cacao en polvo, chocolate… Por lo que, al igual que cualquier materia prima está sujeta a un control de calidad. La calidad de los granos de cacao está determinada tanto por características físicas como por características químicas tales como el tamaño de grano, el porcentaje de cascarilla, el pH, la humedad, el contenido en grasa o su sabor. La determinación del contenido en materia grasa requiere la separación de la grasa de los hidratos de carbono y proteínas y la posterior extracción de la grasa con un disolvente orgánico. La extracción Soxhlet es un caso particular de lixiviación de compuestos orgánicos, en la que un disolvente orgánico en fase vapor recircula continuamente a través de una carcasa porosa que contiene la muestra, empleando un sistema de reflujo cerrado que además evita pérdidas de analito. La elevada temperatura acelera la cinética de extracción. La determinación de agua puede llevarse a cabo mediante destilación, secado, volatilización o volumétricamente. La determinación volumétrica o método de Karl-Fischer fue propuesto en 1935. Este mé todo puede ser aplicado a cualquier alimento y es recomendable en el caso de alimentos que contienen un bajo contenido en agua. El método se basa en la reacción entre el I₂ y el SO2 que consume una cantidad estequiométrica de agua. La reacción se realiza en presencia de una base orgánica (RN) como la dietanolamina y metanol: RN + SO2 + CH3OH  [RNH]SO3CH3 [RNH]SO3CH3 + I2 + H₂O + 2RN  [RNH]SO4CH3 + 2 [RNH]I Tradicionalmente se utilizaban dos disoluciones de reactivo ( una que contiene metanol y I₂ y otra que contiene metanol, la base orgánica y SO₂) para asegurar su estabilidad, pero actualmente se comercializa una disolución única conteniendo metanol, I₂, la base orgánica, SO₂ y dietilenglicol monoetil éter, lo que permite una mayor versatilidad para seleccionar el medio más apropiado para la disolución de la muestra, aunque evidentemente, el reactivo resulta más inestable. El punto final de la reacción puede detec tarse amperométricamente, potenciométricamente o colorimétricamente, entre las cuales lo más habitual es la detección amperométrica.", "Riesgos y residuos": "Leer detenidamente las fichas de seguridad de los reactivos utilizados. Los residuos deben ser recogidos separadamente para su conveniente eliminación", "Material y reactivos": "Reactivos: éter de petróleo, HCl 8 M, reactivo Karl Fischer, metanol anhidro (preparadas) Instrumentación: sistema de extracción Soxhlet y valorador Karl Fischer Muestra: granos de cacao", "Metodología": "5.1. Determinación del contenido en grasa 5.1.1. Preparación de la muestra La determinación debe realizarse al menos por duplicado. Pesar con exactitud alrededor de 2 g de cacao triturado e introducirlo en un vaso de precipitados de 250 mL. Añadir lentamente, mientras se agita, 45 mL de agua hervida para obtener una suspensión homogénea. A continuación, añadir 55 mL de HCl 8 M y agitar. Cubrir con vidrio de reloj, llevar lentamente a ebullición y hervir suavemente 15 min. Enjuagar el vidrio de reloj con agua destilada y filtrar utilizando papel de filtración media. Lavar el vaso de precipitados al menos tres 3 veces con agua y continuar el lavado hasta que el filtrado se encuentre exento de ácido clorhídrico (hasta reacción neutra o ensayo negativo de cloruros). Transferir con cuidado el papel de filtro conteniendo la muestra al cartucho de extracción, colocar en un vaso de precipitados y secar 6-18 h a 100 ° C. 5.1.2. Determinación del porcentaje de grasa Añadir plato poroso previamente desgrasado al recipiente de extracción y secar 1 hora a 100 ° C. Enfriar a temperatura ambiente en un desecador y tarar. Colocar el cartucho de extracción en el sistema Soxhlet. Introducir 100 mL de éter de petróleo en los vasos de extracción e introducirlos en el sistema. Conectar el sistema de extracción y realizar una primera extracción introduciendo los cartuchos en el disolvente durante 30 minutos. A continuación, realizar una segunda extracción durante 30 minutos colocando los cartuchos en posición de “rising”. Una vez finalizada la extracción, evaporar el disolvente y secar a 100- 101°C hasta peso constante. Enfriar en desecador a temperatura ambiente y pesar. El p eso constante se alcanza cuando sucesivos períodos de secado muestran una disminución del peso menor al 0.05%. 5.2. Determinación del porcentaje de humedad en la muestra 5.2.1. Estandarización del reactivo Karl Fischer Para estandarizar el reactivo de Karl Fischer, se introduce en la cubeta conteniendo metanol y se realiza una valoración en blanco. A continuación, se procede a la valoración del reactivo. Para ello, se introducen en la cubeta 5 µL de agua (deben medirse con exactitud por lo que se utilizará una micropipeta o una microjeringa). La valoración se debe realizar por quintuplicado y la concentración del reactivo se expresa como mg de agua por mL de reactivo y también como moles de iodo por litro. 5.2.2. Determinación del contenido en agua de la muestra Para llevar a cabo la determinación se pesarán con exactitud alrededor de 50 mg d e muestra. La valoración se realizará al menos por triplicado. Para pesar la muestra debe utilizarse un pesasustancias de vidrio y realizar la pesada por diferencia. Es decir, se anotará el peso del pesasustancias con la muestra y posteriormente, tras el trasvase de la muestra a la celda del valorador, se anotará el peso del pesasustancias (que contendrá algunos miligramos de muestra si ésta no se ha transferido de forma cuantitativa a la celda). Tener la precaución de no tocar el pesa-substancias con la mano. La introducción de la muestra en la celda debe ser rápida para evitar la entrada de humedad ambiental en la celda. Se obtendrá una suspensión de la muestra en metanol y a continuación, se procede a su valoración como en el apartado anterior. El contenido en agua en la muestra se debe expresar en porcentaje m/m.", "Referencias": "• Fat in cacao products AOAC método oficial de análisis 963.15 • Moisture in cacao products AOAC método oficial de análisis 977.10 • DIRECTIVA 2000/36/CE DEL PARLAMENTO EUROPEO Y DEL CONSEJO de 23 de junio de 2000 relativa a los productos de cacao y de chocolate destinados a la alimentación humana", "Cuestiones finales": "1. En la determinación de agua por el método Karl Fischer, se exige realizar la pesada de los de muestra por diferencia utilizando un pesasustancias de vidrio, y se recalca que la introducción en la celda de valoración debe ser sumamente rápida. a) Si un alumno pesa la muestra en un granatario abierto sobre un cristal de reloj y tarda un minuto en transferirla a la celda, ¿el porcentaje de humedad obtenido será mayor o menor que el real? Justifica tu respuesta evaluando la higroscopicidad del cacao deshidratado y la composición del reactivo de Karl Fischer. b) ¿Por qué el error ambiental afecta de forma mucho más severa a la valoración Karl Fischer que a la determinación gravimétrica de humedad en estufa a de la Práctica 1? 2. El reactivo comercial de Karl Fischer contiene iodo, dióxido de azufre y una base orgánica en un disolvente anhidro. Dado que el iodo sufre procesos de degradación y pérdida de título con el tiempo debido a reacciones secundarias indeseadas, el procedimiento exige su estandarización inyectando exactamente de agua destilada por quintuplicado. a) Utilizando las ecuaciones químicas del fundamento, demuestra la relación molar estequiométrica entre el agua consumida y el iodo reducido en la celda amperométrica. b) Si el volumen medio de reactivo Karl Fischer consumido para valorar los 5 μL de agua pura ( d = 1.0 g mL –1) es de 2.5 mL, calcula el volumen del reactivo expresado en mg H₂O mL–1 de reactivo. 3. El sistema Soxhlet basa su alta eficiencia en un proceso de reflujo cerrado donde el disolvente orgánico (éter de petróleo) recircula continuamente a través de la muestra. Explica desde el punto de vista del equilibrio de fases y de la ley de distribución (o partición), por qué este lavado intermitente con porciones de disolvente puro condensado es infinitamente más eficaz para agotar la grasa del cartucho que realizar una única extracción sólido- líquido estática sumergiendo el cacao en el mismo volumen total de disolvente durante una hora. 4. Antes de colocar el cacao en el cartucho de extracción, el procedimiento exige hervir la muestra en HCl 8 M durante 15 minutos. a) Justifica el papel químico de esta digestión ácida para romper dichas estructuras. b) ¿Qué pasaría si omitiéramos este paso y realizáramos la extracción Soxhlet directamente sobre el cacao triturado crudo y por qué? 5. El éter de petróleo es el disolvente orgánico seleccionado para la extracción. a) A pesar de su nombre común, explica por qué químicamente no contiene la función éster ni éter, detallando de qué tipo de mezcla de hidrocarburos e isómeros alifáticos está compuesto. b) Teniendo en cuenta su bajísimo punto de ebullición y su alta inflamabilidad, justifica por qué en el laboratorio se prohíbe de forma estricta calentar el matraz del Soxhlet directamente sobre una llama abierta (mechero Bunsen)."}, "postQuestions": ["En la determinación de agua por el método Karl Fischer, se exige realizar la pesada de los de muestra por diferencia \nutilizando un pesasustancias de vidrio, y se recalca que la introducción en la celda de valoración debe ser sumamente rápida . \na) Si un alumno pesa la muestra en un granatario abierto so bre un cristal de reloj y tarda un minuto en transferirla a la \ncelda, ¿el porcentaje de humedad obtenido será mayor o menor que el real? Justifica tu respuesta evaluando la \nhigroscopicidad del cacao deshidratado y la composición del reactivo de Karl Fische r. \nb) ¿Por qué el error ambiental afecta de forma mucho más severa a la valoración Karl Fischer que a la determinación \ngravimétrica de humedad en estufa a de la Práctica 1?", "El reactivo comercial de Karl Fischer contiene iodo, dióxido de azufre y una base orgánica en un disolvente anhidro . Dado \nque el iodo sufre procesos de degradación y pérdida de título con el tiempo debido a reacciones secundarias indeseadas , el \nprocedimiento exige su estandarización inyectando exactamente de agua destilada por quintuplicado . \na) Utilizando las ecuaciones químicas del fundamento , demuestra la relación molar estequiométrica entre el agua \nconsumida y el iodo reducido en la celda amperométrica. \nb) Si el volumen medio de reactivo Karl Fischer consumido para valorar los 5 μL de agua pura ( d = 1.0 g mL –1) es de 2.5 \nmL, calcula el volumen del reactivo expresado en mg H2O mL–1 de reactivo.", "El sistema Soxhlet basa su alta eficiencia en un proceso de reflujo cerrado donde el disolvente orgánico (éter de petróleo) \nrecircula continuamente a través de la muestra. Explica desde el punto de vista del equilibrio de fases y de la ley de \ndistribución (o partición), por qué este lavado intermitente con porciones de disolvente puro condensado es infinitame nte \nmás eficaz para agotar la grasa del cartucho que realizar una única extracción sólido- líquido estática sumergiendo el cacao en \nel mismo volumen total de disolvente durante una hora.", "Antes de colocar el cacao en el cartucho de extracción, el procedimiento exige hervir la muestra en HCl 8 M durante 15 \nminutos. \na) Justifica el papel químico de esta digestión ácida para romper dichas estructuras. \nb) ¿Qué pasaría si omitiéramos este paso y realizáramos la extracción Soxhlet directamente sobre el cacao triturado \ncrudo y por qué?", "El éter de petróleo es el disolvente orgánico seleccionado para la extracción. \na) A pesar de su nombre común, explica por qué químicamente no contiene la función éster ni éter, detallando de qué \ntipo de mezcla de hidrocarburos e isómeros alifáticos está compuesto. \nb) Teniendo en cuenta su bajísimo punto de ebullición y su alta inflamabilidad, justifica por qué en el laboratorio se \nprohíbe de forma estricta calentar el matraz del Soxhlet directamente sobre una llama abierta (mechero Bunsen)."], "videos": [{"label": "Determinación de humedad y materia grasa en cacao", "url": "https://www.youtube.com/watch?v=_AT4o-xhzv0"}], "notice": "", "equations": ["RN + SO₂ + CH₃OH → [RNH]SO₃CH₃", "[RNH]SO₃CH₃ + I₂ + H₂O + 2 RN → [RNH]SO₄CH₃ + 2 [RNH]I"]}, {"number": 6, "short": "Fe y Mn en té", "title": "Determinación de Fe y Mn en té por absorción atómica", "startPage": 24, "endPage": 24, "sections": {"Objetivos": "- Desarrollar una metodología analítica desde cero - Evaluar la cantidad de Fe y Mn en hojas de té", "Fundamento teórico": "La espectrometría de absorción atómica de llama mide la absorción de radiación característica por átomos libres en estado fundamental. El desarrollo del método exige seleccionar preparación de muestra, líneas analíticas de Fe y Mn, intervalo de calibración, blancos, diluciones y controles de recuperación. El guion plantea esta práctica como una actividad abierta de diseño analítico basada en la referencia indicada.", "Riesgos y residuos": "Leer detenidamente las fichas de seguridad de los reactivos utilizados. Los residuos deben ser recogidos separadamente para su conveniente eliminación", "Material y reactivos": "", "Metodología": "Desarrollar un método basado en el trabajo desarrollado por Liu Qing.", "Referencias": "• Qing, Liu, Research of Trace Elements Content in Tea Based on Flame Atomic Absorption Spectrometry, International Conference on Materials Chemistry and Environmental Protection (MEEP 2015). https://www.atlantispress.com/proceedings/meep-15/25851195. DOI: 10.2991/meep-15. 2016.13", "Cuestiones finales": ""}, "postQuestions": [], "videos": [], "notice": ""}, {"number": 7, "short": "Aceites vegetales", "title": "Determinación de tocoferoles en aceites vegetales por cromatografía líquida de fase reversa con detección fluorimétrica y análisis de ácidos grasos en aceites vegetales por cromatografía de gases", "startPage": 25, "endPage": 31, "sections": {"Objetivos": "- Identificación y cuantificación de los tocoferoles presentes en un aceite vegetal mediante HPLC de fase reversa y detección fluorimétrica. - Evaluación de la composición cualitativa y cuantitativa de los ácidos grasos presentes en diversas muestras de aceites vegetales, a partir de los perfiles de sus ésteres metílicos, obtenidos mediante cromatografía de gases con detector de ionización de llama y su utilización para el control de fraudes.", "Fundamento teórico": "Los aceites vegetales de consumo humano están compuestos mayoritariamente por triglicéridos y ácidos grasos libres, lo cual constituye un 98 -99 % del total del aceite, mientras que el resto de los componentes minoritarios, denominada fracción insaponificable (tocoferoles, esteroles, alcoholes, etc.), constituye el 1- 2%. Los beneficios para la salud y la composición de estos aceites dependen del fruto/semilla del cual son obtenidos. De todos los aceites vegetales, el aceite de oliva es el más apreciado y consumido en la dieta mediterránea, debido a su a lto valor nutricional y sus grandes beneficios para la salud. Los aceites vegetales más apreciados pueden ser adulterados con otros aceites de menor calidad y bajo coste, por lo que es necesaria la existencia de metodologías analíticas rápidas y fiables pa ra establecer el origen, la calidad y la adulteración de los aceites. Tradicionalmente, la composición de los ácidos grasos ha sido utilizada como un marcador de calidad y pureza de un aceite, además de la medida de otros parámetros físico -químicos de calidad (índice de peróxidos, índices K, etc.). Las proporciones de ácidos grasos saturados e insaturados en los aceites vegetales dependen, entre otros factores, de la variedad botánica de la que han sido extraídos. A modo de ejemplo, en el aceite de oliva, l os ácidos grasos mayoritarios son el palmítico (7.5-20%), esteárico (0.5- 5%), palmitoleico (0.3- 3.5%), oleico (55- 85%), linoleico (7.5- 20%) y linolénico (0.0 -1.5%), y se encuentran a nivel de trazas los ácidos mirístico, margárico y araquídico. Se ha demostrado que las propiedades nutricionales de los aceites, especialmente el de oliva, depende también del perfil de ácidos grasos, además de su composición en antioxidantes (hasta el 2%). Por otra parte, los tocoferoles (Ts) y tocotrienoles (T3s) (ambos constituyentes de la vitamina E ) se encuentran en la fracción insaponificable. Estos compuestos se caracterizan por tener una estructura con dos anillos conocido como cromanol (un fenol sustituido con un éter cíclico), a la que se encuentra enlazada una cadena de 16 átomos de carbono (Figura 1). Según el número y posición de los sustituyentes metilo en el anillo fenólico, se pueden distinguir cuatro tocoferoles (α -T, β-T, γ-T y δ-T) y cuatro tocotrienoles (α -T3, β-T3, γ-T3 y δ -T3). Ambas series de compuestos contribuyen a la estabilidad de los aceites y los protegen de la oxidación, previenen la peroxidación lipídica en membranas biológicas y tienen un papel biológico beneficioso como antioxidantes. El análisis de los ácidos grasos libres se lleva a cabo hab itualmente mediante cromatografía de gases (GC) con detector de ionización de llama (FID), y éste, además, es su método oficial de análisis. Se han descrito en la literatura metodologías basadas en los perfiles de los ácidos grasos (por GC u otras técnicas), que permiten clasificar a los aceites vegetales según su origen botánico, y en concreto a los aceites de oliva según su diferente calidad, variedad genética y origen geográfico. En esta práctica, se evaluará la composición cualitativa y cuantitativa de los ácidos grasos presentes en diversas muestras de aceites vegetales, empleando GC de los ésteres de los ácidos grasos. Por otra parte, se analizará también el perfil de tocoferoles presentes en la muestra mediante la aplicación de HPLC-FLD. Posteriormente, se utilizarán dichos perfiles para la detección de la posible adulteración de un aceite de oliva. Tocoferol R1 R2 R3 α-T CH3 CH3 CH3 β-T CH3 H CH3 γ-T H CH3 CH3 δ-T H H CH3 Figura 1. Estructuras químicas de los Tocoferoles. Las estructuras de los Tocotrienoles son las mismas, pero con dobles enlaces entre los átomos de carbono 3’-4’, 7’-8’ y 11’-12’.", "Riesgos y residuos": "Tanto el metanol como el isopropanol son disolventes orgánicos inflamables y tóxicos por inhalación y por ingestión. Se manipularán dichos disolventes y sus disoluciones con precaución, evitando la exposición continuada de sus vapores, así como el contacto continuado con la piel. Asimismo, se manipularán lejos de llamas o fuentes de calor. El hidróxido potásico sólido y sus disoluciones causan irritaciones o quemaduras graves en los ojos y en la piel. Por su parte, el metanol y el hexano son disolventes orgánicos inflamables y tóxicos por inhalación, ingestión y contacto tópico. Se manipularán dichos disolventes y sus disoluciones con precaución, evitando la exposición continuada de sus vapores así como el contacto continuado con la piel. Asimismo, se manipularán lejos de llamas o fuentes de calor. Los residuos que contengan disolventes orgánicos, se verterán en los recipientes adecuado s situados en el laboratorio.", "Material y reactivos": "Reactivos: Butilhidroxitolueno (BHT), Metanol grado HPLC, Isopropanol de grado HPLC, Disolución patrón multicomponente de α-T+ γ-T+δ-T de 10 mg L -1, disolución patrón de β -T de 10 mg L -1. (preparados). Patrón de referencia de ésteres metílicos de los siguientes ácidos grasos: Palmítico (C16:0), esteárico (C18:0), oleico (C18:1), linoleico (C18:2) y linolénico (C18:3) (2000 µg mL-1 de cada analito en hexano) (preparados), KOH, Metanol, Hexano. Instrumentación: Cromatógrafo líquido con detector de fluorescencia y provisto de una columna C18. Cromatógrafo de gases equipado con un detector de ionización de llama e inyector automático y provisto de una columna de fase estacionaria polar de poli(etilenglicol) 20000 Da, 30 m, 0.25 mm ID, 0.25 µm. Muestra: Aceites vegetales de diferente origen.", "Metodología": "5.1 Preparación de la muestra El procedimiento para la preparación de la muestra está basado en una transesterificación en frío con una disolución metanólica de hidróxido potásico. Dicho método puede aplicarse directamente a aceites de oliva y de orujo de oliva con un contenido en acidez libre (ácidos grasos libres) inferior al 3.3%, así como a otros aceites vegetales. En un tubo de rosca se pesan aproximadamente 0.1 g de la muestra de aceite. Se añaden 2 mL de hexano, y se agita. A continuación, se adicionan 0.2 mL de una disolución metanólica de KOH 1 2 M, se cierra el tubo y, se agita enérgicamente durante 30 segundos. Se deja reposar hasta que se separen bien las dos fases, tomándose una alícuota de la parte superior, la cual se colocará en un vial para su inyección en el cromatógrafo. Es aconsejable mantener la disolución a 4°C hasta el momento de realizar el análisis cromatográfico. No se recomiendaguardar dicha disolución durante más de 12 h. 1Nota: El KOH es poco soluble en MeOH y puede observarse la aparición de un precipitado al poco tiempo de preparar la disolución. En tal caso, antes de usarla es necesario filtrarla. 5.2. Obtención de los perfiles cromatográficos Una vez preparadas las muestras se registran los cromatogramas de las diferentes muestras de aceites, así como de la disolución de referencia utilizando las siguientes condiciones instrumentales:  Caudal de gas portador (N2): 3 mL/min  Volumen de inyección: 1 μL  Modo de inyección: con división de flujo (relación 1:50)  Temperatura inyector: 250°C  Temperatura horno (columna): 200°C durante 1 min, seguido de un aumento de 6°C/min hasta 230°C, y 6 min a 230°C.  Temperatura del detector: 250°C Una vez obtenidos los cromatogramas, para la identificación de los diversos ésteres metílicos se compararán los tiempos de retención con los obtenidos en la mezcla de referencia. 100A A(%) A i i ⋅ = ∑ i Además, a partir del área de cada pico correspondiente a los ésteres metílicos (A i) en el cromatograma se calculan las áreas relativas: Estas áreas relativas se equipararán al contenido relativo de cada componente estableciéndose los perfiles para cada uno de los aceites estudiados. Por último, se analizará el perfil de una muestra de aceite problema, y se comparará con algunos de los aceites estudiados con objeto de discernir si se trata de un aceite adulterado así como la posible fuente de adulteración. Para facilitar la detecci ón de la adulteración, es recomendable trabajar con las relaciones oleico/linoléico y oleico/linolénico. 6. PROCEDIMIENTO TOCOFEROLES 6.1. Preparación de la muestra y de las disoluciones de calibrado Se pesan por triplicado con exactitud aproximadamente 0.2 g de muestra, se disuelven en 10 mL de disolución de isopropanol que contienen BHT al 0.1%. A continuación, se realizan diluciones adecuadas con isopropanol al 0.1% en BHT con el fin de ajustar la concentración de la disolución de medida al intervalo lineal de concentraciones. Para llevar a cabo las diluciones se deben utilizar matraces aforados de 10 mL. A partir de las disoluciones patrón se preparan disoluciones de calibrado multicomponente en isopropanol al 0.1% en BHT entre 0.2 y 2 mg·L-1 (por ejemplo 0.2; 0.5; 0.75; 1.0; 1.5; 2.0 y 3.0 mg·L-1, ya preparados). Las disoluciones se deben guardar en viales de topacio a -20°C hasta su inyección en el cromatógrafo. 6.2. Intervalo lineal y determinación de tocoferoles en la muestra La fase móvil debe filtrarse y desgasificarse antes de su utilización. La separación cromatográfica se llevará a cabo utilizando las siguientes condiciones instrumentales:  Elución isocrática empleando una fase móvil metanol MeOH:agua 99:1 (v/v)  Flujo de 1 mL min−1  Detección fluorimétrica: λexc=296 nm y λem=330 nm.  Volumen de inyección: 20 μL. Las disoluciones deben filtrarse a través de filtros de nyl on de 0. 45 μm de tamaño de poro antes de su introducción en el cromatógrafo. Una vez estabilizada la línea base, se inyectarán las disoluciones de calibrado. Tras obtener los cromatogramas correspondientes, se procederá a la integración de los diferentes picos cromatográficos y a la representación de las curvas de calibrado. Por último, se procederá a realizar la dilución necesaria de las muestras en función del contenido esperado y se interpolarán las señales obtenidas en el calibrado. Si las señales exceden el rango lineal, se diluirá la muestra según sea necesario. El resultado se expresará como mg kg-1.", "Referencias": "1. Psomiadou, E.; Tsimidou, M. y Agric, J. Food Chem. 1998, 46, 5132-5138. 2. Panfili, G.; Fratianni, A.; Irano, M. y Agric, J. Food Chem. 2003, 51, 3940-3944. 3. Gunstone, F. D. Vegetable oils in Food Technology, CRC Press, 2002. 4. Melchert, H. U.; Pollock, D.; Pabel, E.; Ruback, K. y Stan, H. J. J Chromatogr. A 2002, 976, 215–220. 5. Abidi, S. L. J. Chromatogr. A 2000, 881, 197-216. 6. Reglamento CE nº 2568/91 y sus posteriores modificaciones (1989/2003, 702/2007, 640/2008) relativo a las características de los aceites de oliva, de los aceites de orujo de oliva y sus métodos de análisis. 7. http://www.mapya.es (Normas de calidad de alimentos del Ministerio de Agricultura, Pesca y Alimentación) 8. http://www.panreac.es (Manual descargable de los métodos oficiales de análisis de aceites y grasas) 9. Gunstone, F. D. Vegetable oils in Food Technology, CRC Press, Oxford, 2002. 10. Norma UNE -EN-ISO 5508:1996, Aceites y grasas de origen animal y vegetal. Análisis por cromatografía de gases de los ésteres metílicos de los ácidos grasos. 6. Lerma-García, M. J.; Herrero-Martínez, J. M.; Ramis-Ramos, G. y Simó-Alfonso, E. F. Food Chem. 2008, 107, 1307. 7. Lerma-García, M. J.; Herrero-Martínez, J. M.; Ramis-Ramos, G. y Simó-Alfonso, E. F. Food Chem. 2008, 108, 1142.", "Cuestiones finales": "7.1. Cuestiones importantes 1. Los triglicéridos constituyen el 98- 99% del aceite vegetal. Explica razonadamente por qué es metodológicamente imposible inyectar el aceite de oliva directo en el cromatógrafo de gases para analizar sus ácidos grasos sin realizar la transesterificación previa con KOH en metanol. Basándote en las propiedades físicas de los triglicéridos frente a los ésteres metílicos (FAMES), justifica cómo afecta la masa molecular y la presencia de enlaces éster de glicerol a la volatilidad, la presión de vapor y l a estabilidad térmica en el inyector a 250 ºC. 2. En el análisis de FAMES se utiliza una columna capilar de GC con una fase estacionaria polar de poli(etilenglicol), mientras que en el análisis de tocoferoles se utiliza una columna de HPLC de fase reversa C18 (apolar). a. En la columna polar de GC, explica el orden de elución de los FAMES de 18 carbonos. b. En la columna apolar C18 de HPLC, razona el orden de elución de la serie homóloga de los tocoferoles. 3. Para el análisis de tocoferoles por HPLC se emplea un detector de fluorescencia ( λexc = 296 nm, λem = 330 nm) en lugar de un detector de absorción UV convencional. Sabiendo que los triglicéridos de la matriz del aceite son el componente mayoritario de la muestra, justifica las ventajas que ofrece la detección fluorimétrica para cuantificar trazas de tocoferoles en la fracción insaponificable. 4. Un aceite de oliva virgen extra ha sido adulterado sutilmente con una mezcla de aceite de girasol de alto oleico (cuyo perfil de ácidos grasos mimetiza casi a la perfección las proporciones de oleico y linoleico del olivo). Explica por qué el análisis exclusivo por GC-FID de las áreas relativas de los ácidos grasos podría fallar en la de tección de este fraude y cómo los perfiles absolutos de tocoferoles obtenidos por HPLC -FLD (analizando las concentraciones de α -T frente a la suma de β +γ-T) actúan como una huella dactilar inequívoca para delatar la presencia del aceite de semillas. 5. Durante la preparación de los patrones y las muestras de tocoferoles para HPLC, el procedimiento exige diluirlos obligatoriamente en isopropanol que contiene un 0.1% de butilhidroxitolueno (BHT), almacenando los viales en la oscuridad a -20 ºC. Justifica la necesidad química de adicionar BHT a las disoluciones y almacenarlas bajo congelación, y predice cómo afectaría a la pendiente de la recta de calibrado si los patrones de tocoferoles se dejaran expuestos a temperatura ambiente sobre la poyata del laboratorio durante varios días. 6. En la práctica de GC se utiliza el método de normalización interna (asumiendo que la suma de las áreas de los picos integrados es igual al 100% de los ácidos grasos del aceite). Explica de forma razonada: a. ¿Qué error se cometería en el perfil si la muestra contuviera una cantidad significativa de ácidos grasos libres de cadena muy corta o compuestos volátiles que eluyeran antes del tiempo de integración del software? ¿Se trataría de un error sistemático o aleatorio? b. ¿Por qué este método de normalización es adecuado para este tipo de análisis mediante GC, a diferencia del método de calibración externa? 7.2. Contenido aproximado de tocoferoles en diferentes aceites"}, "postQuestions": ["Los triglicéridos constituyen el 98- 99% del aceite vegetal. Explica razonadamente por qué es metodológicamente imposible \ninyectar el aceite de oliva directo en el cromatógrafo de gases para analizar sus ácidos grasos sin realizar la transesterifi cación \nprevia con KOH en metanol. Basándote en las propiedades físicas de los triglicéridos frente a los ésteres metílicos (FAME S), \njustifica cómo afecta la masa molecular y la presencia de enlaces éster de glicerol a la volatilidad, la presión de vapor y l a \nestabilidad térmica en el inyector a 250 ºC.", "En el análisis de FAMES se utiliza una columna capilar de GC con una fase estacionaria polar de poli(etilenglicol), mientras \nque en el análisis de tocoferoles se utiliza una columna de HPLC de fase reversa C18 (apolar). \na. En la columna polar de GC, explica el orden de elución de los FAMES de 18 carbonos. \nb. En la columna apolar C18 de HPLC, razona el orden de elución de la serie homóloga de los tocoferoles.", "Para el análisis de tocoferoles por HPLC se emplea un detector de fluorescencia ( λexc = 296 nm, λem = 330 nm) en lugar de un\ndetector de absorción UV convencional. Sabiendo que los triglicéridos de la matriz del aceite son el componente mayoritario \nde la muestra , justifica las ventajas que ofrece la detección fluorimétrica para cuantificar trazas de tocoferoles en la fracción \ninsaponificable.", "Un aceite de oliva virgen extra ha sido adulterado sutilmente con una mezcla de ace ite de girasol de alto oleico (cuyo perfil \nde ácidos grasos mimetiza casi a la perfección las proporciones de oleico y linoleico del olivo). Explica por qué el análisis \nexclusivo por GC-FID de las áreas relativas de los ácidos grasos podría fallar en la de tección de este fraude y cómo los perfiles \nabsolutos de tocoferoles obtenidos por HPLC -FLD (analizando las concentraciones de α -T frente a la suma de β +γ-T) actúan \ncomo una huella dactilar inequívoca para delatar la presencia del aceite de semillas.", "Durante la preparación de los patrones y las muestras de tocoferoles para HPLC, el procedimiento exige diluirlos \nobligatoriamente en isopropanol que contiene un 0.1% de butilhidroxitolueno (BHT), almacenando los viales en la oscuridad a \n-20 ºC. Justifica la n ecesidad química de adicionar BHT a las disoluciones y almacenarlas bajo congelación , y predice cómo \nafectaría a la pendiente de la recta de calibrado si los patrones de tocoferoles se dejaran expuestos a temperatura ambiente \nsobre la poyata del laboratorio durante varios días.", "En la práctica de GC se utiliza el método de normalización interna (asumiendo que la suma de las áreas de los picos \nintegrados es igual al 100% de los ácidos grasos del aceite). Explica de forma razonada: \na. ¿Qué error se cometería en el perfil si la muestra contuviera una cantidad significativa de ácidos grasos libres de \ncadena muy corta o compuestos volátiles que eluyeran antes del tiempo de integración del software? ¿Se trataría de \nun error sistemático o aleatorio? \nb. ¿Por qué este método de normalización es adecuado para este tipo de análisis mediant
